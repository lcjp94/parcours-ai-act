<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parcours AI Act</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout : style Apple — barre de navigation translucide, grands titres serrés, cartes blanches arrondies sur fond gris clair, boutons en pilule. Colonne de lecture ~70ch. */
:root{
  --bg:#F5F5F7; --surface:#FFFFFF; --sunk:#F0F0F3; --fill:#E8E8ED; --ink:#1D1D1F; --muted:#6E6E73; --line:#D2D2D7;
  --nav:rgba(251,251,253,.78);
  --accent:#0071E3; --accent-ink:#FFFFFF; --accent-soft:#E8F1FC; --link:#0066CC;
  --r-interdit:#D70015; --r-haut:#C93400; --r-transp:#A05A00; --r-min:#248A3D; --on-risk:#FFFFFF;
  --ok:#248A3D; --ok-soft:#E9F6EC; --bad:#D70015; --bad-soft:#FDECEE; --warn-soft:#FFF6E0;
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  --f-display:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --f-body:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --f-mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-lg:18px; --r-md:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --sunk:#2C2C2E; --fill:#3A3A3C; --ink:#F5F5F7; --muted:#A1A1A6; --line:#38383A;
  --nav:rgba(22,22,23,.78);
  --accent:#0A84FF; --accent-ink:#FFFFFF; --accent-soft:#0A2540; --link:#2997FF;
  --r-interdit:#FF6961; --r-haut:#FFB340; --r-transp:#FFD426; --r-min:#30D158; --on-risk:#1D1D1F;
  --ok:#30D158; --ok-soft:#0F2A17; --bad:#FF6961; --bad-soft:#3A1715; --warn-soft:#332709;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --sunk:#2C2C2E; --fill:#3A3A3C; --ink:#F5F5F7; --muted:#A1A1A6; --line:#38383A;
  --nav:rgba(22,22,23,.78);
  --accent:#0A84FF; --accent-ink:#FFFFFF; --accent-soft:#0A2540; --link:#2997FF;
  --r-interdit:#FF6961; --r-haut:#FFB340; --r-transp:#FFD426; --r-min:#30D158; --on-risk:#1D1D1F;
  --ok:#30D158; --ok-soft:#0F2A17; --bad:#FF6961; --bad-soft:#3A1715; --warn-soft:#332709;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;letter-spacing:-.011em;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--nav)}
a{color:var(--link);text-decoration:none} a:hover{text-decoration:underline}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:8px;min-height:52px}
.brand{font-family:var(--f-display);font-weight:600;font-size:1.05rem;letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand small{font-size:.72rem;color:var(--muted);font-weight:400;letter-spacing:0}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;background:var(--fill);border-radius:980px;padding:3px}
nav.tabs:empty{display:none}
.lang{display:flex;gap:2px;background:var(--fill);border-radius:980px;padding:3px}
.lang button{font:inherit;font-size:.75rem;font-weight:600;letter-spacing:.02em;background:none;border:0;color:var(--muted);padding:4px 10px;border-radius:980px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
nav.tabs button{font:inherit;font-size:.82rem;background:none;border:0;color:var(--ink);padding:5px 14px;border-radius:980px;cursor:pointer}
nav.tabs button[aria-current="true"]{background:var(--surface);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
nav.tabs .count{font-size:.7rem;font-weight:600;background:var(--bad);color:#fff;border-radius:980px;padding:0 6px;margin-left:5px}
main .wrap{padding-block:40px 80px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.08;letter-spacing:-.025em;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,5vw,3rem)} h2{font-size:clamp(1.4rem,3vw,1.75rem);font-weight:600;line-height:1.15} h3{font-size:1.15rem;font-weight:600;letter-spacing:-.015em;line-height:1.25}
p{margin:0}
.eyebrow{font-size:.85rem;font-weight:600;color:var(--r-haut);letter-spacing:-.005em}
.lede{color:var(--muted);max-width:62ch;font-size:1.06rem}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-lg{display:flex;flex-direction:column;gap:36px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:500;font-size:.95rem;border-radius:980px;padding:10px 20px;cursor:pointer;border:0;background:var(--accent);color:var(--accent-ink);transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.quiet{background:var(--fill);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label.opt:focus-within,.art:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
.panel{background:var(--surface);border-radius:var(--r-lg);padding:24px;box-shadow:var(--shadow)}
.notice{background:var(--warn-soft);border-radius:var(--r-md);padding:14px 16px;font-size:.92rem}
.art{font-family:var(--f-body);font-size:.82em;font-weight:500;background:var(--sunk);border-radius:6px;padding:1px 7px;white-space:nowrap}
.verify{font-size:.72rem;font-weight:600;color:var(--r-haut);background:color-mix(in srgb,var(--r-haut) 12%,transparent);border-radius:980px;padding:1px 8px;margin-left:4px;white-space:nowrap}
/* Accueil */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:40px;align-items:center}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(2.2rem,6vw,3.5rem)}
.pyr-card{background:var(--surface);border-radius:var(--r-lg);padding:28px 24px;box-shadow:var(--shadow)}
.pyr{display:flex;flex-direction:column;align-items:center;gap:5px}
.pyr div{color:var(--on-risk);font-size:.82rem;font-weight:600;text-align:center;padding:9px 6px;border-radius:10px;line-height:1.25}
.pyr div span{display:block;font-weight:400;font-size:.7rem;opacity:.9}
.pyr .l1{width:44%;background:var(--r-interdit)} .pyr .l2{width:63%;background:var(--r-haut)} .pyr .l3{width:82%;background:var(--r-transp)} .pyr .l4{width:100%;background:var(--r-min)}
.profiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.profile{text-align:left;font:inherit;color:inherit;background:var(--surface);border:0;border-radius:var(--r-lg);padding:28px;cursor:pointer;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transition:transform .2s ease, box-shadow .2s ease}
.profile:hover{transform:scale(1.015);box-shadow:0 8px 28px rgba(0,0,0,.08)}
.profile .meta{font-size:.85rem;color:var(--muted)}
.profile .go{color:var(--link);font-size:.95rem;margin-top:4px}
.creator{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--r-min));color:#fff;display:grid;place-items:center;font-weight:600;font-size:1.05rem;flex:none}
/* Tableau de bord */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}
.kpi{background:var(--surface);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
.kpi b{display:block;font-family:var(--f-display);font-size:1.9rem;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:.85rem;color:var(--muted)}
.bar{height:6px;background:var(--fill);border-radius:980px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:980px}
.path{display:flex;flex-direction:column;border-radius:var(--r-lg);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.step{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 20px;position:relative}
.step + .step::before{content:"";position:absolute;top:0;left:76px;right:0;border-top:1px solid var(--line)}
.step .num{font-size:.85rem;font-weight:600;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--muted)}
.step.passed .num{background:var(--ok);color:#fff}
.step.current .num{background:var(--accent);color:#fff}
.step.locked{opacity:.5}
.step h3{font-size:1.02rem}
.step p{font-size:.88rem;color:var(--muted)}
.chip{font-size:.72rem;font-weight:500;border-radius:980px;padding:2px 9px;background:var(--fill);color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--ok);background:var(--ok-soft)} .chip.acq{color:var(--accent);background:var(--accent-soft)} .chip.cur{background:var(--accent-soft);color:var(--accent)}
@media (max-width:520px){.step{grid-template-columns:34px minmax(0,1fr)}.step .act{grid-column:2}.step + .step::before{left:20px}}
/* Module */
.module-head{display:flex;flex-direction:column;gap:12px;padding-bottom:8px}
.lesson{max-width:68ch;display:flex;flex-direction:column;gap:14px}
.lesson h2{font-size:1.5rem}
.lesson ul,.lesson ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.lesson.deep{background:var(--surface);border-radius:var(--r-lg);padding:24px;box-shadow:var(--shadow)}
.lesson .tag{font-size:.82rem;font-weight:600;color:var(--accent)}
.tbl{overflow-x:auto;border-radius:var(--r-md);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
th{font-weight:600;font-size:.8rem;color:var(--muted);border-top:0;background:transparent}
td.date{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500}
.keypts{background:var(--surface);border-radius:var(--r-lg);padding:22px 24px;max-width:68ch;box-shadow:var(--shadow)}
.keypts ul{margin:10px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.deliv{background:var(--accent-soft);border-radius:var(--r-lg);padding:22px 24px;max-width:68ch;display:flex;flex-direction:column;gap:10px}
/* Quiz */
.q{display:flex;flex-direction:column;gap:18px;max-width:66ch}
.q .prompt{font-family:var(--f-display);font-size:1.45rem;font-weight:600;letter-spacing:-.02em;line-height:1.25}
.opts{display:flex;flex-direction:column;gap:10px}
label.opt{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:2px solid transparent;border-radius:var(--r-md);background:var(--surface);cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s}
label.opt:hover{border-color:var(--line)}
label.opt:has(input:checked){border-color:var(--accent)}
label.opt input{margin-top:4px;accent-color:var(--accent)}
label.opt.right{border-color:var(--ok);background:var(--ok-soft)}
label.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.feedback{border-radius:var(--r-md);padding:14px 16px;font-size:.95rem}
.feedback.ok{background:var(--ok-soft)} .feedback.ko{background:var(--bad-soft)}
.progress-dots{display:flex;gap:5px}
.progress-dots i{flex:1;max-width:40px;height:4px;border-radius:980px;background:var(--fill)}
.progress-dots i.done{background:var(--accent)}
/* Outil */
.tool{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.tool{grid-template-columns:1fr}}
fieldset{border:0;border-radius:var(--r-lg);padding:18px 20px;margin:0;background:var(--surface);display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
legend{font-weight:600;font-size:.95rem;padding:0;float:left;width:100%;margin-bottom:6px}
fieldset label{display:flex;gap:10px;align-items:flex-start;font-size:.92rem}
fieldset label input{margin-top:4px;accent-color:var(--accent)}
.field{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%}
.hint{font-size:.82rem;color:var(--muted)}
.result{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.verdict{border-radius:var(--r-md);padding:16px 18px;color:var(--on-risk);font-weight:600;font-size:1.05rem}
.verdict.v-int{background:var(--r-interdit)} .verdict.v-hr{background:var(--r-haut)} .verdict.v-tr{background:var(--r-transp)} .verdict.v-min{background:var(--r-min)} .verdict.v-out{background:var(--muted);color:var(--surface)}
textarea{font:inherit;font-family:var(--f-mono);font-size:.8rem;width:100%;min-height:120px;border:1px solid var(--line);border-radius:var(--r-md);padding:12px;background:var(--surface);color:var(--ink)}
.sources{font-size:.82rem;color:var(--muted)}
/* Assistant de livrables */
.dv-in{font-family:var(--f-body);font-size:.95rem;line-height:1.45;min-height:0;resize:vertical}
.dv-tbl td{min-width:200px} .dv-tbl td:first-child{min-width:150px}
.dv-tbl textarea{border:0;background:var(--sunk);padding:8px 10px;border-radius:8px}
.dv-sec{max-width:100%}
#dv-msg:has(textarea){flex-basis:100%}
.doc{background:var(--surface);border-radius:var(--r-lg);padding:clamp(20px,4vw,40px);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.doc h1{font-size:clamp(1.5rem,3vw,2rem)} .doc h2{font-size:1.15rem;margin-top:14px}
.doc .tbl{box-shadow:none;border:1px solid var(--line)}
.doc-foot{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
/* Pied de page */
footer.foot{border-top:1px solid var(--line);background:var(--bg)}
footer.foot .wrap{padding-block:24px 32px;display:flex;flex-direction:column;gap:14px;font-size:.78rem;color:var(--muted);line-height:1.5}
.foot-top{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line)}
.foot-top b{color:var(--ink);font-weight:600}
.contact{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.mail{display:inline-flex;align-items:center;gap:6px}
.mail code{font-family:var(--f-body);color:var(--ink);user-select:all}
.copy{font:inherit;font-size:.74rem;border:0;background:var(--fill);color:var(--ink);border-radius:980px;padding:2px 10px;cursor:pointer}
.disclaimer{color:var(--ink);font-weight:500}
/* Info-bulles d'articles */
.art{cursor:help;color:var(--ink);transition:background .15s,color .15s}
.art:hover,.art[aria-expanded="true"]{background:var(--accent-soft);color:var(--accent)}
.art.rgpd{box-shadow:inset 0 -1px 0 var(--muted)}
#tip{position:fixed;z-index:20;width:min(380px,calc(100vw - 32px));max-height:min(60vh,440px);overflow:auto;background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:16px 18px;font-size:.88rem;line-height:1.5;display:flex;flex-direction:column;gap:8px}
#tip .t-ref{font-size:.75rem;font-weight:600;color:var(--accent)}
#tip .t-title{font-family:var(--f-display);font-weight:600;font-size:1.02rem;letter-spacing:-.015em;line-height:1.3}
#tip .t-par{background:var(--sunk);border-radius:10px;padding:10px 12px}
#tip .t-par b{font-size:.75rem;font-weight:600;color:var(--muted);display:block}
#tip ul{margin:0;padding-left:1.1em}
#tip .t-foot{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:8px;font-size:.76rem;color:var(--muted)}
#tip a{font-weight:500}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<header class="top"><div class="wrap">
  <div class="brand"><span id="brand-name">Parcours AI Act</span> <small id="brand-sub">Règl. (UE) 2024/1689</small></div>
  <nav class="tabs" id="tabs" aria-label="Navigation"></nav>
  <div class="lang" role="group" aria-label="Langue / Language">
    <button type="button" data-lang="fr" lang="fr">FR</button><button type="button" data-lang="en" lang="en">EN</button>
  </div>
</div></header>
<main><div class="wrap" id="app"></div></main>
<footer class="foot"><div class="wrap" id="foot"></div></footer>

<script>
const CONTENT = {};
CONTENT.fr = (()=>{
const MODULES = [
{ id:"m1", title:"Les fondamentaux", dur:"45 min", profiles:["cadre","resp"],
  goal:"Comprendre ce qu’est l’AI Act, ce qu’il couvre et sa logique fondée sur les risques.",
  lessons:[
   {h:"Un règlement, pas une directive", body:`<p>L’AI Act est le <b>règlement (UE) 2024/1689</b>, publié au Journal officiel le 12 juillet 2024 et entré en vigueur le <b>1er août 2024</b>. Un règlement s’applique directement dans tous les États membres, sans loi de transposition. Il a été modifié une première fois par le <b>règlement Omnibus (UE) 2026/1744</b>, en vigueur depuis le 27 juillet 2026.</p>
   <p>Son objectif : favoriser une IA digne de confiance et centrée sur l’humain, tout en protégeant la santé, la sécurité et les droits fondamentaux.</p>`},
   {h:"Qu’est-ce qu’un « système d’IA » ?", body:`<p>La définition <span class="art">Art. 3(1)</span> repose sur quelques critères : un système <b>fondé sur une machine</b>, conçu pour fonctionner avec un certain niveau d’<b>autonomie</b>, pouvant faire preuve d’<b>adaptabilité</b> après déploiement, et qui <b>déduit</b>, à partir des entrées reçues, comment générer des sorties (prédictions, contenus, recommandations, décisions) pouvant influencer un environnement physique ou virtuel.</p>
   <p>Le critère décisif est l’<b>inférence</b>. Un logiciel qui applique uniquement des règles écrites par un humain (un tableur, un script « si… alors ») n’est en principe pas un système d’IA. La Commission a publié des lignes directrices sur cette définition.</p>`},
   {h:"Qui est concerné ?", body:`<p>Le champ d’application <span class="art">Art. 2</span> est large et <b>extraterritorial</b> : il vise les fournisseurs qui mettent un système sur le marché de l’UE, même établis hors UE, les déployeurs établis dans l’UE, et les acteurs hors UE dont les sorties du système sont utilisées dans l’UE.</p>
   <p>Exclusions principales : usages exclusivement militaires, de défense ou de sécurité nationale ; recherche et développement scientifique ; activités de recherche avant mise sur le marché ; usage purement personnel et non professionnel par une personne physique.</p>`},
   {h:"L’approche par les risques", body:`<p>Les obligations sont proportionnées au risque :</p>
   <ul><li><b>Risque inacceptable</b> : pratiques interdites <span class="art">Art. 5</span>.</li>
   <li><b>Haut risque</b> : exigences lourdes <span class="art">Art. 6 à 49</span>.</li>
   <li><b>Risque de transparence</b> : obligations d’information <span class="art">Art. 50</span>.</li>
   <li><b>Risque minimal</b> : pas d’obligation spécifique, codes de conduite volontaires.</li></ul>
   <p>En parallèle, un régime distinct vise les <b>modèles d’IA à usage général</b> (GPAI), comme les grands modèles de langage <span class="art">Chap. V</span>.</p>`},
  ],
  keypts:["Règlement d’application directe, en vigueur depuis le 1er août 2024.","La notion clé du système d’IA est l’inférence.","Portée extraterritoriale.","Quatre niveaux de risque + régime GPAI."],
  deliv:"Fiche de 2 pages « L’AI Act en 10 définitions » : système d’IA, fournisseur, déployeur, mise sur le marché, mise en service, finalité prévue, modification substantielle, GPAI, risque systémique, AI literacy.",
  quiz:[
   {id:"m1q1",lvl:1,p:"L’AI Act est juridiquement…",o:["Une directive à transposer en droit français","Un règlement d’application directe","Une recommandation non contraignante","Une norme ISO"],a:1,e:"Le règlement (UE) 2024/1689 s’applique directement dans tous les États membres."},
   {id:"m1q2",lvl:1,p:"Quel critère distingue le mieux un système d’IA d’un logiciel classique ?",o:["Il est hébergé dans le cloud","Il déduit de ses entrées comment générer des sorties (inférence)","Il utilise une base de données","Il a une interface conversationnelle"],a:1,e:"L’article 3(1) met l’inférence au cœur de la définition."},

{ id:"m2", title:"Calendrier et Omnibus 2026", dur:"30 min", profiles:["cadre","resp"],
  goal:"Savoir ce qui s’applique déjà, ce qui a été reporté, et éviter l’erreur « l’AI Act est repoussé ».",
  lessons:[
   {h:"Une application par étapes", body:`<p>L’AI Act ne s’applique pas d’un bloc. L’Omnibus 2026/1744, adopté par le Parlement le 16 juin 2026 et par le Conseil le 29 juin 2026, publié au JO le 24 juillet et entré en vigueur le 27 juillet 2026, a décalé les obligations haut risque mais <b>pas</b> la transparence.</p>
   <div class="tbl"><table><thead><tr><th>Date</th><th>Ce qui s’applique</th></tr></thead><tbody>
   <tr><td class="date">02/02/2025</td><td>Pratiques interdites <span class="art">Art. 5</span> ; maîtrise de l’IA <span class="art">Art. 4</span></td></tr>
   <tr><td class="date">02/08/2025</td><td>Obligations des fournisseurs de modèles GPAI ; gouvernance ; régime national de sanctions</td></tr>
   <tr><td class="date">27/07/2026</td><td>Entrée en vigueur de l’Omnibus ; nouvel article 4 (maîtrise de l’IA)</td></tr>
   <tr><td class="date">02/08/2026</td><td>Application générale ; transparence <span class="art">Art. 50</span> ; pouvoirs d’enforcement du Bureau de l’IA et des autorités nationales ; amendes GPAI</td></tr>
   <tr><td class="date">02/12/2026</td><td>Deux nouvelles interdictions (contenus intimes non consentis, pédocriminalité) ; fin du délai de marquage pour les systèmes génératifs mis sur le marché avant le 2 août 2026</td></tr>
   <tr><td class="date">02/08/2027</td><td>Conformité des modèles GPAI mis sur le marché avant le 2 août 2025</td></tr>
   <tr><td class="date">02/12/2027</td><td>Haut risque « autonome » <b>Annexe III</b> (recrutement, crédit, éducation…) — au lieu du 2 août 2026</td></tr>
   <tr><td class="date">02/08/2028</td><td>Haut risque intégré à des produits <b>Annexe I</b> — au lieu du 2 août 2027</td></tr>
   <tr><td class="date">02/08/2030</td><td>Systèmes haut risque déjà utilisés par des autorités publiques</td></tr>
   </tbody></table></div>`},
   {h:"Report n’est pas pause", body:`<p>En octobre 2026, une entreprise qui fournit ou utilise de l’IA doit déjà respecter : les <b>interdictions</b>, l’<b>article 4</b> sur la maîtrise de l’IA, les obligations <b>GPAI</b> (pour les fournisseurs de modèles) et la <b>transparence</b> de l’article 50.</p>
   <p>Le report du haut risque donne du temps pour se préparer, pas une dispense. Les normes harmonisées, dont le retard a motivé le report, continuent d’être élaborées.</p>`},
   {h:"Les systèmes déjà sur le marché", lvl:2, body:`<p>Le régime transitoire de l’<span class="art">Art. 111</span> prévoit que les systèmes haut risque mis sur le marché ou en service avant la date d’application du chapitre III (2 décembre 2027 pour l’Annexe III, 2 août 2028 pour l’Annexe I, selon l’<span class="art">Art. 113</span>) ne sont soumis au règlement que s’ils subissent ensuite des <b>modifications importantes de leur conception</b>. Exception : ceux destinés à être utilisés par des autorités publiques doivent être mis en conformité au plus tard le <b>2 août 2030</b>.</p>`},
  ],
  keypts:["Interdictions et maîtrise de l’IA : depuis février 2025.","Transparence art. 50 : depuis le 2 août 2026, non reportée.","Haut risque Annexe III : 2 décembre 2027 ; Annexe I : 2 août 2028."],
  deliv:"Frise chronologique d’une page adaptée à une entreprise fictive : ce qui s’applique aujourd’hui, en décembre 2026, en décembre 2027.",
  quiz:[
   {id:"m2q1",lvl:1,p:"Depuis quand les pratiques d’IA interdites sont-elles applicables ?",o:["1er août 2024","2 février 2025","2 août 2026","2 décembre 2027"],a:1,e:"Les interdictions de l’article 5 s’appliquent depuis le 2 février 2025."},
   {id:"m2q2",lvl:1,p:"L’Omnibus 2026 a-t-il reporté les obligations de transparence de l’article 50 (chatbots, deepfakes) ?",o:["Oui, à décembre 2027","Non, elles s’appliquent depuis le 2 août 2026","Oui, à août 2028","Elles ont été supprimées"],a:1,e:"Seul un délai de marquage technique jusqu’au 2 décembre 2026 a été prévu pour les systèmes génératifs déjà sur le marché."},
   {id:"m2q3",lvl:1,p:"Nouvelle date d’application des obligations haut risque pour un outil de tri de CV (Annexe III) :",o:["2 août 2026","2 décembre 2027","2 août 2028","2 août 2030"],a:1,e:"Les systèmes Annexe III passent du 2 août 2026 au 2 décembre 2027."},
   {id:"m2q4",lvl:2,p:"Un dispositif médical intégrant de l’IA (Annexe I) devra se conformer au plus tard le…",o:["2 décembre 2026","2 décembre 2027","2 août 2028","2 août 2030"],a:2,e:"Le haut risque Annexe I est reporté du 2 août 2027 au 2 août 2028."},
   {id:"m2q5",lvl:2,p:"Depuis quand les obligations des fournisseurs de modèles GPAI s’appliquent-elles aux nouveaux modèles ?",o:["2 février 2025","2 août 2025","2 août 2026","2 août 2027"],a:1,e:"Le chapitre V s’applique depuis le 2 août 2025 ; les modèles antérieurs ont jusqu’au 2 août 2027."},
  ]},
{ id:"m3", title:"Rôles et responsabilités", dur:"45 min", profiles:["cadre","resp"],
  goal:"Identifier si votre organisation est fournisseur, déployeur, importateur ou distributeur.",
  lessons:[
   {h:"Les opérateurs", body:`<ul>
   <li><b>Fournisseur</b> <span class="art">Art. 3(3)</span> : développe un système ou un modèle (ou le fait développer) et le met sur le marché ou en service <b>sous son propre nom ou sa marque</b>.</li>
   <li><b>Déployeur</b> <span class="art">Art. 3(4)</span> : utilise un système d’IA sous son autorité dans un cadre professionnel.</li>
   <li><b>Importateur</b> : établi dans l’UE, met sur le marché un système portant le nom d’une entité hors UE.</li>
   <li><b>Distributeur</b> : met un système à disposition sans être fournisseur ni importateur.</li>
   <li><b>Mandataire</b> : représente dans l’UE un fournisseur établi hors UE.</li></ul>
   <p>La plupart des entreprises sont <b>déployeurs</b> : elles achètent ou s’abonnent à des outils d’IA. Celles qui développent leurs propres outils, même en s’appuyant sur une API de modèle, peuvent devenir <b>fournisseurs</b> de ces systèmes.</p>`},
   {h:"Quand un déployeur devient fournisseur", body:`<p>L’<span class="art">Art. 25</span> prévoit qu’un distributeur, importateur, déployeur ou tiers est considéré comme fournisseur d’un système haut risque s’il :</p>
   <ol><li>appose son nom ou sa marque sur un système haut risque déjà sur le marché ;</li>
   <li>y apporte une <b>modification substantielle</b> sans qu’il cesse d’être à haut risque ;</li>
   <li>modifie la <b>finalité prévue</b> d’un système non haut risque de sorte qu’il le devienne (ex. utiliser un chatbot généraliste pour trier des candidats).</li></ol>
   <p>Ce mécanisme est un piège fréquent : un usage détourné peut faire basculer toute la charge de conformité sur l’entreprise utilisatrice.</p>`},
   {h:"Conséquences contractuelles", lvl:2, body:`<p>L’Omnibus a ajouté à l’<span class="art">Art. 99(4)</span> un point visant les obligations de l’<span class="art">Art. 25(2) et (4)</span> (coopération et informations entre fournisseur initial et nouveau fournisseur, et accords écrits avec les tiers fournissant des composants). Concrètement, revoyez les clauses fournisseurs : documentation remise, notice d’utilisation, assistance à la conformité, notification des modifications.</p>`},
  ],
  keypts:["Fournisseur = met sur le marché sous son nom.","Déployeur = utilise sous son autorité, à titre professionnel.","Art. 25 : marque, modification substantielle ou détournement de finalité font basculer en fournisseur."],
  deliv:"Matrice rôle / obligations / preuves attendues pour les 5 opérateurs, plus un exemple de bascule art. 25 tiré d’un cas réel ou plausible.",
  quiz:[
   {id:"m3q1",lvl:1,p:"Votre entreprise s’abonne à un outil d’IA de transcription de réunions et l’utilise en interne. Elle est…",o:["Fournisseur","Déployeur","Importateur","Hors champ"],a:1,e:"Elle utilise un système sous son autorité à titre professionnel : c’est un déployeur."},
   {id:"m3q2",lvl:1,p:"Une PME développe un assistant client sur l’API d’un grand modèle et le commercialise sous sa marque. Pour cet assistant, elle est…",o:["Simple déployeuse","Fournisseur du système d’IA","Distributeur","Mandataire"],a:1,e:"Elle met le système sur le marché sous son nom : elle en est fournisseur, même si le modèle sous-jacent vient d’un tiers."},
   {id:"m3q3",lvl:1,p:"Un service RH utilise un chatbot généraliste pour classer automatiquement les candidatures. Risque principal ?",o:["Aucun, le chatbot n’est pas haut risque","Le changement de finalité peut en faire un système haut risque dont l’entreprise devient fournisseur (art. 25)","L’entreprise devient importateur","Seul le RGPD s’applique"],a:1,e:"Modifier la finalité prévue vers un usage Annexe III peut faire basculer l’entreprise en fournisseur."},
   {id:"m3q4",lvl:2,p:"Lequel de ces actes ne fait PAS basculer un déployeur en fournisseur au titre de l’art. 25 ?",o:["Apposer sa marque sur un système haut risque","Modifier substantiellement un système haut risque","Utiliser le système conformément à la notice du fournisseur","Détourner la finalité d’un système vers un usage haut risque"],a:2,e:"Un usage conforme à la notice est précisément ce qu’on attend d’un déployeur."},
  ]},
{ id:"m4", title:"Les pratiques interdites", dur:"40 min", profiles:["cadre","resp"],
  goal:"Reconnaître immédiatement les usages qu’aucune entreprise ne peut déployer.",
  lessons:[
   {h:"Les huit interdictions d’origine (art. 5)", body:`<ol>
   <li>Techniques <b>subliminales, manipulatrices ou trompeuses</b> altérant substantiellement le comportement et causant un préjudice important.</li>
   <li><b>Exploitation des vulnérabilités</b> liées à l’âge, au handicap ou à la situation sociale ou économique.</li>
   <li><b>Notation sociale</b> entraînant un traitement défavorable injustifié ou disproportionné.</li>
   <li>Évaluation du risque qu’une personne commette une infraction, fondée <b>uniquement sur le profilage</b> ou ses traits de personnalité.</li>
   <li>Constitution de bases de reconnaissance faciale par <b>moissonnage non ciblé</b> d’images sur internet ou de vidéosurveillance.</li>
   <li><b>Reconnaissance des émotions</b> sur le lieu de travail et dans les établissements d’enseignement, sauf raisons médicales ou de sécurité.</li>
   <li><b>Catégorisation biométrique</b> déduisant race, opinions politiques, appartenance syndicale, convictions religieuses, vie ou orientation sexuelle.</li>
   <li><b>Identification biométrique à distance en temps réel</b> dans l’espace public à des fins répressives, sauf exceptions strictes (recherche de victimes, menace imminente, suspects d’infractions graves).</li></ol>`},
   {h:"Deux ajouts de l’Omnibus", body:`<p>L’Omnibus interdit à partir du <b>2 décembre 2026</b> les systèmes d’IA conçus pour générer des <b>images intimes non consenties</b> de personnes réelles (« nudification ») et du <b>matériel pédocriminel</b>.</p>`},
   {h:"Le cas le plus courant en entreprise", body:`<p>L’interdiction la plus susceptible de toucher une entreprise ordinaire est la <b>reconnaissance des émotions des salariés</b> : analyse du ton de voix en centre d’appels pour évaluer l’humeur des agents, détection du stress en visioconférence, etc. Vérifiez les fonctionnalités « analytics » des outils achetés.</p>
   <p>Les infractions à l’article 5 relèvent du plafond d’amende le plus élevé : <b>35 M€ ou 7 % du chiffre d’affaires mondial</b>, le montant le plus élevé étant retenu <span class="art">Art. 99(3)</span>.</p>`},
  ],
  keypts:["Applicables depuis le 2 février 2025, à tous les opérateurs.","Reconnaissance des émotions au travail : interdite sauf motif médical ou de sécurité.","Plafond : 35 M€ ou 7 % du CA mondial."],
  deliv:"Checklist d’achat « interdits » à joindre à toute procédure d’acquisition d’outil IA (10 questions oui/non au fournisseur).",
  quiz:[
   {id:"m4q1",lvl:1,p:"Un centre d’appels veut analyser la voix de ses conseillers pour mesurer leur niveau de stress. C’est…",o:["Autorisé avec consentement","Une pratique interdite (reconnaissance des émotions au travail)","Un système à risque minimal","Haut risque uniquement"],a:1,e:"La reconnaissance des émotions au travail est interdite, sauf raisons médicales ou de sécurité."},
   {id:"m4q2",lvl:1,p:"Plafond d’amende pour une pratique interdite ?",o:["7,5 M€ ou 1 %","15 M€ ou 3 %","35 M€ ou 7 % du CA mondial","4 % du CA comme le RGPD"],a:2,e:"Art. 99(3) : 35 M€ ou 7 % du CA mondial annuel, le plus élevé des deux (le plus faible pour les PME)."},
   {id:"m4q3",lvl:1,p:"Lequel est interdit ?",o:["Un chatbot de support client","La notation sociale entraînant un traitement défavorable disproportionné","Un filtre anti-spam","Un outil de traduction"],a:1,e:"La notation sociale fait partie des pratiques de l’article 5."},
   {id:"m4q4",lvl:2,p:"Constituer une base de reconnaissance faciale en aspirant massivement des photos sur internet est…",o:["Autorisé si la base est chiffrée","Interdit (moissonnage non ciblé)","Haut risque Annexe III","Autorisé pour la recherche commerciale"],a:1,e:"Le moissonnage non ciblé d’images faciales est explicitement interdit."},
  ]},
{ id:"m5", title:"Les systèmes à haut risque", dur:"1 h 30", profiles:["resp"],
  goal:"Qualifier un système haut risque et connaître les exigences pour le fournisseur et le déployeur.",
  lessons:[
   {h:"Deux voies d’entrée (art. 6)", body:`<ul>
   <li><b>Annexe I</b> <span class="art">Art. 6(1)</span> : l’IA est un produit, ou un composant de sécurité d’un produit, couvert par la législation d’harmonisation (machines, jouets, dispositifs médicaux, ascenseurs…) et soumis à une évaluation de conformité par un tiers. Application : 2 août 2028.</li>
   <li><b>Annexe III</b> <span class="art">Art. 6(2)</span> : huit domaines d’usage. Application : 2 décembre 2027.</li></ul>
   <div class="tbl"><table><thead><tr><th>Domaine Annexe III</th><th>Exemples</th></tr></thead><tbody>
   <tr><td>1. Biométrie</td><td>Identification à distance, catégorisation, reconnaissance des émotions (hors interdits)</td></tr>
   <tr><td>2. Infrastructures critiques</td><td>Gestion du trafic, de l’eau, du gaz, de l’électricité</td></tr>
   <tr><td>3. Éducation et formation</td><td>Admission, évaluation des apprentissages, surveillance d’examens</td></tr>
   <tr><td>4. Emploi</td><td>Recrutement, tri de CV, promotion, licenciement, attribution de tâches, évaluation</td></tr>
   <tr><td>5. Services essentiels</td><td>Prestations sociales, scoring de crédit, tarification assurance vie et santé, tri des appels d’urgence</td></tr>
   <tr><td>6. Répression</td><td>Évaluation de preuves, risque de victimisation</td></tr>
   <tr><td>7. Migration et frontières</td><td>Examen de demandes d’asile ou de visa</td></tr>
   <tr><td>8. Justice et démocratie</td><td>Aide à la décision judiciaire, influence sur les élections</td></tr></tbody></table></div>`},
   {h:"La dérogation de l’art. 6(3)", body:`<p>Un système Annexe III n’est pas haut risque s’il ne présente pas de risque important, notamment lorsqu’il : accomplit une <b>tâche procédurale étroite</b> ; <b>améliore le résultat</b> d’une activité humaine déjà réalisée ; détecte des schémas de décision sans remplacer l’évaluation humaine ; ou exécute une <b>tâche préparatoire</b>.</p>
   <p>Exception à l’exception : un système qui effectue du <b>profilage</b> de personnes physiques reste toujours haut risque. Le fournisseur qui invoque la dérogation doit documenter son analyse.</p>`},
   {h:"Exigences pour le système (art. 9 à 15)", body:`<ul>
   <li>Système de <b>gestion des risques</b> sur tout le cycle de vie <span class="art">Art. 9</span></li>
   <li><b>Gouvernance des données</b> : qualité, représentativité, biais <span class="art">Art. 10</span></li>
   <li><b>Documentation technique</b> <span class="art">Art. 11</span> (allégée pour les PME et petites ETI après l’Omnibus)</li>
   <li><b>Journalisation</b> automatique des événements <span class="art">Art. 12</span></li>
   <li><b>Transparence</b> envers les déployeurs : notice d’utilisation <span class="art">Art. 13</span></li>
   <li><b>Contrôle humain</b> effectif <span class="art">Art. 14</span></li>
   <li><b>Exactitude, robustesse, cybersécurité</b> <span class="art">Art. 15</span></li></ul>
   <p>Le fournisseur ajoute : système de gestion de la qualité <span class="art">Art. 17</span>, évaluation de conformité, déclaration UE et marquage CE, enregistrement dans la base de données de l’UE, surveillance après commercialisation et signalement des incidents graves.</p>`},
   {h:"Obligations du déployeur (art. 26 et 27)", body:`<ul>
   <li>Utiliser le système conformément à la notice.</li>
   <li>Confier le <b>contrôle humain</b> à des personnes compétentes, formées et disposant de l’autorité nécessaire.</li>
   <li>Veiller à la pertinence des <b>données d’entrée</b> qu’il maîtrise.</li>
   <li>Surveiller le fonctionnement et signaler les risques ou incidents au fournisseur.</li>
   <li>Conserver les <b>journaux</b> générés au moins <b>six mois</b> <span class="art">Art. 26(6)</span>.</li>
   <li><b>Informer les représentants du personnel</b> et les salariés concernés avant la mise en service sur le lieu de travail <span class="art">Art. 26(7)</span>.</li>
   <li>Informer les personnes soumises à une décision assistée par le système.</li></ul>
   <p>Les organismes publics, les entités privées fournissant un service public, et les déployeurs de scoring de crédit ou de tarification assurance vie et santé réalisent une <b>analyse d’impact sur les droits fondamentaux</b> (FRIA) <span class="art">Art. 27</span>. Les personnes concernées disposent d’un <b>droit à l’explication</b> <span class="art">Art. 86</span>.</p>`},
  ],
  keypts:["Annexe I (produits) et Annexe III (8 domaines d’usage).","Art. 6(3) : dérogation documentée, jamais en cas de profilage.","Déployeur : contrôle humain, journaux ≥ 6 mois, information des salariés et des personnes."],
  deliv:"Checklist d’audit haut risque en deux colonnes (fournisseur / déployeur), avec pour chaque ligne l’article et la preuve attendue.",
  quiz:[
   {id:"m5q1",lvl:1,p:"Un outil qui classe automatiquement les CV relève de…",o:["Risque minimal","L’Annexe III, domaine emploi","Pratique interdite","L’Annexe I"],a:1,e:"Le recrutement et la sélection de candidats figurent au point 4 de l’Annexe III."},
   {id:"m5q2",lvl:1,p:"Durée minimale de conservation des journaux par le déployeur d’un système haut risque :",o:["1 mois","6 mois","1 an","5 ans"],a:1,e:"Art. 26(6) : au moins six mois, sauf disposition contraire du droit applicable."},
   {id:"m5q3",lvl:2,p:"Un système Annexe III peut échapper au haut risque via l’art. 6(3) sauf s’il…",o:["Est développé hors UE","Effectue du profilage de personnes physiques","Utilise du cloud","Est open source"],a:1,e:"Un système qui profile des personnes physiques reste toujours haut risque."},
   {id:"m5q4",lvl:2,p:"Qui doit réaliser une analyse d’impact sur les droits fondamentaux (art. 27) ?",o:["Tout déployeur","Les organismes publics, les entités privées de service public et les déployeurs de scoring de crédit ou tarification assurance vie et santé","Uniquement les fournisseurs","Uniquement les PME"],a:1,e:"L’article 27 cible ces catégories de déployeurs."},
   {id:"m5q5",lvl:2,p:"Avant de mettre en service un système haut risque sur le lieu de travail, l’employeur doit…",o:["Obtenir le consentement écrit de chaque salarié","Informer les représentants du personnel et les salariés concernés","Déclarer le système à la CNIL","Rien de particulier"],a:1,e:"Art. 26(7). En France, le droit du travail peut aussi imposer une consultation du CSE."},
  ]},
{ id:"m6", title:"Transparence (art. 50)", dur:"40 min", profiles:["cadre","resp"],
  goal:"Appliquer les obligations d’information en vigueur depuis le 2 août 2026.",
  lessons:[
   {h:"Quatre obligations", body:`<div class="tbl"><table><thead><tr><th>Situation</th><th>Qui</th><th>Obligation</th></tr></thead><tbody>
   <tr><td>Système qui interagit avec des personnes (chatbot, voicebot)</td><td>Fournisseur</td><td>Concevoir le système pour que les personnes sachent qu’elles parlent à une IA, sauf si c’est évident</td></tr>
   <tr><td>Contenus synthétiques (texte, image, audio, vidéo)</td><td>Fournisseur</td><td>Marquage lisible par machine et détectable</td></tr>
   <tr><td>Reconnaissance des émotions ou catégorisation biométrique</td><td>Déployeur</td><td>Informer les personnes exposées</td></tr>
   <tr><td>Hypertrucage (deepfake)</td><td>Déployeur</td><td>Indiquer que le contenu a été généré ou manipulé</td></tr>
   <tr><td>Texte publié pour informer le public sur des sujets d’intérêt public</td><td>Déployeur</td><td>Indiquer l’origine IA, sauf relecture humaine et responsabilité éditoriale</td></tr>
   </tbody></table></div>`},
   {h:"Ce qui change pour un service marketing", body:`<ul>
   <li>Un assistant conversationnel sur le site doit se présenter comme une IA.</li>
   <li>Une vidéo publicitaire mettant en scène une personne réelle recréée par IA doit être signalée comme telle (des aménagements existent pour les œuvres manifestement artistiques ou satiriques).</li>
   <li>Un article de blog généré par IA et relu sous responsabilité éditoriale n’a pas d’obligation de mention au titre de l’art. 50 ; conservez la trace de cette relecture.</li></ul>
   <p>Les manquements relèvent du plafond de <b>15 M€ ou 3 %</b> du CA mondial <span class="art">Art. 99(4)</span>.</p>`},
   {h:"Délai de marquage", lvl:2, body:`<p>Les fournisseurs de systèmes génératifs mis sur le marché <b>avant le 2 août 2026</b> disposent jusqu’au <b>2 décembre 2026</b> pour implémenter le marquage lisible par machine. Ce délai ne concerne pas les autres obligations de l’article 50. La Commission accompagne l’application par des lignes directrices et un code de pratique sur le marquage <span class="verify">à vérifier</span> (vérifiez leur version en vigueur).</p>`},
  ],
  keypts:["En vigueur depuis le 2 août 2026, non reporté.","Chatbot : informer qu’on parle à une IA.","Deepfake : le déployeur le signale.","Plafond : 15 M€ ou 3 %."],

   {id:"m6q1",lvl:1,p:"Votre site propose un assistant conversationnel IA. Que faut-il faire ?",o:["Rien, c’est du risque minimal","Faire en sorte que l’utilisateur sache qu’il échange avec une IA","Obtenir un marquage CE","Le déclarer à l’autorité"],a:1,e:"Art. 50(1) : l’interaction avec une IA doit être signalée, sauf si c’est évident."},
   {id:"m6q2",lvl:1,p:"Qui doit signaler qu’une vidéo est un deepfake ?",o:["Le fournisseur du modèle uniquement","Le déployeur qui diffuse le contenu","La plateforme d’hébergement seule","Personne"],a:1,e:"L’obligation de divulgation des hypertrucages pèse sur le déployeur."},

{ id:"m7", title:"Modèles d’IA à usage général (GPAI)", dur:"1 h", profiles:["resp"],
  goal:"Distinguer les obligations du fournisseur de modèle de celles de l’entreprise qui l’intègre.",
  lessons:[
   {h:"Obligations de tout fournisseur de modèle GPAI (art. 53)", body:`<ul>
   <li><b>Documentation technique</b> du modèle, tenue à disposition du Bureau de l’IA.</li>
   <li><b>Informations aux fournisseurs en aval</b> qui intègrent le modèle dans leurs systèmes.</li>
   <li><b>Politique de respect du droit d’auteur</b>, y compris des réserves de droits (opt-out).</li>
   <li><b>Résumé public</b> du contenu d’entraînement, selon le modèle fourni par la Commission.</li></ul>
   <p>Les modèles diffusés sous licence libre et ouverte bénéficient d’allègements, sauf s’ils présentent un risque systémique.</p>`},
   {h:"Risque systémique (art. 51 et 55)", body:`<p>Un modèle est présumé à risque systémique lorsque la puissance de calcul cumulée de son entraînement dépasse <b>10<sup>25</sup> FLOP</b> (seuil modifiable par la Commission). Obligations supplémentaires : évaluations et tests adverses, atténuation des risques, signalement des incidents graves, cybersécurité.</p>
   <p>Un <b>code de pratique GPAI</b>, publié en juillet 2025, permet aux fournisseurs de démontrer leur conformité. Les amendes du Bureau de l’IA envers les fournisseurs de modèles sont applicables depuis le 2 août 2026 <span class="art">Art. 101</span>.</p>`},
   {h:"Et votre entreprise ?", body:`<p>Une entreprise qui appelle un modèle via API n’est <b>pas</b> fournisseur du modèle. Elle est en revanche :</p>
   <ul><li><b>déployeur</b> de l’outil si elle l’utilise en interne ;</li>
   <li><b>fournisseur du système d’IA</b> qu’elle construit et met à disposition sous son nom (art. 50, voire haut risque selon l’usage).</li></ul>
   <p>Ce qu’elle doit vérifier chez le fournisseur de modèle : documentation remise aux intégrateurs, politique droit d’auteur, adhésion au code de pratique, localisation et conservation des données, conditions d’usage de ses prompts pour l’entraînement.</p>`},
  ],
  keypts:["Les obligations GPAI pèsent sur le fournisseur du modèle.","Seuil de risque systémique : 10^25 FLOP.","Une entreprise qui intègre un modèle peut devenir fournisseur de son propre système."],
  deliv:"Fiche « GPAI : ce que doit vérifier une entreprise utilisatrice » sous forme de questionnaire fournisseur.",
  quiz:[
   {id:"m7q1",lvl:2,p:"Une entreprise utilise un grand modèle via API pour un outil interne. Est-elle soumise aux obligations de l’art. 53 ?",o:["Oui, comme tout utilisateur","Non, elles pèsent sur le fournisseur du modèle","Oui, si elle a plus de 250 salariés","Seulement en cas de risque systémique"],a:1,e:"Le chapitre V vise les fournisseurs de modèles. L’entreprise reste déployeur ou fournisseur de son propre système."},
   {id:"m7q2",lvl:2,p:"Seuil de présomption de risque systémique d’un modèle GPAI :",o:["10^20 FLOP","10^23 FLOP","10^25 FLOP","1 milliard de paramètres"],a:2,e:"Art. 51 : 10^25 FLOP de calcul cumulé d’entraînement."},
   {id:"m7q3",lvl:2,p:"Laquelle n’est PAS une obligation de base du fournisseur GPAI ?",o:["Politique de respect du droit d’auteur","Résumé public des données d’entraînement","Marquage CE du modèle","Documentation pour les fournisseurs en aval"],a:2,e:"Le marquage CE concerne les systèmes haut risque, pas les modèles GPAI."},
   {id:"m7q4",lvl:2,p:"Qui peut infliger des amendes aux fournisseurs de modèles GPAI ?",o:["La CNIL seule","La Commission européenne (Bureau de l’IA)","Chaque tribunal de commerce","Personne"],a:1,e:"Art. 101 : la Commission, depuis le 2 août 2026."},
  ]},
{ id:"m8", title:"Maîtrise de l’IA et gouvernance", dur:"1 h", profiles:["cadre","resp"],
  goal:"Mettre en place l’article 4 et une gouvernance IA proportionnée.",
  lessons:[
   {h:"L’article 4 après l’Omnibus", body:`<p>Depuis le 27 juillet 2026, l’article 4 a été entièrement réécrit. Les fournisseurs et déployeurs ne doivent plus « garantir un niveau suffisant » de maîtrise de l’IA, mais <b>prendre des mesures pour soutenir son développement</b> chez leur personnel et les personnes qui utilisent les systèmes pour leur compte, en tenant compte de leurs connaissances, de leur formation et du contexte d’usage.</p>
   <p>Le texte précise que cette obligation n’impose de garantir aucun niveau précis pour une personne donnée. On parle d’une <b>obligation de moyens</b>. Elle reste contraignante, et il faut pouvoir montrer ce qui a été fait.</p>
   <p>Aucune amende spécifique n’est prévue pour l’article 4 dans l’article 99, mais un défaut de formation peut peser dans l’appréciation d’autres manquements.</p>`},
   {h:"Une gouvernance en cinq briques", body:`<ol>
   <li><b>Inventaire</b> des systèmes d’IA : finalité, données, fournisseur, utilisateurs, décisions influencées.</li>
   <li><b>Qualification</b> : rôle de l’entreprise et niveau de risque pour chaque système.</li>
   <li><b>Politique d’usage</b> : outils autorisés, données interdites dans les prompts, validation humaine.</li>
   <li><b>Achats</b> : questionnaire fournisseur, clauses contractuelles, revue avant mise en service.</li>
   <li><b>Formation</b> différenciée par population, avec traces (contenus, présence, évaluation).</li></ol>`},
   {h:"Sanctions et autorités", lvl:2, body:`<div class="tbl"><table><thead><tr><th>Manquement</th><th>Plafond</th><th>Article</th></tr></thead><tbody>
   <tr><td>Pratiques interdites</td><td>35 M€ ou 7 % CA mondial</td><td class="date">99(3)</td></tr>
   <tr><td>Obligations des opérateurs (fournisseurs, déployeurs, art. 50…)</td><td>15 M€ ou 3 %</td><td class="date">99(4)</td></tr>
   <tr><td>Informations inexactes aux autorités</td><td>7,5 M€ ou 1 %</td><td class="date">99(5)</td></tr>
   <tr><td>Fournisseurs de modèles GPAI</td><td>15 M€ ou 3 %</td><td class="date">101</td></tr></tbody></table></div>
   <p>Pour les PME et start-up, c’est le <b>montant le plus faible</b> des deux qui s’applique ; l’Omnibus a étendu cette règle aux petites entreprises de taille intermédiaire (« small mid-caps ») pour les plafonds des paragraphes 4 et 5 uniquement <span class="art">Art. 99(6a)</span>. Chaque État membre désigne ses autorités de surveillance du marché. Pour la France, vérifiez la répartition des compétences entre autorités <span class="verify">à vérifier</span>.</p>`},
  ],
  keypts:["Art. 4 : obligation de moyens depuis l’Omnibus, toujours contraignante.","Inventaire, qualification, politique, achats, formation.","Documenter : c’est la preuve qui protège."],
  deliv:"Plan de maîtrise de l’IA sur 90 jours : populations, durées, contenus, modalités d’évaluation, preuves conservées.",
  quiz:[
   {id:"m8q1",lvl:1,p:"Après l’Omnibus, l’article 4 impose aux entreprises de…",o:["Garantir un niveau certifié de compétence IA pour chaque salarié","Prendre des mesures pour soutenir le développement de la maîtrise de l’IA","Rien, il a été supprimé","Faire certifier leurs formations par l’État"],a:1,e:"L’article 4 a été réécrit en obligation de moyens, sans niveau individuel à garantir."},
   {id:"m8q2",lvl:1,p:"Première étape d’une démarche de conformité AI Act ?",o:["Acheter une certification","Inventorier les systèmes d’IA utilisés ou développés","Interdire l’IA générative","Nommer un DPO"],a:1,e:"Sans inventaire, impossible de qualifier rôles et risques."},
   {id:"m8q3",lvl:1,p:"Un salarié colle des données clients dans un chatbot grand public non validé. Quelle brique de gouvernance manque ?",o:["Le marquage CE","Une politique d’usage précisant outils autorisés et données interdites","Une FRIA","Un mandataire"],a:1,e:"La politique d’usage et la formation adressent ce risque très courant."},
   {id:"m8q4",lvl:2,p:"Pour une PME, le plafond d’amende retenu est…",o:["Le plus élevé entre montant fixe et pourcentage","Le plus faible entre montant fixe et pourcentage","Toujours 1 % du CA","Fixé librement par le juge sans plafond"],a:1,e:"Art. 99(6) : pour les PME et start-up, le plus faible des deux montants."},
  ]},
{ id:"m9", title:"AI Act et RGPD", dur:"1 h", profiles:["resp"],
  goal:"Articuler les deux textes sans doublon ni angle mort.",
  lessons:[
   {h:"Deux textes cumulatifs", body:`<p>L’AI Act ne remplace pas le RGPD : dès qu’un système d’IA traite des données personnelles, les deux s’appliquent. L’AI Act régit le <b>produit et son usage</b> ; le RGPD régit le <b>traitement des données</b>.</p>
   <div class="tbl"><table><thead><tr><th>Thème</th><th>RGPD</th><th>AI Act</th></tr></thead><tbody>
   <tr><td>Analyse d’impact</td><td>AIPD <span class="art rgpd">RGPD art. 35</span></td><td>FRIA <span class="art">Art. 27</span> (peut s’appuyer sur l’AIPD)</td></tr>
   <tr><td>Décision automatisée</td><td>Droit de ne pas faire l’objet d’une décision uniquement automatisée <span class="art rgpd">RGPD art. 22</span></td><td>Contrôle humain <span class="art">Art. 14</span>, droit à l’explication <span class="art">Art. 86</span></td></tr>
   <tr><td>Données</td><td>Base légale, minimisation, durée</td><td>Qualité, représentativité, biais <span class="art">Art. 10</span></td></tr>
   <tr><td>Transparence</td><td>Information des personnes <span class="art rgpd">RGPD art. 13-14</span></td><td>Information sur l’IA <span class="art">Art. 50</span></td></tr>
   <tr><td>Traces</td><td>Les journaux contiennent souvent des données personnelles</td><td>Conservation des journaux <span class="art">Art. 12, 26</span></td></tr></tbody></table></div>`},
   {h:"Détection des biais : le nouvel article 4a", body:`<p>L’Omnibus a remplacé l’ancien article 10(5) par un <b>article 4a</b> <span class="art">Art. 4a</span> qui fournit une base juridique pour traiter, à titre exceptionnel et avec garanties, des catégories particulières de données afin de détecter et corriger les biais. Il couvre désormais aussi les déployeurs de systèmes haut risque et les autres systèmes et modèles. Le texte précise qu’il ne crée <b>pas d’obligation</b> de procéder à cette détection.</p>`},
   {h:"Méthode pratique", body:`<ol><li>Un seul inventaire IA relié au registre des traitements.</li>
   <li>Une analyse d’impact conjointe AIPD et FRIA quand les deux sont requises.</li>
   <li>Associer le DPO à la gouvernance IA dès la phase d’achat.</li>
   <li>Pour les agents et RAG : contrôle d’accès aux documents, durée de conservation des conversations, usage des prompts par le fournisseur.</li></ol>`},
  ],
  keypts:["Cumul AI Act + RGPD dès qu’il y a des données personnelles.","AIPD et FRIA peuvent être menées conjointement.","Art. 4a : base juridique pour la détection des biais, pas une obligation."],
  deliv:"Matrice AI Act / RGPD appliquée à un cas d’usage (ex. assistant RAG sur documents clients).",
  quiz:[
   {id:"m9q1",lvl:2,p:"Un système d’IA traite des données personnelles. Quels textes s’appliquent ?",o:["L’AI Act seul, il remplace le RGPD","Le RGPD seul","Les deux, cumulativement","Aucun si le traitement est interne"],a:2,e:"Les deux régimes se cumulent."},
   {id:"m9q2",lvl:2,p:"La FRIA de l’AI Act peut…",o:["Remplacer totalement l’AIPD","S’appuyer sur une AIPD existante pour éviter les doublons","Être réalisée par le fournisseur à la place du déployeur","Être ignorée si une AIPD existe"],a:1,e:"L’art. 27(4) permet de remplir certaines obligations au moyen de l’AIPD réalisée au titre de l’art. 35 du RGPD, en y faisant renvoi."},
   {id:"m9q3",lvl:2,p:"Le nouvel article 4a introduit par l’Omnibus…",o:["Oblige à tester tous les systèmes contre les biais","Fournit une base juridique pour traiter certaines données sensibles afin de détecter les biais, sans créer d’obligation","Interdit tout traitement de données sensibles","Supprime l’article 22 du RGPD"],a:1,e:"Le texte précise expressément qu’il ne crée pas d’obligation de détection."},
  ]},
{ id:"m10", title:"Méthode d’audit et cas pratiques", dur:"2 h", profiles:["resp"],
  goal:"Appliquer une méthode reproductible et la défendre en entretien.",
  lessons:[
   {h:"La méthode en cinq étapes", body:`<ol>
   <li><b>Décrire</b> : finalité, utilisateurs, personnes affectées, données, fournisseur, degré d’autonomie.</li>
   <li><b>Qualifier le rôle</b> : fournisseur, déployeur, bascule art. 25 ?</li>
   <li><b>Qualifier le risque</b> : interdit ? Annexe I ? Annexe III et dérogation 6(3) ? Art. 50 ?</li>
   <li><b>Lister les obligations</b> avec leur date d’application.</li>
   <li><b>Plan d’action 30/60/90 jours</b> : actions, responsable, preuve.</li></ol>
   <p>L’onglet <b>Qualifier un cas</b> applique les étapes 2 à 4 sous forme de questionnaire.</p>`},
   {h:"Cas 1 : agent IA de prospection B2B", body:`<p>Un agent génère et envoie des messages personnalisés à des prospects à partir de données LinkedIn et d’un CRM.</p>
   <ul><li><b>Rôle</b> : déployeur si l’outil est acheté ; fournisseur s’il est développé et commercialisé.</li>
   <li><b>Risque</b> : pas Annexe III ; art. 50 si l’agent converse avec les prospects (signaler l’IA).</li>
   <li><b>Points d’attention</b> : RGPD (base légale de la prospection, information, opposition), validation humaine des envois, injection de prompts via contenus externes, journalisation des actions de l’agent.</li></ul>`},
   {h:"Cas 2 : assistant RAG interne sur documents clients", body:`<ul><li><b>Rôle</b> : fournisseur si l’entreprise le construit elle-même (mise en service pour son propre usage), sinon déployeur.</li>
   <li><b>Risque</b> : en général risque minimal ou transparence, sauf usage Annexe III (ex. aide à l’octroi de crédit).</li>
   <li><b>Contrôles</b> : héritage des droits d’accès documentaires, cloisonnement par client, journalisation des requêtes, durée de conservation, tests d’injection de prompt, clause fournisseur sur la non-réutilisation des données.</li></ul>`},
   {h:"Questions d’entretien", body:`<ul>
   <li>« Un chatbot client est-il toujours à haut risque ? » Non : il relève en général de l’art. 50 ; il devient haut risque si son usage relève de l’Annexe III.</li>
   <li>« Quelle différence entre fournisseur et déployeur ? » Mise sur le marché sous son nom contre usage sous son autorité, avec la bascule art. 25.</li>
   <li>« L’AI Act est reporté, on peut attendre ? » Non : interdits, art. 4, GPAI et art. 50 s’appliquent déjà ; le report ne concerne que le haut risque.</li>
   <li>« Par quoi commenceriez-vous chez nous ? » Inventaire, qualification, chasse aux interdits (émotions), transparence des chatbots, politique d’usage.</li></ul>
   <p><b>Pitch de 60 secondes</b> : « Je fais le pont entre l’IA opérationnelle et la conformité. Je sais inventorier les systèmes, qualifier le rôle et le risque, identifier les obligations AI Act et RGPD avec leurs dates après l’Omnibus 2026, et proposer des contrôles concrets. J’ai appliqué cette méthode à un agent de prospection et à un RAG interne. »</p>`},
  ],
  keypts:["Décrire, qualifier le rôle, qualifier le risque, lister, planifier.","Toujours dater les obligations.","Une grille d’audit montrée en entretien vaut mieux qu’un certificat."],
  deliv:"Deux dossiers de 4 à 6 pages (agent de prospection, RAG interne) + pitch écrit d’une page.",
  quiz:[
   {id:"m10q1",lvl:2,p:"Un chatbot de support client relève en général…",o:["Du haut risque","De l’article 50 (transparence)","Des pratiques interdites","D’aucune règle"],a:1,e:"Sauf usage Annexe III, il s’agit d’une obligation de transparence."},
   {id:"m10q2",lvl:2,p:"Dans un RAG interne, quel contrôle répond le mieux au risque de fuite entre clients ?",o:["Un plus grand modèle","L’héritage des droits d’accès documentaires et le cloisonnement par client","Le marquage des contenus","Une FRIA"],a:1,e:"Le contrôle d’accès au niveau de la récupération des documents est la mesure clé."},
   {id:"m10q3",lvl:2,p:"Un recruteur dit : « l’AI Act est reporté à 2027 ». Réponse la plus juste :",o:["C’est exact pour tout le texte","Seul le haut risque est reporté ; interdits, art. 4, GPAI et transparence s’appliquent déjà","Il a été abrogé","Il s’applique seulement aux GAFAM"],a:1,e:"C’est l’erreur la plus fréquente depuis l’Omnibus."},

  ]},

 "2":{t:"Champ d’application",s:"Fixe qui est soumis au règlement : fournisseurs qui mettent un système ou un modèle sur le marché de l’UE (même établis hors UE), déployeurs établis dans l’UE, acteurs hors UE dont les sorties sont utilisées dans l’UE, importateurs, distributeurs et fabricants de produits intégrant de l’IA. Exclut notamment les usages exclusivement militaires, de défense ou de sécurité nationale, la recherche et le développement scientifiques, et l’usage personnel non professionnel."},
 "3":{t:"Définitions",s:"Article de 60+ définitions qui structure tout le règlement.",p:{
   "1":"Système d’IA : système automatisé conçu pour fonctionner à différents niveaux d’autonomie, pouvant faire preuve d’adaptabilité après son déploiement, et qui déduit, à partir des entrées qu’il reçoit, la manière de générer des sorties (prédictions, contenus, recommandations, décisions) pouvant influencer des environnements physiques ou virtuels.",
   "3":"Fournisseur : personne ou organisme qui développe, ou fait développer, un système d’IA ou un modèle d’IA à usage général et le met sur le marché ou en service sous son propre nom ou sa propre marque, à titre onéreux ou gratuit.",
   "4":"Déployeur : personne ou organisme qui utilise sous sa propre autorité un système d’IA, sauf dans le cadre d’une activité personnelle à caractère non professionnel."}},
 "4":{t:"Maîtrise de l’IA",s:"Rédaction issue du règlement (UE) 2026/1744, en vigueur depuis le 27 juillet 2026 : les fournisseurs et les déployeurs prennent des mesures pour soutenir le développement de la maîtrise de l’IA de leur personnel et des autres personnes qui utilisent les systèmes pour leur compte, en tenant compte de leurs connaissances, de leur expérience, de leur formation et du contexte d’utilisation. Le texte précise qu’il n’impose de garantir aucun niveau précis pour une personne donnée."},
 "4a":{t:"Traitement de catégories particulières de données pour la détection et la correction des biais",s:"Ajouté par le règlement (UE) 2026/1744. Fournit une base juridique permettant, à titre exceptionnel et sous garanties, de traiter des données sensibles pour détecter et corriger des biais. Remplace l’ancien article 10(5) et s’étend aux déployeurs. Le texte précise qu’il ne crée pas d’obligation de procéder à cette détection. Intitulé traduit de la version anglaise : la version française consolidée de cet article n’était pas encore publiée sur l’AI Act Service Desk au 21/10/2026.",v:true},
 "5":{t:"Pratiques interdites en matière d’IA",s:"Liste des usages interdits, applicables depuis le 2 février 2025 :",l:["manipulation ou techniques subliminales causant un préjudice important","exploitation des vulnérabilités (âge, handicap, situation sociale ou économique)","notation sociale","prédiction d’infraction fondée uniquement sur le profilage","moissonnage non ciblé d’images faciales","reconnaissance des émotions au travail et à l’école (sauf motif médical ou de sécurité)","catégorisation biométrique déduisant des données sensibles","identification biométrique à distance en temps réel dans l’espace public à des fins répressives (sauf exceptions)","ajouts de l’Omnibus, dès le 2 décembre 2026 : génération d’images intimes non consenties et de contenus pédocriminels"]},
 "6":{t:"Règles relatives à la classification de systèmes d’IA comme systèmes à haut risque",s:"Définit les deux voies d’entrée dans le haut risque et la dérogation.",p:{
   "1":"Haut risque si le système est un produit, ou un composant de sécurité d’un produit, couvert par la législation d’harmonisation de l’Annexe I et soumis à une évaluation de conformité par un tiers. Application : 2 août 2028.",
   "2":"Haut risque si le système relève d’un des domaines de l’Annexe III (biométrie, infrastructures critiques, éducation, emploi, services essentiels, répression, migration, justice). Application : 2 décembre 2027.",
   "3":"Dérogation : un système de l’Annexe III n’est pas haut risque s’il ne présente pas de risque important (tâche procédurale étroite, amélioration d’une activité humaine déjà réalisée, détection de schémas sans remplacer l’évaluation humaine, tâche préparatoire). Jamais applicable en cas de profilage de personnes physiques."}},
 "9":{t:"Système de gestion des risques",s:"Processus itératif sur tout le cycle de vie du système haut risque : identifier et analyser les risques prévisibles, les estimer, adopter des mesures de gestion, et tester le système."},
 "10":{t:"Données et gouvernance des données",s:"Les jeux de données d’entraînement, de validation et de test doivent être pertinents, suffisamment représentatifs et, dans la mesure du possible, exempts d’erreurs et complets. Examen des biais possibles et mesures pour les détecter, prévenir et atténuer."},
 "11":{t:"Documentation technique",s:"Établie avant la mise sur le marché et tenue à jour, selon le contenu de l’Annexe IV, pour démontrer la conformité. Format simplifié possible pour les PME (et les petites ETI depuis l’Omnibus)."},
 "12":{t:"Enregistrement",s:"Les systèmes haut risque permettent techniquement l’enregistrement automatique des événements (journaux) tout au long de leur durée de vie, pour assurer la traçabilité de leur fonctionnement."},
 "13":{t:"Transparence et fourniture d’informations aux déployeurs",s:"Le système est conçu pour que les déployeurs puissent interpréter ses sorties, et il est accompagné d’une notice d’utilisation : identité du fournisseur, caractéristiques, capacités et limites, niveau d’exactitude, mesures de contrôle humain, durée de vie, maintenance."},
 "14":{t:"Contrôle humain",s:"Le système est conçu pour être effectivement supervisé par des personnes physiques pendant son utilisation : comprendre ses capacités et limites, éviter le biais d’automatisation, interpréter les sorties, pouvoir ne pas les utiliser, intervenir ou l’arrêter."},
 "15":{t:"Exactitude, robustesse et cybersécurité",s:"Niveau approprié d’exactitude, de robustesse et de cybersécurité tout au long du cycle de vie, avec résilience face aux erreurs et aux tentatives de manipulation (empoisonnement des données, exemples adverses, etc.)."},
 "16":{t:"Obligations incombant aux fournisseurs de systèmes d’IA à haut risque",s:"Respect des exigences des art. 8 à 15, système de gestion de la qualité, documentation, conservation des journaux, évaluation de conformité, déclaration UE, marquage CE, enregistrement, mesures correctives, accessibilité."},
 "17":{t:"Système de gestion de la qualité",s:"Politiques, procédures et instructions écrites couvrant notamment la conformité réglementaire, la conception, les tests, la gestion des données, la gestion des risques, la surveillance après commercialisation et le signalement des incidents."},
 "25":{t:"Responsabilités tout au long de la chaîne de valeur de l’IA",s:"Un distributeur, importateur, déployeur ou tiers devient fournisseur d’un système haut risque s’il y appose son nom ou sa marque, s’il le modifie substantiellement, ou s’il en modifie la finalité de sorte qu’il devienne haut risque.",p:{
   "2":"Le fournisseur initial n’est plus considéré comme le fournisseur de ce système, mais coopère avec le nouveau fournisseur (documentation, limites connues, accès technique). Il peut s’en exonérer s’il a clairement indiqué que son système ne devait pas être transformé en système haut risque. Paragraphe modifié par l’Omnibus ; son non-respect figure désormais à l’art. 99(4), point (da).",
   "4":"Le fournisseur d’un système haut risque et le tiers qui fournit des outils, services, composants ou processus utilisés dans ce système précisent par écrit les informations, capacités, accès techniques et l’assistance nécessaires (sauf outils libres et ouverts autres que des modèles GPAI). Paragraphe modifié par l’Omnibus, visé par l’art. 99(4), point (da)."}},
 "26":{t:"Obligations incombant aux déployeurs de systèmes d’IA à haut risque",s:"Usage conforme à la notice, contrôle humain confié à des personnes compétentes, pertinence des données d’entrée, surveillance du fonctionnement, signalement des risques et incidents, information des personnes.",p:{
   "6":"Les déployeurs conservent les journaux générés automatiquement, dans la mesure où ils sont sous leur contrôle, pendant une durée adaptée à la finalité et d’au moins six mois, sauf disposition contraire du droit de l’UE ou national (notamment sur la protection des données).",
   "7":"Avant de mettre en service ou d’utiliser un système haut risque sur le lieu de travail, les employeurs informent les représentants des travailleurs et les travailleurs concernés qu’ils y seront soumis."}},
 "27":{t:"Analyse d’impact des systèmes d’IA à haut risque sur les droits fondamentaux",s:"Avant le premier usage, certains déployeurs de systèmes haut risque (hors infrastructures critiques, Annexe III point 2) évaluent leur impact sur les droits fondamentaux : organismes de droit public, entités privées fournissant des services publics, et déployeurs des systèmes de l’Annexe III point 5(b) (solvabilité, score de crédit) et 5(c) (risque et tarification en assurance vie et santé).",p:{"4":"Si une AIPD (art. 35 RGPD) couvre déjà certaines obligations, l’analyse peut y faire renvoi ou en reprendre les parties pertinentes. Paragraphe modifié par l’Omnibus."}},
 "43":{t:"Évaluation de la conformité",s:"Procédures permettant de démontrer qu’un système haut risque respecte les exigences : contrôle interne (Annexe VI) ou intervention d’un organisme notifié (Annexe VII), selon le type de système."},
 "49":{t:"Enregistrement",s:"Avant la mise sur le marché ou en service, le fournisseur enregistre le système haut risque (et, dans certains cas, le déployeur public enregistre son usage) dans la base de données de l’UE."},
 "50":{t:"Obligations de transparence pour les fournisseurs et les déployeurs de certains systèmes d’IA",s:"Applicables depuis le 2 août 2026 :",l:["(1) fournisseur : informer les personnes qu’elles interagissent avec une IA, sauf si c’est évident","(2) fournisseur : marquage lisible par machine des contenus générés (délai au 2 décembre 2026 pour les systèmes mis sur le marché avant le 2 août 2026)","(3) déployeur : informer les personnes exposées à la reconnaissance des émotions ou à la catégorisation biométrique","(4) déployeur : signaler les hypertrucages, et les textes d’intérêt public générés sans relecture éditoriale"]},
 "51":{t:"Classification de modèles d’IA à usage général en tant que modèles d’IA à usage général présentant un risque systémique",s:"Un modèle présente un risque systémique s’il a des capacités à fort impact. Présomption lorsque la puissance de calcul cumulée de l’entraînement dépasse 10^25 FLOP ; la Commission peut ajuster ce seuil ou désigner un modèle."},
 "53":{t:"Obligations incombant aux fournisseurs de modèles d’IA à usage général",s:"Documentation technique du modèle, informations aux fournisseurs en aval, politique de respect du droit d’auteur (y compris des réserves de droits), résumé public suffisamment détaillé du contenu d’entraînement. Allègements pour les modèles sous licence libre et ouverte sans risque systémique."},
 "55":{t:"Obligations incombant aux fournisseurs de modèles d’IA à usage général présentant un risque systémique",s:"En plus de l’art. 53 : évaluation du modèle dont tests adverses, évaluation et atténuation des risques systémiques, suivi et signalement des incidents graves, niveau adéquat de cybersécurité."},
 "86":{t:"Droit à l’explication des décisions individuelles",s:"Une personne faisant l’objet d’une décision prise sur la base des sorties d’un système haut risque de l’Annexe III, qui produit des effets juridiques ou l’affecte de façon significative, peut obtenir du déployeur des explications claires sur le rôle du système et les principaux éléments de la décision."},
 "99":{t:"Sanctions",s:"Les États membres fixent le régime de sanctions, dans les plafonds suivants (le plus élevé des deux montants, sauf PME).",p:{
   "3":"Pratiques interdites (art. 5) : jusqu’à 35 M€ ou 7 % du chiffre d’affaires annuel mondial.",
   "4":"Obligations des opérateurs (fournisseurs, mandataires, importateurs, distributeurs, déployeurs, organismes notifiés, transparence art. 50 et, depuis l’Omnibus, art. 25(2) et (4)) : jusqu’à 15 M€ ou 3 %.",
   "5":"Informations inexactes, incomplètes ou trompeuses fournies aux autorités : jusqu’à 7,5 M€ ou 1 %.",
   "6":"PME et start-up : le plus faible des deux montants, pour les paragraphes 3, 4 et 5. Le paragraphe 6a, ajouté par l’Omnibus, applique la même règle aux « small mid-caps » pour les paragraphes 4 et 5 uniquement.","6a":"Ajouté par l’Omnibus : pour les petites entreprises de taille intermédiaire (« small mid-caps »), plafonds des paragraphes 4 et 5 au plus faible des deux montants. Ne s’applique pas au paragraphe 3 (pratiques interdites)."}},
 "101":{t:"Amendes applicables aux fournisseurs de modèles d’IA à usage général",s:"La Commission peut infliger aux fournisseurs de modèles d’IA à usage général des amendes jusqu’à 15 M€ ou 3 % du chiffre d’affaires annuel mondial. Applicable depuis le 2 août 2026."},
 "111":{t:"Systèmes d’IA déjà mis sur le marché ou mis en service et modèles d’IA à usage général déjà mis sur le marché",s:"Régime transitoire :",l:["(1) composants des systèmes d’information à grande échelle de l’Annexe X mis sur le marché avant le 2 août 2027 : conformité au plus tard le 31 décembre 2030","(2, modifié par l’Omnibus) autres systèmes haut risque mis sur le marché ou en service avant la date d’application du chapitre III (art. 113) : soumis au règlement seulement en cas de modifications importantes de leur conception ; systèmes destinés aux autorités publiques : conformité au plus tard le 2 août 2030","(3) modèles GPAI mis sur le marché avant le 2 août 2025 : conformité au plus tard le 2 août 2027","(4, ajouté par l’Omnibus) systèmes génératifs mis sur le marché avant le 2 août 2026 : marquage de l’art. 50(2) au plus tard le 2 décembre 2026"]},
 "113":{t:"Entrée en vigueur et application",s:"Dates d’application, modifiées par l’Omnibus :",l:["2 février 2025 : chapitres I et II (définitions, maîtrise de l’IA, pratiques interdites)","2 août 2025 : organismes notifiés, modèles GPAI (chapitre V), gouvernance, sanctions (sauf art. 101)","27 juillet 2026 : articles 102 à 110 (modifications d’autres textes)","2 août 2026 : date générale d’application","2 décembre 2026 : nouvelles interdictions de l’art. 5(1)(ba) et (bb)","2 décembre 2027 : chapitre III, sections 1 à 3, pour les systèmes de l’Annexe III (art. 6(2))","2 août 2028 : chapitre III, sections 1 à 3, pour les systèmes de l’Annexe I (art. 6(1))"]},
 "chap3":{t:"Chapitre III — Systèmes d’IA à haut risque (art. 6 à 49)",s:"Classification (art. 6-7), exigences applicables aux systèmes (art. 8-15), obligations des fournisseurs, déployeurs et autres opérateurs (art. 16-27), organismes notifiés (art. 28-39), normes, évaluation de la conformité, certificats et enregistrement (art. 40-49).",url:"https://ai-act-service-desk.ec.europa.eu/fr/ai-act/article-6"},
 "chapV":{t:"Chapitre V — Modèles d’IA à usage général (art. 51 à 56)",s:"Classification des modèles à risque systémique (art. 51-52), obligations de tous les fournisseurs de modèles (art. 53-54), obligations supplémentaires en cas de risque systémique (art. 55), codes de pratique (art. 56). Applicable depuis le 2 août 2025.",url:"https://ai-act-service-desk.ec.europa.eu/fr/ai-act/article-51"},

 "13":{t:"Informations à fournir lorsque des données à caractère personnel sont collectées auprès de la personne concernée",s:"Identité du responsable, finalités, base légale, destinataires, transferts, durée de conservation, droits, existence d’une prise de décision automatisée."},
 "14":{t:"Informations à fournir lorsque les données à caractère personnel n’ont pas été collectées auprès de la personne concernée",s:"Mêmes informations que l’art. 13, plus les catégories de données et leur source, fournies dans un délai raisonnable."},
 "22":{t:"Décision individuelle automatisée, y compris le profilage",s:"Toute personne a le droit de ne pas faire l’objet d’une décision fondée exclusivement sur un traitement automatisé produisant des effets juridiques ou l’affectant de manière significative, sauf exceptions (contrat, loi, consentement explicite) assorties de garanties, dont le droit d’obtenir une intervention humaine."},
 "35":{t:"Analyse d’impact relative à la protection des données",s:"Obligatoire lorsqu’un traitement est susceptible d’engendrer un risque élevé pour les droits et libertés, notamment en cas d’évaluation systématique fondée sur un traitement automatisé, de traitement à grande échelle de données sensibles ou de surveillance systématique."},

const MODULES = [
{ id:"m1", title:"The fundamentals", dur:"45 min", profiles:["cadre","resp"],
  goal:"Understand what the AI Act is, what it covers and its risk-based logic.",
  lessons:[
   {h:"A regulation, not a directive", body:`<p>The AI Act is <b>Regulation (EU) 2024/1689</b>, published in the Official Journal on 12 July 2024 and in force since <b>1 August 2024</b>. A regulation applies directly in every Member State, with no national transposing law. It was amended for the first time by the <b>Digital Omnibus Regulation (EU) 2026/1744</b>, in force since 27 July 2026.</p>
   <p>Its aim: to promote trustworthy, human-centric AI while protecting health, safety and fundamental rights.</p>`},
   {h:"What is an “AI system”?", body:`<p>The definition <span class="art">Art. 3(1)</span> rests on a few criteria: a <b>machine-based</b> system, designed to operate with some level of <b>autonomy</b>, that may show <b>adaptiveness</b> after deployment, and that <b>infers</b> from the input it receives how to generate outputs (predictions, content, recommendations, decisions) that can influence physical or virtual environments.</p>
   <p>The decisive criterion is <b>inference</b>. Software that only applies rules written by a human (a spreadsheet, an “if… then” script) is in principle not an AI system. The Commission has published guidelines on this definition.</p>`},
   {h:"Who is concerned?", body:`<p>The scope <span class="art">Art. 2</span> is broad and <b>extraterritorial</b>: it covers providers placing a system on the EU market even if established outside the EU, deployers established in the EU, and non-EU actors whose system output is used in the EU.</p>
   <p>Main exclusions: exclusively military, defence or national security uses; scientific research and development; research activities before placing on the market; purely personal, non-professional use by an individual.</p>`},
   {h:"The risk-based approach", body:`<p>Obligations are proportionate to risk:</p>
   <ul><li><b>Unacceptable risk</b>: prohibited practices <span class="art">Art. 5</span>.</li>
   <li><b>High risk</b>: heavy requirements <span class="art">Art. 6 to 49</span>.</li>
   <li><b>Transparency risk</b>: information obligations <span class="art">Art. 50</span>.</li>
   <li><b>Minimal risk</b>: no specific obligation, voluntary codes of conduct.</li></ul>
   <p>In parallel, a separate regime covers <b>general-purpose AI models</b> (GPAI), such as large language models <span class="art">Chap. V</span>.</p>`},
  ],
  keypts:["Directly applicable regulation, in force since 1 August 2024.","The key notion of an AI system is inference.","Extraterritorial reach.","Four risk levels + a GPAI regime."],
  deliv:"Two-page sheet “The AI Act in 10 definitions”: AI system, provider, deployer, placing on the market, putting into service, intended purpose, substantial modification, GPAI, systemic risk, AI literacy.",
