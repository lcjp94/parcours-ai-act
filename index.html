const MODULES = [
{ id:"m1", title:"The fundamentals", dur:"45 min", profiles:["cadre","resp"],
  goal:"Understand what the AI Act is, what it covers and its risk-based logic.",
  lessons:[
   {h:"A regulation, not a directive", body:`<p>The AI Act is <b>Regulation (EU) 2024/1689</b>, published in the Official Journal on 12 July 2024 and in force since <b>1 August 2024</b>. A regulation applies directly in every Member State, with no national transposing law. It was amended for the first time by the <b>Digital Omnibus Regulation (EU) 2026/1744</b>, in force since 27 July 2026.</p>
   <p>Its aim: to promote trustworthy, human-centric AI while protecting health, safety and fundamental rights.</p>`},
   {h:"What is an “AI system”?", body:`<p>The definition <span class="art">Art. 3(1)</span> rests on a few criteria: a <b>machine-based</b> system, designed to operate with some level of <b>autonomy</b>, that may show <b>adaptiveness</b> after deployment, and that <b>infers</b> from the input it receives how to generate outputs (predictions, content, recommendations, decisions) that can influence physical or virtual environments.</p>
   <p>The decisive criterion is <b>inference</b>. Software that only applies rules written by a human (a spreadsheet, an “if… then” script) is in principle not an AI system. The Commission has published guidelines on this definition.</p>`},
   {h:"Who is concerned?", body:`<p>The scope <span class="art">Art. 2</span> is broad and <b>extraterritorial</b>: it covers providers placing a system on the EU market even if established outside the EU, deployers established in the EU, and non-EU actors whose system output is used in the EU.</p>
   <p>Main exclusions: exclusively military, defence or national security uses; scientific research and development; research activities before placing on the market; purely personal, non-professional use by an individual.</p>`},
   {h:"The risk-based approach", body:`<p>Obligations are proportionate to risk:</p>
   <ul><li><b>Unacceptable risk</b>: prohibited practices <span class="art">Art. 5</span>.</li>
   <li><b>High risk</b>: heavy requirements <span class="art">Art. 6 to 49</span>.</li>
   <li><b>Transparency risk</b>: information obligations <span class="art">Art. 50</span>.</li>
   <li><b>Minimal risk</b>: no specific obligation, voluntary codes of conduct.</li></ul>
   <p>In parallel, a separate regime covers <b>general-purpose AI models</b> (GPAI), such as large language models <span class="art">Chap. V</span>.</p>`},
  ],
  keypts:["Directly applicable regulation, in force since 1 August 2024.","The key notion of an AI system is inference.","Extraterritorial reach.","Four risk levels + a GPAI regime."],
  deliv:"Two-page sheet “The AI Act in 10 definitions”: AI system, provider, deployer, placing on the market, putting into service, intended purpose, substantial modification, GPAI, systemic risk, AI literacy.",

   {id:"m1q3",lvl:1,p:"A US company with no subsidiary in Europe sells an AI tool to French customers. The AI Act…",o:["Does not apply, the company is outside the EU","Applies, its scope is extraterritorial","Applies only if the tool is open source","Applies only after a bilateral agreement"],a:1,e:"Article 2 covers providers placing a system on the EU market, wherever they are established."},

{ id:"m2", title:"Timeline and the 2026 Omnibus", dur:"30 min", profiles:["cadre","resp"],
  goal:"Know what already applies, what has been postponed, and avoid the “the AI Act has been delayed” mistake.",
  lessons:[
   {h:"Phased application", body:`<p>The AI Act does not apply all at once. The Omnibus 2026/1744, adopted by Parliament on 16 June 2026 and by the Council on 29 June 2026, published in the OJ on 24 July and in force since 27 July 2026, postponed the high-risk obligations but <b>not</b> transparency.</p>
   <div class="tbl"><table><thead><tr><th>Date</th><th>What applies</th></tr></thead><tbody>
   <tr><td class="date">02/02/2025</td><td>Prohibited practices <span class="art">Art. 5</span>; AI literacy <span class="art">Art. 4</span></td></tr>
   <tr><td class="date">02/08/2025</td><td>Obligations of GPAI model providers; governance; national penalty regimes</td></tr>
   <tr><td class="date">27/07/2026</td><td>Omnibus enters into force; new Article 4 (AI literacy)</td></tr>
   <tr><td class="date">02/08/2026</td><td>General application; transparency <span class="art">Art. 50</span>; enforcement powers of the AI Office and national authorities; GPAI fines</td></tr>
   <tr><td class="date">02/12/2026</td><td>Two new prohibitions (non-consensual intimate content, child sexual abuse material); end of the marking grace period for generative systems placed on the market before 2 August 2026</td></tr>
   <tr><td class="date">02/08/2027</td><td>Compliance of GPAI models placed on the market before 2 August 2025</td></tr>
   <tr><td class="date">02/12/2027</td><td>Stand-alone high risk, <b>Annex III</b> (recruitment, credit, education…), instead of 2 August 2026</td></tr>
   <tr><td class="date">02/08/2028</td><td>High risk embedded in products, <b>Annex I</b>, instead of 2 August 2027</td></tr>
   <tr><td class="date">02/08/2030</td><td>High-risk systems already used by public authorities</td></tr>
   </tbody></table></div>`},
   {h:"Postponed does not mean paused", body:`<p>In October 2026, a company that provides or uses AI must already comply with: the <b>prohibitions</b>, <b>Article 4</b> on AI literacy, the <b>GPAI</b> obligations (for model providers) and the Article 50 <b>transparency</b> rules.</p>
   <p>The high-risk postponement buys time to prepare, not an exemption. The harmonised standards, whose delay motivated the postponement, are still being developed.</p>`},
   {h:"Systems already on the market", lvl:2, body:`<p>The transitional regime of <span class="art">Art. 111</span> provides that high-risk systems placed on the market or put into service before the Chapter III application date (2 December 2027 for Annex III, 2 August 2028 for Annex I, under <span class="art">Art. 113</span>) are subject to the regulation only if they subsequently undergo <b>significant changes in their design</b>. Exception: those intended to be used by public authorities must comply by <b>2 August 2030</b> at the latest.</p>`},
  ],
  keypts:["Prohibitions and AI literacy: since February 2025.","Art. 50 transparency: since 2 August 2026, not postponed.","High risk Annex III: 2 December 2027; Annex I: 2 August 2028."],

   {id:"m2q2",lvl:1,p:"Did the 2026 Omnibus postpone the Article 50 transparency obligations (chatbots, deepfakes)?",o:["Yes, to December 2027","No, they have applied since 2 August 2026","Yes, to August 2028","They were removed"],a:1,e:"Only a technical marking grace period until 2 December 2026 was granted for generative systems already on the market."},

   {id:"m2q4",lvl:2,p:"A medical device embedding AI (Annex I) must comply by…",o:["2 December 2026","2 December 2027","2 August 2028","2 August 2030"],a:2,e:"Annex I high risk is postponed from 2 August 2027 to 2 August 2028."},
   {id:"m2q5",lvl:2,p:"Since when have the obligations of GPAI model providers applied to new models?",o:["2 February 2025","2 August 2025","2 August 2026","2 August 2027"],a:1,e:"Chapter V has applied since 2 August 2025; earlier models have until 2 August 2027."},

{ id:"m3", title:"Roles and responsibilities", dur:"45 min", profiles:["cadre","resp"],
  goal:"Identify whether your organisation is a provider, deployer, importer or distributor.",
  lessons:[
   {h:"The operators", body:`<ul>
   <li><b>Provider</b> <span class="art">Art. 3(3)</span>: develops a system or model (or has it developed) and places it on the market or puts it into service <b>under its own name or trademark</b>.</li>
   <li><b>Deployer</b> <span class="art">Art. 3(4)</span>: uses an AI system under its authority in a professional context.</li>
   <li><b>Importer</b>: established in the EU, places on the market a system bearing the name of a non-EU entity.</li>
   <li><b>Distributor</b>: makes a system available without being the provider or the importer.</li>
   <li><b>Authorised representative</b>: represents a non-EU provider in the EU.</li></ul>
   <p>Most companies are <b>deployers</b>: they buy or subscribe to AI tools. Those that build their own tools, even on top of a model API, can become <b>providers</b> of those systems.</p>`},
   {h:"When a deployer becomes a provider", body:`<p><span class="art">Art. 25</span> provides that a distributor, importer, deployer or third party is considered a provider of a high-risk system if it:</p>
   <ol><li>puts its name or trademark on a high-risk system already on the market;</li>
   <li>makes a <b>substantial modification</b> to it such that it remains high-risk;</li>
   <li>changes the <b>intended purpose</b> of a non-high-risk system so that it becomes high-risk (e.g. using a general-purpose chatbot to screen candidates).</li></ol>
   <p>This mechanism is a common trap: a repurposed use can shift the entire compliance burden onto the user company.</p>`},
   {h:"Contractual consequences", lvl:2, body:`<p>The Omnibus added to <span class="art">Art. 99(4)</span> a point covering the obligations in <span class="art">Art. 25(2) and (4)</span> (cooperation and information between the initial and the new provider, and written agreements with third parties supplying components). In practice, review your supplier clauses: documentation supplied, instructions for use, compliance assistance, notification of changes.</p>`},
  ],
  keypts:["Provider = places on the market under its own name.","Deployer = uses under its authority, professionally.","Art. 25: branding, substantial modification or a change of purpose turns you into a provider."],
  deliv:"Role / obligations / expected evidence matrix for the 5 operators, plus an Art. 25 switch example drawn from a real or plausible case.",

{ id:"m4", title:"Prohibited practices", dur:"40 min", profiles:["cadre","resp"],
  goal:"Recognise immediately the uses that no company may deploy.",
  lessons:[
   {h:"The eight original prohibitions (Art. 5)", body:`<ol>
   <li><b>Subliminal, manipulative or deceptive</b> techniques that materially distort behaviour and cause significant harm.</li>
   <li><b>Exploitation of vulnerabilities</b> due to age, disability or a social or economic situation.</li>
   <li><b>Social scoring</b> leading to unjustified or disproportionate detrimental treatment.</li>
   <li>Assessing the risk that a person will commit a criminal offence, based <b>solely on profiling</b> or personality traits.</li>
   <li>Building facial recognition databases through <b>untargeted scraping</b> of images from the internet or CCTV.</li>
   <li><b>Emotion recognition</b> in the workplace and in education, except for medical or safety reasons.</li>
   <li><b>Biometric categorisation</b> inferring race, political opinions, trade union membership, religious beliefs, sex life or sexual orientation.</li>
   <li><b>Real-time remote biometric identification</b> in publicly accessible spaces for law enforcement, except in strictly limited cases (searching for victims, imminent threat, suspects of serious crimes).</li></ol>`},
   {h:"Two Omnibus additions", body:`<p>From <b>2 December 2026</b>, the Omnibus prohibits AI systems that generate <b>non-consensual intimate images</b> of real people (“nudification”) and <b>child sexual abuse material</b>.</p>`},
   {h:"The most common case in companies", body:`<p>The prohibition most likely to affect an ordinary company is <b>emotion recognition of employees</b>: analysing tone of voice in a call centre to assess agents’ mood, detecting stress in video calls, and so on. Check the “analytics” features of the tools you buy.</p>
   <p>Breaches of Article 5 fall under the highest fine ceiling: <b>€35m or 7% of worldwide turnover</b>, whichever is higher <span class="art">Art. 99(3)</span>.</p>`},
  ],
  keypts:["Applicable since 2 February 2025, to all operators.","Emotion recognition at work: prohibited except for medical or safety reasons.","Ceiling: €35m or 7% of worldwide turnover."],
  deliv:"Purchasing checklist on prohibited practices, to attach to every AI tool procurement (10 yes/no questions for the supplier).",
  quiz:[
   {id:"m4q1",lvl:1,p:"A call centre wants to analyse its agents’ voices to measure their stress level. This is…",o:["Allowed with consent","A prohibited practice (emotion recognition at work)","A minimal-risk system","High risk only"],a:1,e:"Emotion recognition at work is prohibited, except for medical or safety reasons."},
   {id:"m4q2",lvl:1,p:"Maximum fine for a prohibited practice?",o:["€7.5m or 1%","€15m or 3%","€35m or 7% of worldwide turnover","4% of turnover, as under the GDPR"],a:2,e:"Art. 99(3): €35m or 7% of worldwide annual turnover, whichever is higher (lower for SMEs)."},
   {id:"m4q3",lvl:1,p:"Which one is prohibited?",o:["A customer-support chatbot","Social scoring leading to disproportionate detrimental treatment","A spam filter","A translation tool"],a:1,e:"Social scoring is one of the Article 5 practices."},
   {id:"m4q4",lvl:2,p:"Building a facial recognition database by mass-scraping photos from the internet is…",o:["Allowed if the database is encrypted","Prohibited (untargeted scraping)","High risk, Annex III","Allowed for commercial research"],a:1,e:"Untargeted scraping of facial images is explicitly prohibited."},
  ]},
{ id:"m5", title:"High-risk systems", dur:"1 h 30", profiles:["resp"],
  goal:"Classify a high-risk system and know the requirements for the provider and the deployer.",
  lessons:[
   {h:"Two routes in (Art. 6)", body:`<ul>
   <li><b>Annex I</b> <span class="art">Art. 6(1)</span>: the AI is a product, or a safety component of a product, covered by Union harmonisation legislation (machinery, toys, medical devices, lifts…) and subject to third-party conformity assessment. Application: 2 August 2028.</li>
   <li><b>Annex III</b> <span class="art">Art. 6(2)</span>: eight areas of use. Application: 2 December 2027.</li></ul>
   <div class="tbl"><table><thead><tr><th>Annex III area</th><th>Examples</th></tr></thead><tbody>
   <tr><td>1. Biometrics</td><td>Remote identification, categorisation, emotion recognition (outside the prohibitions)</td></tr>
   <tr><td>2. Critical infrastructure</td><td>Road traffic, water, gas, electricity management</td></tr>
   <tr><td>3. Education and vocational training</td><td>Admission, assessment of learning, exam proctoring</td></tr>
   <tr><td>4. Employment</td><td>Recruitment, CV screening, promotion, termination, task allocation, evaluation</td></tr>
   <tr><td>5. Essential services</td><td>Public benefits, credit scoring, life and health insurance pricing, emergency call triage</td></tr>
   <tr><td>6. Law enforcement</td><td>Evaluating evidence, risk of victimisation</td></tr>
   <tr><td>7. Migration and borders</td><td>Examining asylum or visa applications</td></tr>
   <tr><td>8. Justice and democracy</td><td>Assisting judicial decisions, influencing elections</td></tr></tbody></table></div>`},
   {h:"The Art. 6(3) derogation", body:`<p>An Annex III system is not high-risk if it does not pose a significant risk, in particular where it: performs a <b>narrow procedural task</b>; <b>improves the result</b> of a previously completed human activity; detects decision-making patterns without replacing human assessment; or performs a <b>preparatory task</b>.</p>
   <p>Exception to the exception: a system that performs <b>profiling</b> of natural persons is always high-risk. A provider relying on the derogation must document its assessment.</p>`},
   {h:"Requirements for the system (Art. 9 to 15)", body:`<ul>
   <li>A <b>risk management</b> system across the whole life cycle <span class="art">Art. 9</span></li>
   <li><b>Data governance</b>: quality, representativeness, bias <span class="art">Art. 10</span></li>
   <li><b>Technical documentation</b> <span class="art">Art. 11</span> (simplified for SMEs and small mid-caps after the Omnibus)</li>
   <li>Automatic <b>logging</b> of events <span class="art">Art. 12</span></li>
   <li><b>Transparency</b> towards deployers: instructions for use <span class="art">Art. 13</span></li>
   <li>Effective <b>human oversight</b> <span class="art">Art. 14</span></li>
   <li><b>Accuracy, robustness, cybersecurity</b> <span class="art">Art. 15</span></li></ul>
   <p>The provider adds: a quality management system <span class="art">Art. 17</span>, conformity assessment, EU declaration and CE marking, registration in the EU database, post-market monitoring and reporting of serious incidents.</p>`},
   {h:"Deployer obligations (Art. 26 and 27)", body:`<ul>
   <li>Use the system in line with the instructions for use.</li>
   <li>Assign <b>human oversight</b> to competent, trained people with the necessary authority.</li>
   <li>Ensure the relevance of the <b>input data</b> it controls.</li>
   <li>Monitor operation and report risks or incidents to the provider.</li>
   <li>Keep the generated <b>logs</b> for at least <b>six months</b> <span class="art">Art. 26(6)</span>.</li>
   <li><b>Inform workers’ representatives</b> and the workers concerned before putting the system into service at the workplace <span class="art">Art. 26(7)</span>.</li>
   <li>Inform people subject to a decision assisted by the system.</li></ul>
   <p>Public bodies, private entities providing public services, and deployers of credit scoring or life and health insurance pricing carry out a <b>fundamental rights impact assessment</b> (FRIA) <span class="art">Art. 27</span>. Affected persons have a <b>right to explanation</b> <span class="art">Art. 86</span>.</p>`},
  ],
  keypts:["Annex I (products) and Annex III (8 areas of use).","Art. 6(3): documented derogation, never in case of profiling.","Deployer: human oversight, logs ≥ 6 months, informing workers and affected persons."],
  deliv:"High-risk audit checklist in two columns (provider / deployer), with the article and the expected evidence for each line.",
  quiz:[
   {id:"m5q1",lvl:1,p:"A tool that automatically ranks CVs falls under…",o:["Minimal risk","Annex III, employment area","A prohibited practice","Annex I"],a:1,e:"Recruitment and selection of candidates are listed in point 4 of Annex III."},
   {id:"m5q2",lvl:1,p:"Minimum log retention period for the deployer of a high-risk system:",o:["1 month","6 months","1 year","5 years"],a:1,e:"Art. 26(6): at least six months, unless applicable law provides otherwise."},
   {id:"m5q3",lvl:2,p:"An Annex III system can escape high risk via Art. 6(3) unless it…",o:["Is developed outside the EU","Performs profiling of natural persons","Uses the cloud","Is open source"],a:1,e:"A system that profiles natural persons is always high-risk."},
   {id:"m5q4",lvl:2,p:"Who must carry out a fundamental rights impact assessment (Art. 27)?",o:["Every deployer","Public bodies, private entities providing public services, and deployers of credit scoring or life and health insurance pricing","Providers only","SMEs only"],a:1,e:"Article 27 targets these categories of deployers."},
   {id:"m5q5",lvl:2,p:"Before putting a high-risk system into service at the workplace, the employer must…",o:["Obtain each employee’s written consent","Inform workers’ representatives and the workers concerned","Notify the data protection authority","Nothing in particular"],a:1,e:"Art. 26(7). National labour law (e.g. works council consultation in France) may add further requirements."},
  ]},
{ id:"m6", title:"Transparency (Art. 50)", dur:"40 min", profiles:["cadre","resp"],
  goal:"Apply the information obligations in force since 2 August 2026.",
  lessons:[
   {h:"Four obligations", body:`<div class="tbl"><table><thead><tr><th>Situation</th><th>Who</th><th>Obligation</th></tr></thead><tbody>
   <tr><td>System interacting with people (chatbot, voicebot)</td><td>Provider</td><td>Design the system so people know they are talking to an AI, unless it is obvious</td></tr>
   <tr><td>Synthetic content (text, image, audio, video)</td><td>Provider</td><td>Machine-readable, detectable marking</td></tr>
   <tr><td>Emotion recognition or biometric categorisation</td><td>Deployer</td><td>Inform the persons exposed</td></tr>
   <tr><td>Deep fake</td><td>Deployer</td><td>Disclose that the content has been generated or manipulated</td></tr>
   <tr><td>Text published to inform the public on matters of public interest</td><td>Deployer</td><td>Disclose the AI origin, unless there is human review and editorial responsibility</td></tr>
   </tbody></table></div>`},
   {h:"What changes for a marketing team", body:`<ul>
   <li>A conversational assistant on the website must present itself as an AI.</li>
   <li>An advertising video featuring a real person recreated by AI must be flagged as such (adjustments exist for evidently artistic or satirical works).</li>
   <li>A blog post generated by AI and reviewed under editorial responsibility has no Art. 50 disclosure obligation; keep a record of that review.</li></ul>
   <p>Breaches fall under the ceiling of <b>€15m or 3%</b> of worldwide turnover <span class="art">Art. 99(4)</span>.</p>`},
   {h:"Marking grace period", lvl:2, body:`<p>Providers of generative systems placed on the market <b>before 2 August 2026</b> have until <b>2 December 2026</b> to implement machine-readable marking. This grace period does not cover the other Article 50 obligations. The Commission supports implementation with guidelines and a code of practice on marking <span class="verify">to be verified</span> (check the version in force).</p>`},
  ],
  keypts:["In force since 2 August 2026, not postponed.","Chatbot: tell people they are talking to an AI.","Deep fake: the deployer discloses it.","Ceiling: €15m or 3%."],
  deliv:"One-page AI transparency charter for a marketing team: when to mention AI, how, and who approves.",
  quiz:[
   {id:"m6q1",lvl:1,p:"Your website offers an AI conversational assistant. What must you do?",o:["Nothing, it is minimal risk","Make sure users know they are interacting with an AI","Obtain CE marking","Notify the authority"],a:1,e:"Art. 50(1): interaction with an AI must be disclosed, unless it is obvious."},
   {id:"m6q2",lvl:1,p:"Who must disclose that a video is a deep fake?",o:["The model provider only","The deployer publishing the content","The hosting platform alone","Nobody"],a:1,e:"The obligation to disclose deep fakes lies with the deployer."},
   {id:"m6q3",lvl:1,p:"Since when have the Article 50 obligations applied?",o:["2 February 2025","2 August 2026","2 December 2027","2 August 2028"],a:1,e:"2 August 2026, the general application date, not postponed by the Omnibus."},
   {id:"m6q4",lvl:2,p:"AI-generated text on matters of public interest need not be disclosed if…",o:["It is under 500 words","It has undergone human review under editorial responsibility","It is published on LinkedIn","It is in English"],a:1,e:"Art. 50(4) provides for this exception."},
  ]},
{ id:"m7", title:"General-purpose AI models (GPAI)", dur:"1 h", profiles:["resp"],
  goal:"Distinguish the model provider’s obligations from those of the company integrating the model.",
  lessons:[
   {h:"Obligations of every GPAI model provider (Art. 53)", body:`<ul>
   <li><b>Technical documentation</b> of the model, kept available for the AI Office.</li>
   <li><b>Information for downstream providers</b> integrating the model into their systems.</li>
   <li>A <b>copyright compliance policy</b>, including rights reservations (opt-out).</li>
   <li>A <b>public summary</b> of the training content, using the Commission’s template.</li></ul>
   <p>Models released under a free and open-source licence benefit from lighter obligations, unless they present a systemic risk.</p>`},
   {h:"Systemic risk (Art. 51 and 55)", body:`<p>A model is presumed to present systemic risk when the cumulative compute used for its training exceeds <b>10<sup>25</sup> FLOP</b> (a threshold the Commission can amend). Additional obligations: evaluations and adversarial testing, risk mitigation, reporting of serious incidents, cybersecurity.</p>
   <p>A <b>GPAI code of practice</b>, published in July 2025, lets providers demonstrate compliance. AI Office fines against model providers have applied since 2 August 2026 <span class="art">Art. 101</span>.</p>`},
   {h:"And your company?", body:`<p>A company calling a model via an API is <b>not</b> the provider of the model. It is, however:</p>
   <ul><li>the <b>deployer</b> of the tool if it uses it internally;</li>
   <li>the <b>provider of the AI system</b> it builds and makes available under its name (Art. 50, or even high risk depending on the use).</li></ul>
   <p>What it should check with the model provider: documentation supplied to integrators, copyright policy, adherence to the code of practice, data location and retention, terms for using its prompts for training.</p>`},
  ],
  keypts:["GPAI obligations lie with the model provider.","Systemic risk threshold: 10^25 FLOP.","A company integrating a model can become the provider of its own system."],
  deliv:"Sheet “GPAI: what a user company should check”, in the form of a supplier questionnaire.",
  quiz:[
   {id:"m7q1",lvl:2,p:"A company uses a large model via API for an internal tool. Is it subject to the Art. 53 obligations?",o:["Yes, like any user","No, they lie with the model provider","Yes, if it has more than 250 employees","Only in case of systemic risk"],a:1,e:"Chapter V targets model providers. The company remains a deployer or the provider of its own system."},
   {id:"m7q2",lvl:2,p:"Presumption threshold for systemic risk of a GPAI model:",o:["10^20 FLOP","10^23 FLOP","10^25 FLOP","1 billion parameters"],a:2,e:"Art. 51: 10^25 FLOP of cumulative training compute."},
   {id:"m7q3",lvl:2,p:"Which one is NOT a baseline obligation of a GPAI provider?",o:["Copyright compliance policy","Public summary of training data","CE marking of the model","Documentation for downstream providers"],a:2,e:"CE marking concerns high-risk systems, not GPAI models."},
   {id:"m7q4",lvl:2,p:"Who can fine GPAI model providers?",o:["National data protection authorities alone","The European Commission (AI Office)","Each commercial court","Nobody"],a:1,e:"Art. 101: the Commission, since 2 August 2026."},
  ]},
{ id:"m8", title:"AI literacy and governance", dur:"1 h", profiles:["cadre","resp"],
  goal:"Implement Article 4 and proportionate AI governance.",
  lessons:[
   {h:"Article 4 after the Omnibus", body:`<p>Since 27 July 2026, Article 4 has been fully rewritten. Providers and deployers no longer have to “ensure a sufficient level” of AI literacy; they must <b>take measures to support its development</b> among their staff and the people using the systems on their behalf, taking into account their knowledge, training and the context of use.</p>
   <p>The text states that this obligation does not require guaranteeing any specific level for any individual. It is an <b>obligation of means</b>. It remains binding, and you must be able to show what was done.</p>
   <p>Article 99 provides no specific fine for Article 4, but a lack of training can weigh in the assessment of other breaches.</p>`},
   {h:"Governance in five building blocks", body:`<ol>
   <li><b>Inventory</b> of AI systems: purpose, data, supplier, users, decisions influenced.</li>
   <li><b>Classification</b>: the company’s role and the risk level for each system.</li>
   <li><b>Acceptable use policy</b>: authorised tools, data banned from prompts, human validation.</li>
   <li><b>Procurement</b>: supplier questionnaire, contract clauses, review before going live.</li>
   <li><b>Training</b> tailored to each population, with records (content, attendance, assessment).</li></ol>`},
   {h:"Penalties and authorities", lvl:2, body:`<div class="tbl"><table><thead><tr><th>Breach</th><th>Ceiling</th><th>Article</th></tr></thead><tbody>
   <tr><td>Prohibited practices</td><td>€35m or 7% of worldwide turnover</td><td class="date">99(3)</td></tr>
   <tr><td>Operator obligations (providers, deployers, Art. 50…)</td><td>€15m or 3%</td><td class="date">99(4)</td></tr>
   <tr><td>Incorrect information to authorities</td><td>€7.5m or 1%</td><td class="date">99(5)</td></tr>
   <tr><td>GPAI model providers</td><td>€15m or 3%</td><td class="date">101</td></tr></tbody></table></div>
   <p>For SMEs and start-ups, the <b>lower amount</b> of the two applies; the Omnibus extended this rule to small mid-cap enterprises for the ceilings in paragraphs 4 and 5 only <span class="art">Art. 99(6a)</span>. Each Member State designates its market surveillance authorities. Check how competences are allocated in your country <span class="verify">to be verified</span>.</p>`},
  ],
  keypts:["Art. 4: an obligation of means since the Omnibus, still binding.","Inventory, classification, policy, procurement, training.","Document everything: evidence is what protects you."],
  deliv:"90-day AI literacy plan: populations, durations, content, assessment methods, evidence kept.",
  quiz:[
   {id:"m8q1",lvl:1,p:"After the Omnibus, Article 4 requires companies to…",o:["Guarantee a certified level of AI competence for each employee","Take measures to support the development of AI literacy","Nothing, it was deleted","Have their training certified by the State"],a:1,e:"Article 4 was rewritten as an obligation of means, with no individual level to guarantee."},
   {id:"m8q2",lvl:1,p:"First step of an AI Act compliance programme?",o:["Buy a certification","Inventory the AI systems used or developed","Ban generative AI","Appoint a DPO"],a:1,e:"Without an inventory, roles and risks cannot be classified."},
   {id:"m8q3",lvl:1,p:"An employee pastes customer data into an unapproved consumer chatbot. Which governance building block is missing?",o:["CE marking","An acceptable use policy specifying authorised tools and banned data","A FRIA","An authorised representative"],a:1,e:"The acceptable use policy and training address this very common risk."},
   {id:"m8q4",lvl:2,p:"For an SME, the applicable fine ceiling is…",o:["The higher of the fixed amount and the percentage","The lower of the fixed amount and the percentage","Always 1% of turnover","Set freely by the court with no ceiling"],a:1,e:"Art. 99(6): for SMEs and start-ups, the lower of the two amounts."},
  ]},
{ id:"m9", title:"AI Act and GDPR", dur:"1 h", profiles:["resp"],
  goal:"Combine the two texts without duplication or blind spots.",
  lessons:[
   {h:"Two cumulative texts", body:`<p>The AI Act does not replace the GDPR: as soon as an AI system processes personal data, both apply. The AI Act governs the <b>product and its use</b>; the GDPR governs the <b>processing of data</b>.</p>
   <div class="tbl"><table><thead><tr><th>Topic</th><th>GDPR</th><th>AI Act</th></tr></thead><tbody>
   <tr><td>Impact assessment</td><td>DPIA <span class="art rgpd">GDPR art. 35</span></td><td>FRIA <span class="art">Art. 27</span> (can rely on the DPIA)</td></tr>
   <tr><td>Automated decisions</td><td>Right not to be subject to a solely automated decision <span class="art rgpd">GDPR art. 22</span></td><td>Human oversight <span class="art">Art. 14</span>, right to explanation <span class="art">Art. 86</span></td></tr>
   <tr><td>Data</td><td>Legal basis, minimisation, retention</td><td>Quality, representativeness, bias <span class="art">Art. 10</span></td></tr>
   <tr><td>Transparency</td><td>Information to data subjects <span class="art rgpd">GDPR art. 13-14</span></td><td>Information about the AI <span class="art">Art. 50</span></td></tr>
   <tr><td>Logs</td><td>Logs often contain personal data</td><td>Log retention <span class="art">Art. 12, 26</span></td></tr></tbody></table></div>`},
   {h:"Bias detection: the new Article 4a", body:`<p>The Omnibus replaced former Article 10(5) with an <b>Article 4a</b> <span class="art">Art. 4a</span> providing a legal basis to process, exceptionally and with safeguards, special categories of data in order to detect and correct bias. It now also covers deployers of high-risk systems and other systems and models. The text states that it does <b>not create an obligation</b> to carry out such detection.</p>`},
   {h:"Practical method", body:`<ol><li>A single AI inventory linked to the record of processing activities.</li>
   <li>A joint DPIA and FRIA when both are required.</li>
   <li>Involve the DPO in AI governance from the procurement stage.</li>
   <li>For agents and RAG: access control on documents, conversation retention period, supplier’s use of prompts.</li></ol>`},
  ],
  keypts:["AI Act + GDPR apply together whenever personal data is involved.","DPIA and FRIA can be carried out jointly.","Art. 4a: a legal basis for bias detection, not an obligation."],
  deliv:"AI Act / GDPR matrix applied to one use case (e.g. a RAG assistant on customer documents).",
  quiz:[
   {id:"m9q1",lvl:2,p:"An AI system processes personal data. Which texts apply?",o:["The AI Act alone, it replaces the GDPR","The GDPR alone","Both, cumulatively","Neither if processing is internal"],a:2,e:"The two regimes apply cumulatively."},
   {id:"m9q2",lvl:2,p:"The AI Act FRIA can…",o:["Fully replace the DPIA","Rely on an existing DPIA to avoid duplication","Be carried out by the provider instead of the deployer","Be skipped if a DPIA exists"],a:1,e:"Art. 27(4) allows some obligations to be met through the DPIA carried out under GDPR Art. 35, by cross-referencing it."},
   {id:"m9q3",lvl:2,p:"The new Article 4a introduced by the Omnibus…",o:["Requires all systems to be tested for bias","Provides a legal basis to process certain sensitive data to detect bias, without creating an obligation","Bans any processing of sensitive data","Repeals GDPR Article 22"],a:1,e:"The text expressly states that it does not create an obligation to carry out detection."},
  ]},
{ id:"m10", title:"Audit method and case studies", dur:"2 h", profiles:["resp"],
  goal:"Apply a repeatable method and defend it in an interview.",
  lessons:[
   {h:"The five-step method", body:`<ol>
   <li><b>Describe</b>: purpose, users, affected persons, data, supplier, degree of autonomy.</li>
   <li><b>Classify the role</b>: provider, deployer, Art. 25 switch?</li>
   <li><b>Classify the risk</b>: prohibited? Annex I? Annex III and the 6(3) derogation? Art. 50?</li>
   <li><b>List the obligations</b> with their application dates.</li>
   <li><b>30/60/90-day action plan</b>: actions, owner, evidence.</li></ol>
   <p>The <b>Assess a use case</b> tab applies steps 2 to 4 as a questionnaire.</p>`},
   {h:"Case 1: B2B prospecting AI agent", body:`<p>An agent generates and sends personalised messages to prospects using LinkedIn and CRM data.</p>
   <ul><li><b>Role</b>: deployer if the tool is bought; provider if it is developed and sold.</li>
   <li><b>Risk</b>: not Annex III; Art. 50 if the agent converses with prospects (disclose the AI).</li>
   <li><b>Points of attention</b>: GDPR (legal basis for prospecting, information, right to object), human validation of messages, prompt injection via external content, logging of the agent’s actions.</li></ul>`},
   {h:"Case 2: internal RAG assistant on customer documents", body:`<ul><li><b>Role</b>: provider if the company builds it itself (put into service for its own use), otherwise deployer.</li>
   <li><b>Risk</b>: usually minimal risk or transparency, unless used for an Annex III purpose (e.g. supporting credit decisions).</li>
   <li><b>Controls</b>: inheritance of document access rights, per-customer partitioning, query logging, retention period, prompt injection testing, supplier clause on non-reuse of data.</li></ul>`},
   {h:"Interview questions", body:`<ul>
   <li>“Is a customer chatbot always high-risk?” No: it usually falls under Art. 50; it becomes high-risk if its use falls under Annex III.</li>
   <li>“What is the difference between provider and deployer?” Placing on the market under one’s own name versus use under one’s authority, with the Art. 25 switch.</li>
   <li>“The AI Act has been postponed, can we wait?” No: prohibitions, Art. 4, GPAI and Art. 50 already apply; the postponement only concerns high risk.</li>
   <li>“Where would you start here?” Inventory, classification, hunting for prohibited uses (emotions), chatbot transparency, acceptable use policy.</li></ul>
   <p><b>60-second pitch</b>: “I bridge operational AI and compliance. I can inventory systems, classify role and risk, identify AI Act and GDPR obligations with their post-2026-Omnibus dates, and propose concrete controls. I have applied this method to a prospecting agent and an internal RAG assistant.”</p>`},
  ],
  keypts:["Describe, classify the role, classify the risk, list, plan.","Always date the obligations.","An audit grid shown in an interview beats a certificate."],
  deliv:"Two 4-to-6-page case files (prospecting agent, internal RAG) + a one-page written pitch.",
  quiz:[
   {id:"m10q1",lvl:2,p:"A customer-support chatbot usually falls under…",o:["High risk","Article 50 (transparency)","Prohibited practices","No rule at all"],a:1,e:"Unless used for an Annex III purpose, it is a transparency obligation."},
   {id:"m10q2",lvl:2,p:"In an internal RAG, which control best addresses the risk of leaks between customers?",o:["A bigger model","Inheriting document access rights and partitioning per customer","Content marking","A FRIA"],a:1,e:"Access control at document retrieval level is the key measure."},
   {id:"m10q3",lvl:2,p:"A recruiter says: “the AI Act has been postponed to 2027”. Most accurate answer:",o:["True for the whole text","Only high risk is postponed; prohibitions, Art. 4, GPAI and transparency already apply","It has been repealed","It only applies to Big Tech"],a:1,e:"This is the most common mistake since the Omnibus."},
   {id:"m10q4",lvl:2,p:"A prospecting agent reads web pages to personalise its messages. Which security risk should be checked first?",o:["Prompt injection via external content","CE marking","Facial recognition","The 10^25 FLOP threshold"],a:0,e:"External content can contain malicious instructions that hijack the agent."},
  ]},
];

 e:"Art. 99(3) : 35 M€ ou 7 % du CA mondial, le montant le plus élevé étant retenu. 7 % de 2 Md€ = 140 M€, supérieur à 35 M€."},
{id:"m4c3b",c:"m4c3",t:"s",p:"Pour une grande entreprise, comment s’applique le plafond « 35 M€ ou 7 % du CA mondial » ?",
 o:["On retient le plus élevé des deux montants","On retient le plus faible des deux","On fait la moyenne des deux","C’est toujours 35 M€"],a:0,
 e:"Le montant le plus élevé est retenu, sauf pour les PME et start-up, pour lesquelles c’est le plus faible."},
{id:"m4c4a",c:"m4c4",t:"s",p:"À partir de quelle date est interdit un système d’IA conçu pour générer des images intimes non consenties de personnes réelles (« nudification ») ?",
 o:["2 février 2025","27 juillet 2026","2 août 2026","2 décembre 2026"],a:3,
 e:"C’est l’un des deux ajouts de l’Omnibus à l’art. 5, avec les contenus pédocriminels, applicables à partir du 2 décembre 2026."},
{id:"m4c4b",c:"m4c4",t:"m",p:"Quelles affirmations sur les interdictions sont exactes ?",
 o:["Constituer une base de reconnaissance faciale par moissonnage non ciblé d’images sur internet est interdit","L’identification biométrique à distance en temps réel dans l’espace public à des fins répressives est interdite, sauf exceptions strictes","Les interdictions ne visent que les fournisseurs, pas les déployeurs","Une pratique interdite devient licite si une analyse d’impact est réalisée"],a:[0,1],
 e:"Les interdictions s’appliquent à tous les opérateurs, y compris les déployeurs. Aucune analyse d’impact ne permet de lever une interdiction."},
/* ---------- M5 ---------- */
{id:"m5c1a",c:"m5c1",t:"m",p:"Lesquels de ces systèmes relèvent de l’Annexe III ?",
 o:["Un scoring de crédit de particuliers","La surveillance des examens dans un établissement d’enseignement","Le tri des appels d’urgence","Un filtre anti-spam de messagerie","Un moteur de recommandation de films"],a:[0,1,2],
 e:"Crédit et tri des appels d’urgence relèvent des services essentiels (point 5), la surveillance d’examens de l’éducation (point 3). Les deux derniers ne figurent pas à l’Annexe III."},
{id:"m5c1b",c:"m5c1",t:"s",p:"Un logiciel d’IA de diagnostic, composant d’un dispositif médical soumis à évaluation de conformité par un tiers, est haut risque par quelle voie ?",
 o:["Art. 6(1) et Annexe I, avec application au 2 août 2028","Art. 6(2) et Annexe III, avec application au 2 décembre 2027","Art. 50 uniquement","Art. 5"],a:0,
 e:"Les produits et composants de sécurité couverts par la législation d’harmonisation de l’Annexe I et soumis à un tiers relèvent de l’art. 6(1)."},
{id:"m5c2a",c:"m5c2",t:"s",p:"Un outil d’IA (domaine emploi) se contente de reformater les CV reçus dans un modèle standard, sans les noter, les classer ni profiler les candidats. Le fournisseur peut…",
 o:["Envisager la dérogation de l’art. 6(3) (tâche procédurale étroite), en documentant son analyse et en enregistrant le système","Ignorer l’AI Act, l’emploi n’étant pas concerné","Invoquer la même dérogation pour un outil qui classe les candidats par profilage","Demander une autorisation préalable à la Commission"],a:0,
 e:"La dérogation couvre notamment les tâches procédurales étroites. Le fournisseur documente son évaluation avant la mise sur le marché ; l’obligation d’enregistrement a été maintenue par l’Omnibus."},
{id:"m5c2b",c:"m5c2",t:"s",p:"Un système de l’Annexe III établit un profil de personnalité des candidats pour préparer le travail du recruteur. Peut-il bénéficier de la dérogation de l’art. 6(3) ?",
 o:["Oui, puisqu’il s’agit d’une tâche préparatoire","Non : un système qui profile des personnes physiques est toujours considéré comme haut risque","Oui, si le recruteur valide la décision finale","Oui, si le fournisseur est une PME"],a:1,
 e:"Le profilage de personnes physiques exclut la dérogation, quel que soit le caractère préparatoire de la tâche."},
{id:"m5c3a",c:"m5c3",t:"m",p:"Lesquelles sont des obligations du fournisseur d’un système haut risque ?",
 o:["Un système de gestion des risques sur tout le cycle de vie (art. 9)","Un système de gestion de la qualité (art. 17)","L’évaluation de conformité, la déclaration UE de conformité et le marquage CE","Réaliser la FRIA à la place du déployeur","Recueillir le consentement de chaque personne concernée"],a:[0,1,2],
 e:"La FRIA (art. 27) incombe à certains déployeurs. Le consentement n’est pas une exigence de l’AI Act (la base légale relève du RGPD)."},
{id:"m5c3b",c:"m5c3",t:"s",p:"Quelle exigence vise à ce qu’une personne puisse comprendre les limites du système, ne pas utiliser sa sortie, intervenir ou l’arrêter ?",
 o:["Le contrôle humain (art. 14)","La journalisation (art. 12)","La gouvernance des données (art. 10)","L’exactitude et la robustesse (art. 15)"],a:0,
 e:"L’art. 14 impose une conception permettant une supervision humaine effective, y compris contre le biais d’automatisation."},
{id:"m5c4a",c:"m5c4",t:"m",p:"Une entreprise déploie un outil haut risque d’aide aux décisions de promotion interne. Quelles obligations lui incombent ?",
 o:["Confier le contrôle humain à des personnes compétentes, formées et disposant de l’autorité nécessaire","Conserver les journaux sous son contrôle au moins six mois","Informer les représentants du personnel et les salariés concernés avant la mise en service","Réaliser l’évaluation de conformité et apposer le marquage CE","Rédiger la documentation technique de l’Annexe IV"],a:[0,1,2],
 e:"Art. 26 : contrôle humain, journaux (26(6)), information des travailleurs (26(7)). Conformité, marquage CE et documentation technique sont des obligations du fournisseur."},
{id:"m5c4b",c:"m5c4",t:"s",p:"Lequel de ces déployeurs doit réaliser une analyse d’impact sur les droits fondamentaux (art. 27) ?",
 o:["Une banque utilisant un système d’évaluation de la solvabilité de particuliers","Une entreprise industrielle utilisant un outil de tri de CV","Un gestionnaire de réseau électrique utilisant un système de gestion du réseau","Une PME utilisant un chatbot de support"],a:0,
 e:"L’art. 27 vise les organismes publics, les entités privées fournissant un service public et les déployeurs de systèmes de crédit (Annexe III 5(b)) ou d’assurance vie et santé (5(c)). Les infrastructures critiques (point 2) sont exclues."},
/* ---------- M6 ---------- */
{id:"m6c1a",c:"m6c1",t:"s",p:"Qui porte l’obligation de l’art. 50(1) de faire savoir aux personnes qu’elles interagissent avec une IA ?",
 o:["Le fournisseur, qui conçoit le système en ce sens, sauf si c’est évident","Le déployeur uniquement","L’utilisateur final","L’autorité nationale"],a:0,
 e:"L’art. 50(1) vise les fournisseurs de systèmes destinés à interagir avec des personnes. En pratique, le déployeur vérifie que l’outil acheté le permet et que la mention est visible."},
{id:"m6c1b",c:"m6c1",t:"s",p:"Un agent vocal IA appelle des patients pour fixer des rendez-vous. Laquelle de ces affirmations est exacte ?",
 o:["Les personnes doivent savoir qu’elles échangent avec une IA, sauf si c’est évident d’après le contexte","Ce système est interdit","Il est haut risque par nature","Aucune obligation, car l’échange est vocal"],a:0,
 e:"L’obligation d’information couvre toute interaction, écrite ou vocale. La prise de rendez-vous ne relève pas en soi de l’Annexe III."},
{id:"m6c2a",c:"m6c2",t:"s",p:"Votre service communication diffuse une vidéo dans laquelle le PDG, recréé par IA, prononce un discours qu’il n’a jamais filmé. Obligation ?",
 o:["Aucune, puisque c’est le PDG lui-même","Votre entreprise, en tant que déployeur, indique que le contenu a été généré ou manipulé","Seul le fournisseur de l’outil doit agir","Obtenir un marquage CE pour la vidéo"],a:1,
 e:"L’obligation de divulgation des hypertrucages pèse sur le déployeur (art. 50(4)). L’accord de la personne représentée ne la supprime pas."},
{id:"m6c2b",c:"m6c2",t:"m",p:"Quelles affirmations sur les hypertrucages et les contenus générés sont exactes ?",
 o:["La divulgation d’un hypertrucage incombe au déployeur","Des aménagements existent pour les œuvres manifestement artistiques ou satiriques","Le marquage lisible par machine des contenus générés incombe au fournisseur du système génératif","Les hypertrucages sont interdits par l’art. 5","Ces obligations ne s’appliqueront qu’en 2027"],a:[0,1,2],
 e:"Les hypertrucages ne sont pas interdits en tant que tels : ils doivent être signalés. L’art. 50 s’applique depuis le 2 août 2026."},
{id:"m6c3a",c:"m6c3",t:"s",p:"Un média publie un article d’actualité rédigé par IA, relu et validé par un journaliste qui en assume la responsabilité éditoriale. Une mention IA est-elle obligatoire au titre de l’art. 50(4) ?",
 o:["Oui, toujours","Non : la relecture humaine sous responsabilité éditoriale fait exception ; conservez la trace de cette relecture","Oui, sauf si le texte fait moins de 500 mots","Non, car les médias sont exclus de l’AI Act"],a:1,
 e:"L’exception repose sur la relecture humaine et la responsabilité éditoriale. Il faut pouvoir la prouver."},
{id:"m6c3b",c:"m6c3",t:"s",p:"Pour informer le public sur un sujet d’intérêt public, un service marketing publie sur son blog un texte généré par IA, sans aucune relecture. Il doit…",
 o:["Ne rien faire","Indiquer que le texte a été généré par IA","Réaliser une FRIA","Obtenir l’accord de l’autorité"],a:1,
 e:"Sans relecture humaine ni responsabilité éditoriale, le déployeur signale l’origine IA d’un texte publié pour informer le public sur des sujets d’intérêt public."},
{id:"m6c4a",c:"m6c4",t:"s",p:"Plafond d’amende pour un manquement aux obligations de l’art. 50 ?",
 o:["15 M€ ou 3 % du CA mondial","35 M€ ou 7 %","7,5 M€ ou 1 %","Aucune sanction prévue"],a:0,
 e:"Les obligations de transparence relèvent de l’art. 99(4)."},
{id:"m6c4b",c:"m6c4",t:"s",p:"Le délai jusqu’au 2 décembre 2026 prévu par l’Omnibus concerne…",
 o:["Toutes les obligations de l’art. 50","Uniquement le marquage lisible par machine (art. 50(2)) des systèmes génératifs mis sur le marché avant le 2 août 2026","L’information des personnes qui interagissent avec un chatbot","La signalisation des hypertrucages"],a:1,
 e:"Ce délai est strictement limité au marquage technique des systèmes génératifs déjà sur le marché (art. 111(4))."},
/* ---------- M7 ---------- */
{id:"m7c1a",c:"m7c1",t:"m",p:"Quelles sont les obligations de tout fournisseur de modèle d’IA à usage général (art. 53) ?",
 o:["Établir et tenir à jour la documentation technique du modèle","Informer les fournisseurs en aval qui intègrent le modèle","Mettre en place une politique de respect du droit d’auteur, y compris des réserves de droits","Publier un résumé suffisamment détaillé du contenu d’entraînement","Apposer un marquage CE sur le modèle","Réaliser une FRIA"],a:[0,1,2,3],
 e:"Ce sont les quatre obligations de base de l’art. 53. Marquage CE et FRIA relèvent du régime des systèmes haut risque."},
{id:"m7c1b",c:"m7c1",t:"s",p:"Un modèle diffusé sous licence libre et ouverte, poids publiés, sans risque systémique…",
 o:["Est totalement exclu du chapitre V","Est dispensé de certaines obligations de documentation, mais reste soumis à la politique de droit d’auteur et au résumé du contenu d’entraînement","Est présumé à risque systémique","Doit être retiré du marché"],a:1,
 e:"L’art. 53(2) écarte les obligations de documentation (points a et b) pour ces modèles, pas les autres. L’allègement ne joue pas en cas de risque systémique."},
{id:"m7c2a",c:"m7c2",t:"s",p:"Un modèle a été entraîné avec 3 × 10^25 FLOP de calcul cumulé. Conséquence ?",
 o:["Il est interdit","Il est présumé à risque systémique : obligations supplémentaires de l’art. 55","Il devient un système haut risque de l’Annexe III","Rien de plus que l’art. 53"],a:1,
 e:"Au-delà de 10^25 FLOP, le modèle est présumé à risque systémique (art. 51). La Commission peut ajuster ce seuil."},
{id:"m7c2b",c:"m7c2",t:"m",p:"Quelles obligations s’ajoutent pour un modèle à risque systémique (art. 55) ?",
 o:["Évaluer le modèle, y compris par des tests adverses","Évaluer et atténuer les risques systémiques","Suivre et signaler les incidents graves","Enregistrer chaque utilisateur final","Apposer un marquage CE"],a:[0,1,2],
 e:"L’art. 55 ajoute aussi un niveau adéquat de cybersécurité. L’enregistrement des utilisateurs et le marquage CE n’en font pas partie."},
{id:"m7c3a",c:"m7c3",t:"s",p:"Une entreprise construit, sur l’API d’un modèle GPAI, un assistant qu’elle commercialise sous sa marque auprès de cabinets RH pour présélectionner des candidats. Elle est…",
 o:["Fournisseur du modèle GPAI","Fournisseur d’un système d’IA haut risque (Annexe III, emploi), mais pas du modèle","Simple déployeur","Hors champ, car le modèle vient d’un tiers"],a:1,
 e:"Elle met un système sur le marché sous son nom : elle en est fournisseur, et l’usage visé est de l’Annexe III. Les obligations du chapitre V restent au fournisseur du modèle."},
{id:"m7c3b",c:"m7c3",t:"m",p:"Que doit vérifier une entreprise auprès du fournisseur du modèle qu’elle intègre ?",
 o:["La documentation remise aux intégrateurs","Sa politique de respect du droit d’auteur","Son adhésion au code de pratique GPAI","Les conditions d’utilisation de vos prompts et données pour l’entraînement","Le marquage CE du modèle","La FRIA du modèle"],a:[0,1,2,3],
 e:"Ces vérifications sécurisent votre propre conformité de fournisseur ou de déployeur. Marquage CE et FRIA ne s’appliquent pas à un modèle GPAI."},
{id:"m7c4a",c:"m7c4",t:"s",p:"Le code de pratique GPAI publié en juillet 2025…",
 o:["Est un outil volontaire qui permet aux fournisseurs de modèles de démontrer leur conformité","Est obligatoire pour toute entreprise utilisatrice","Remplace le chapitre V","Est une norme harmonisée donnant le marquage CE"],a:0,
 e:"Le code de pratique est un moyen de démontrer la conformité aux obligations du chapitre V ; il ne remplace pas le règlement."},
{id:"m7c4b",c:"m7c4",t:"s",p:"Depuis le 2 août 2026, qui peut infliger des amendes aux fournisseurs de modèles GPAI, et jusqu’à quel plafond ?",
 o:["La Commission, jusqu’à 15 M€ ou 3 % du CA mondial (art. 101)","L’autorité de protection des données, jusqu’à 4 %","La Commission, jusqu’à 35 M€ ou 7 %","Chaque État membre, jusqu’à 7,5 M€ ou 1 %"],a:0,
 e:"L’art. 101 confie ce pouvoir à la Commission (Bureau de l’IA)."},
/* ---------- M8 ---------- */
{id:"m8c1a",c:"m8c1",t:"s",p:"Un auditeur demande comment l’entreprise respecte l’art. 4. Meilleure réponse ?",
 o:["Présenter les mesures prises (formations différenciées, supports, présences, évaluations), adaptées aux connaissances des personnes et au contexte d’usage","Montrer un certificat individuel garantissant le niveau de chaque salarié","Expliquer que l’art. 4 a été supprimé par l’Omnibus","Expliquer qu’il ne vise que les fournisseurs"],a:0,
 e:"Depuis l’Omnibus, l’art. 4 est une obligation de moyens : il faut pouvoir montrer ce qui a été fait, sans garantir un niveau individuel."},
{id:"m8c1b",c:"m8c1",t:"m",p:"Quelles affirmations sur l’art. 4 réécrit sont exactes ?",
 o:["Il vise les fournisseurs et les déployeurs","Il couvre le personnel et les personnes qui utilisent les systèmes pour leur compte","Il n’impose de garantir aucun niveau précis pour une personne donnée","Il a un plafond d’amende spécifique à l’art. 99","Il ne s’applique qu’à partir de 2027"],a:[0,1,2],
 e:"L’art. 99 ne prévoit pas d’amende spécifique pour l’art. 4, mais un défaut de formation peut peser dans l’appréciation d’autres manquements. L’art. 4 est applicable depuis le 2 février 2025, dans sa rédaction actuelle depuis le 27 juillet 2026."},
{id:"m8c2a",c:"m8c2",t:"s",p:"Quelle séquence de gouvernance IA est la plus cohérente ?",
 o:["Inventaire, qualification, politique d’usage, achats, formation","Formation, achats, inventaire, qualification, politique d’usage","Qualification, achats, formation, inventaire, politique d’usage","Politique d’usage, formation, achats, qualification, inventaire"],a:0,
 e:"Sans inventaire, impossible de qualifier rôles et risques ; la qualification nourrit ensuite la politique, les achats et la formation."},
{id:"m8c2b",c:"m8c2",t:"m",p:"Quelles informations l’inventaire des systèmes d’IA doit-il décrire ?",
 o:["La finalité","Les données utilisées","Le fournisseur","Les utilisateurs et les décisions influencées","Le nombre de lignes de code"],a:[0,1,2,3],
 e:"Ces informations servent à qualifier le rôle et le niveau de risque de chaque système."},
{id:"m8c3a",c:"m8c3",t:"s",p:"Un commercial utilise un chatbot grand public non validé pour résumer des contrats clients confidentiels. Réponse de gouvernance la plus adaptée ?",
 o:["Une politique d’usage (outils autorisés, données interdites dans les prompts), une formation et une alternative validée","Un marquage CE","Une FRIA","Un mandataire"],a:0,
 e:"Ce risque très courant se traite par la politique d’usage et la formation, avec un outil autorisé pour éviter le contournement."},
{id:"m8c3b",c:"m8c3",t:"s",p:"Quel contrôle relève de la brique « Achats » de la gouvernance IA ?",
 o:["Un questionnaire fournisseur, des clauses contractuelles et une revue avant mise en service","La formation des salariés","L’inventaire","La mention IA sur le site web"],a:0,
 e:"Les achats sont le point de contrôle idéal : vérifier les fonctionnalités (par exemple l’absence de reconnaissance des émotions) avant que l’outil n’entre dans l’entreprise."},
{id:"m8c4a",c:"m8c4",t:"s",p:"Une « small mid-cap » (petite entreprise de taille intermédiaire) déploie une pratique interdite. Quelle règle de plafond s’applique depuis l’Omnibus ?",
 o:["Le plus élevé des deux montants : l’art. 99(6a) ne vise que les paragraphes 4 et 5","Le plus faible des deux montants","Aucune amende n’est possible","Un montant fixe de 1 % du CA"],a:0,
 e:"L’art. 99(6a) étend la règle du « plus faible » aux small mid-caps, mais pas pour les pratiques interdites (paragraphe 3)."},
{id:"m8c4b",c:"m8c4",t:"s",p:"Fournir des informations inexactes, incomplètes ou trompeuses à une autorité expose à un plafond de…",
 o:["7,5 M€ ou 1 % du CA mondial","15 M€ ou 3 %","35 M€ ou 7 %","4 % du CA comme le RGPD"],a:0,
 e:"Art. 99(5)."},
/* ---------- M9 ---------- */
{id:"m9c1a",c:"m9c1",t:"s",p:"Un assistant d’IA pour les RH traite des données de salariés. Quelle affirmation est exacte ?",
 o:["L’AI Act remplace le RGPD pour les systèmes d’IA","AI Act et RGPD s’appliquent cumulativement : l’AI Act régit le produit et son usage, le RGPD le traitement des données","Seul le RGPD s’applique, l’outil étant interne","Aucun des deux ne s’applique si l’éditeur est hors UE"],a:1,
 e:"Les deux régimes se cumulent dès qu’un système d’IA traite des données personnelles."},
{id:"m9c1b",c:"m9c1",t:"m",p:"Quels points relèvent du RGPD plutôt que de l’AI Act ?",
 o:["La base légale du traitement","La minimisation et la durée de conservation des données","L’information des personnes (RGPD art. 13 et 14)","Le marquage CE du système","La classification Annexe III"],a:[0,1,2],
 e:"Marquage CE et classification relèvent de l’AI Act. Les principes de traitement relèvent du RGPD."},
{id:"m9c2a",c:"m9c2",t:"s",p:"Un organisme public déploie un système haut risque traitant des données personnelles et a déjà réalisé une AIPD. Pour la FRIA…",
 o:["Elle devient inutile","Il peut faire renvoi à l’AIPD ou en reprendre les parties pertinentes, et compléter ce qui est propre à la FRIA","Le fournisseur la réalise à sa place","Elle doit être menée sans tenir compte de l’AIPD"],a:1,
 e:"L’art. 27(4) permet de s’appuyer sur l’AIPD pour les obligations déjà couvertes. La FRIA reste due pour le reste."},
{id:"m9c2b",c:"m9c2",t:"s",p:"Quand une AIPD (RGPD art. 35) est-elle notamment obligatoire ?",
 o:["Pour tout traitement de données, sans exception","Lorsque le traitement est susceptible d’engendrer un risque élevé, par exemple une évaluation systématique fondée sur un traitement automatisé","Jamais lorsque l’AI Act s’applique","Uniquement pour les organismes publics"],a:1,
 e:"L’art. 35 cite notamment l’évaluation systématique fondée sur un traitement automatisé, le traitement à grande échelle de données sensibles et la surveillance systématique."},
{id:"m9c3a",c:"m9c3",t:"s",p:"Un refus de crédit est décidé uniquement par un système d’IA, sans intervention humaine. Quels textes encadrent ce point ?",
 o:["Le RGPD (art. 22 sur la décision uniquement automatisée) et, côté AI Act, le contrôle humain (art. 14) et le droit à l’explication (art. 86)","Uniquement l’art. 50 de l’AI Act","Uniquement le droit de la consommation","Aucun texte"],a:0,
 e:"Les deux textes se complètent : droit de ne pas faire l’objet d’une décision uniquement automatisée, supervision humaine du système et explication de la décision."},
{id:"m9c3b",c:"m9c3",t:"s",p:"Auprès de qui une personne exerce-t-elle le droit à l’explication de l’art. 86 ?",
 o:["Le déployeur","Le fournisseur du système","L’autorité de surveillance du marché","La Commission"],a:0,
 e:"L’art. 86 permet d’obtenir du déployeur des explications sur le rôle du système et les principaux éléments de la décision."},
{id:"m9c4a",c:"m9c4",t:"s",p:"L’art. 4a introduit par l’Omnibus…",
 o:["Oblige à tester tous les systèmes contre les biais","Fournit une base juridique exceptionnelle, avec garanties, pour traiter des catégories particulières de données afin de détecter et corriger les biais, sans créer d’obligation","Interdit tout traitement de données sensibles par une IA","Supprime l’art. 22 du RGPD"],a:1,
 e:"Le texte précise expressément qu’il ne crée pas d’obligation de procéder à cette détection."},
{id:"m9c4b",c:"m9c4",t:"m",p:"Quelles affirmations sur l’art. 4a sont exactes ?",
 o:["Il remplace l’ancien art. 10(5)","Il couvre aussi les déployeurs de systèmes haut risque","Il impose de tester tous les systèmes contre les biais","Il autorise ce traitement sans garanties","Il écarte le RGPD pour les systèmes d’IA"],a:[0,1],
 e:"L’art. 4a élargit le champ de l’ancien art. 10(5), sous garanties, et ne crée aucune obligation de détection. Le RGPD continue de s’appliquer."},
/* ---------- M10 ---------- */
{id:"m10c1a",c:"m10c1",t:"s",p:"Quel est l’ordre de la méthode d’audit en cinq étapes ?",
 o:["Décrire, qualifier le rôle, qualifier le risque, lister les obligations datées, plan d’action 30/60/90 jours","Qualifier le risque, décrire, plan d’action, qualifier le rôle, lister","Lister les obligations, décrire, qualifier le rôle, plan d’action, qualifier le risque","Plan d’action, décrire, qualifier le risque, qualifier le rôle, lister"],a:0,
 e:"On ne qualifie bien que ce que l’on a décrit ; les obligations dépendent du rôle et du risque ; le plan d’action vient en dernier."},
{id:"m10c1b",c:"m10c1",t:"s",p:"À l’étape « qualifier le risque », quel test faut-il effectuer en premier ?",
 o:["Vérifier si l’usage relève d’une pratique interdite (art. 5)","Vérifier l’art. 50","Calculer l’amende maximale","Vérifier l’Annexe III"],a:0,

{id:"m10c2a",c:"m10c2",t:"m",p:"Un agent IA de prospection B2B, acheté à un éditeur, converse avec des prospects à partir de données d’un CRM et de pages web. Quels points traiter ?",
 o:["Faire savoir aux prospects qu’ils échangent avec une IA (art. 50)","La base légale RGPD de la prospection et le droit d’opposition","Des tests contre l’injection de prompt via les contenus externes","Un marquage CE","Une qualification haut risque Annexe III, domaine emploi"],a:[0,1,2],
 e:"La prospection commerciale ne relève pas de l’Annexe III. Les enjeux sont la transparence, le RGPD et la sécurité de l’agent."},
{id:"m10c2b",c:"m10c2",t:"s",p:"Quel contrôle limite le mieux le risque qu’un agent de prospection envoie des messages erronés ou détournés ?",
 o:["La validation humaine des envois et la journalisation des actions de l’agent","Un modèle plus grand","Un marquage CE","Une analyse d’impact sur les droits fondamentaux"],a:0,
 e:"La validation humaine et les journaux permettent de détecter et de corriger un détournement, par exemple par injection de prompt."},
{id:"m10c3a",c:"m10c3",t:"m",p:"Quels contrôles sont pertinents pour un assistant RAG interne sur documents clients ?",
 o:["L’héritage des droits d’accès documentaires","Le cloisonnement par client","La journalisation des requêtes et une durée de conservation définie","Une clause de non-réutilisation des données par le fournisseur","Un marquage CE obligatoire","La suppression de l’authentification pour fluidifier l’usage"],a:[0,1,2,3],
 e:"Le risque principal est la fuite d’information entre utilisateurs ou clients ; les contrôles d’accès au niveau de la récupération des documents sont centraux."},
{id:"m10c3b",c:"m10c3",t:"s",p:"Le RAG interne sert désormais à proposer l’octroi ou le refus de crédits à des particuliers. Conséquence ?",
 o:["Rien ne change","L’usage relève de l’Annexe III (solvabilité, score de crédit) : la qualification haut risque est à réexaminer, avec des obligations au 2 décembre 2027","Le système devient interdit","Seul l’art. 50 s’applique"],a:1,
 e:"Le changement d’usage change la qualification : refaites l’analyse à chaque nouvelle finalité (et examinez la bascule de l’art. 25)."},
{id:"m10c4a",c:"m10c4",t:"s",p:"En entretien : « Un chatbot client est-il toujours à haut risque ? » La meilleure réponse :",
 o:["Oui, toujours","Non : il relève en général de l’art. 50 ; il devient haut risque si son usage relève de l’Annexe III","Non, il n’est soumis à aucune règle","Oui, s’il utilise un modèle GPAI"],a:1,
 e:"C’est l’usage qui détermine le haut risque, pas la technologie."},
{id:"m10c4b",c:"m10c4",t:"s",p:"En entretien : « Par quoi commenceriez-vous chez nous ? » La réponse la plus solide :",
 o:["Attendre décembre 2027 pour lancer les travaux","Inventaire et qualification des systèmes, recherche des pratiques interdites (émotions), transparence des chatbots, politique d’usage","Acheter une certification","Interdire toute IA dans l’entreprise"],a:1,
 e:"Ces actions répondent aux obligations déjà applicables et préparent le haut risque."},
];
