CONTENT.en.EXAM = [
/* ---------- M1 ---------- */
{id:"m1c1a",c:"m1c1",t:"s",p:"A vendor sells premium-calculation software that applies a rate table written entirely by actuaries (age bands, fixed coefficients). It learns nothing from data. Under Art. 3(1), this software…",
 o:["Is an AI system, since it produces decisions","Is in principle not an AI system: it applies rules defined by humans, with no inference","Is a high-risk AI system under Annex III","Is a general-purpose AI model"],a:1,
 e:"Inference is the decisive criterion. Software that only executes rules written by humans is in principle not an AI system. If in doubt, rely on the Commission guidelines on the definition."},
{id:"m1c1b",c:"m1c1",t:"m",p:"Which elements are part of the definition of an AI system in Art. 3(1)?",
 o:["A machine-based system","Designed to operate with some level of autonomy","That infers, from the input it receives, how to generate outputs","That must use a neural network","That is sold under a paid licence"],a:[0,1,2],
 e:"Machine, autonomy and inference are part of the definition (with possible adaptiveness after deployment). No technique is imposed, and a system supplied free of charge is still covered."},
{id:"m1c2a",c:"m1c2",t:"s",p:"A company established in Singapore, with no presence in the EU, provides a scoring service to a bank in Lyon. The system runs in Singapore; only the scores are sent to and used in France. The AI Act…",
 o:["Does not apply, because the system is not hosted in the EU","Applies: it also covers non-EU providers whose system output is used in the EU","Applies to the bank, but never to the provider","Will only apply once an authorised representative is appointed"],a:1,
 e:"Art. 2 has extraterritorial reach: it covers providers and deployers established outside the EU where the output of the system is used in the Union."},
{id:"m1c2b",c:"m1c2",t:"s",p:"Which of these actors is NOT within the scope of the AI Act?",
 o:["A US provider placing a system on the EU market","A company established in Germany using an AI tool for its teams","A person using an AI assistant to plan their personal holidays","An importer established in Belgium"],a:2,
 e:"Purely personal, non-professional use by a natural person is excluded. The other actors are operators covered by Art. 2."},
{id:"m1c3a",c:"m1c3",t:"m",p:"Which statements about the risk-based approach are correct?",
 o:["Prohibited practices fall under Art. 5","Transparency obligations (chatbots, deep fakes) fall under Art. 50","A minimal-risk system has no specific obligation beyond Art. 4; voluntary codes of conduct are possible","General-purpose AI models are classified as high risk by default","High risk depends on the provider’s turnover"],a:[0,1,2],
 e:"The four levels are: prohibited (Art. 5), high risk (Art. 6 to 49), transparency (Art. 50), minimal. GPAI models have a separate regime (Chapter V), and classification depends on use, not on company size."},
{id:"m1c3b",c:"m1c3",t:"s",p:"A chatbot conducts pre-screening interviews with job applicants and scores their answers. The most accurate classification:",
 o:["Art. 50 only, since it is a chatbot","High risk (Annex III, employment) plus the Art. 50 transparency obligations","Minimal risk","Prohibited practice"],a:1,
 e:"Regimes can overlap: the use (selecting candidates) makes the system high risk, and interacting with people triggers Art. 50."},
{id:"m1c4a",c:"m1c4",t:"s",p:"A university lab develops a tumour-detection model solely for its research work, without placing it on the market. During this phase…",
 o:["It falls under the scientific research and development exclusion (Art. 2), to be interpreted strictly","It is high risk under Annex I from the first prototype","It must be CE-marked before any test","It is prohibited"],a:0,
 e:"Systems developed and put into service for the sole purpose of scientific research are excluded. The exclusion ends if the system is placed on the market or used outside that context; document the reason."},
{id:"m1c4b",c:"m1c4",t:"m",p:"Which uses are excluded from the scope of the AI Act?",
 o:["Use exclusively for military, defence or national security purposes","Purely personal, non-professional use by a natural person","Internal use by a company for its employees","Use by a public administration","A system made available free of charge"],a:[0,1],
 e:"Internal use is still professional use, a public administration is a deployer like any other, and the provider definition covers supply “whether for payment or free of charge”."},
/* ---------- M2 ---------- */
{id:"m2c1a",c:"m2c1",t:"m",p:"In October 2026, which obligations already apply to a company that deploys AI tools?",
 o:["The Art. 5 prohibitions","The Art. 4 AI literacy measures","Disclosing the deep fakes it publishes (Art. 50)","The Annex III high-risk deployer obligations (Art. 26)","The Annex I high-risk obligations"],a:[0,1,2],
 e:"Prohibitions and Art. 4 since 02/02/2025, Art. 50 since 02/08/2026. High risk is postponed to 02/12/2027 (Annex III) and 02/08/2028 (Annex I)."},
{id:"m2c1b",c:"m2c1",t:"s",p:"Since when has the ban on recognising employees’ emotions applied?",
 o:["1 August 2024","2 February 2025","2 August 2026","2 December 2026"],a:1,
 e:"All the original Art. 5 prohibitions have applied since 2 February 2025. 2 December 2026 only concerns the two prohibitions added by the Omnibus."},
{id:"m2c2a",c:"m2c2",t:"s",p:"A vendor has been selling an image generator since 2025. What is its position under Art. 50 on 22 October 2026?",
 o:["Art. 50 has applied since 2 August 2026, and it has until 2 December 2026 for machine-readable marking of generated content","Nothing applies before 2 December 2027","It is exempt because its system predates 2026","It must stop selling its tool"],a:0,
 e:"The Omnibus did not postpone Art. 50. It only granted generative systems placed on the market before 2 August 2026 a marking grace period until 2 December 2026."},
{id:"m2c2b",c:"m2c2",t:"s",p:"A colleague claims: “with the Omnibus, chatbot obligations are postponed to the end of 2027”. This is…",
 o:["Correct","Wrong: only high risk was postponed; Art. 50 has applied since 2 August 2026","Correct for SMEs only","Correct, except for deep fakes"],a:1,
 e:"The Omnibus postponement concerns the high-risk obligations. Chatbot transparency (Art. 50(1)) has applied since 2 August 2026."},
{id:"m2c3a",c:"m2c3",t:"s",p:"The IT department is building its roadmap: a CV-screening tool (Annex III) and AI software built into an industrial machine subject to third-party assessment (Annex I). Which application dates for the high-risk obligations should it use?",
 o:["02/12/2027 for CV screening; 02/08/2028 for the machine","02/08/2026 for both","02/08/2028 for CV screening; 02/12/2027 for the machine","02/08/2027 for both"],a:0,
 e:"After the Omnibus: Annex III on 2 December 2027 (instead of 2 August 2026), Annex I on 2 August 2028 (instead of 2 August 2027)."},
{id:"m2c3b",c:"m2c3",t:"s",p:"Why was high risk postponed, and what follows for a project?",
 o:["Notably because harmonised standards were late; the postponement gives time to prepare, not an exemption","High risk was deemed useless and will be abolished","SMEs are now exempt","A transposing directive must now be awaited"],a:0,
 e:"Delays in harmonised standards motivated the postponement. The obligations still apply at the new dates: keep preparing for compliance."},
{id:"m2c4a",c:"m2c4",t:"s",p:"A CV-screening tool used by a private company was put into service in 2026 and is not modified afterwards. Under Art. 111(2) as amended by the Omnibus…",
 o:["It must be brought into compliance by 2 December 2027 in any case","The high-risk requirements only apply to it if it later undergoes significant changes in its design","It is permanently exempt, even after a complete redesign","It must be withdrawn from the market"],a:1,
 e:"Systems placed on the market or put into service before the application date of Chapter III are only covered if their design changes significantly. Exception: systems intended for use by public authorities must comply by 2 August 2030 at the latest."},
{id:"m2c4b",c:"m2c4",t:"s",p:"A provider placed its general-purpose AI model on the market in March 2025. It must comply with Chapter V by…",
 o:["2 August 2025","2 August 2026","2 August 2027","2 December 2027"],a:2,
 e:"Art. 111(3): GPAI models placed on the market before 2 August 2025 have until 2 August 2027. Models placed on the market after that date are subject to Chapter V as soon as they are placed on the market."},
/* ---------- M3 ---------- */
{id:"m3c1a",c:"m3c1",t:"s",p:"A mutual insurer has an IT services firm develop an AI tool, then puts it into service for its own use under its own name. Who is the provider?",
 o:["The IT services firm alone, since it wrote the code","The insurer: it had the system developed and puts it into service under its own name","Nobody, because the tool is not sold","The cloud host"],a:1,
 e:"Art. 3(3) covers whoever develops a system, or has it developed, and places it on the market or puts it into service under its own name, for payment or free of charge. The insurer is also the deployer of the tool."},
{id:"m3c1b",c:"m3c1",t:"m",p:"An SME subscribes to an AI writing-assistant SaaS for its sales staff. Which statements are correct?",
 o:["It is a deployer","It must take AI literacy measures (Art. 4)","It becomes the provider of the underlying model","It is an importer if the vendor is American","It is out of scope, since it developed nothing"],a:[0,1],
 e:"Using a system under its authority in a professional capacity makes it a deployer, subject to Art. 4. The importer is the one placing a non-EU entity’s system on the EU market, not the one using it."},
{id:"m3c2a",c:"m3c2",t:"m",p:"Which of these acts turn a deployer into the provider of a high-risk system (Art. 25)?",
 o:["Putting its name or trademark on a high-risk system already on the market","Substantially modifying a high-risk system that remains high risk","Changing the purpose of a non-high-risk system so that it becomes high risk","Using the system in line with the instructions for use","Training its staff on the tool"],a:[0,1,2],
 e:"These are the three Art. 25 cases. Using the system according to the instructions and training users are exactly what is expected of a deployer."},
{id:"m3c2b",c:"m3c2",t:"s",p:"A school uses a general-purpose writing assistant and decides to use it to grade exam papers automatically. The most accurate analysis:",
 o:["No impact, the tool remains general-purpose","This change of purpose towards an Annex III use (evaluating learning outcomes) can make the school the provider of a high-risk system","The school becomes a distributor","Only the assistant’s vendor is responsible"],a:1,
 e:"Diverting the intended purpose towards an Annex III use (point 3, education) shifts the provider’s burden onto the user (Art. 25)."},
{id:"m3c3a",c:"m3c3",t:"s",p:"A company established in Paris places on the EU market an AI system bearing the name and trademark of a vendor established in Korea. It is…",
 o:["An importer","A distributor","An authorised representative","A deployer"],a:0,
 e:"The importer is established in the EU and places on the market a system bearing the name of an entity established outside the EU."},
{id:"m3c3b",c:"m3c3",t:"s",p:"A provider established in Canada appoints an entity established in the EU to represent it before the authorities. That entity is…",
 o:["An importer","A distributor","An authorised representative","A provider"],a:2,
 e:"The authorised representative acts in the EU on behalf of a provider established outside the EU. A distributor makes a system available without being its provider or importer."},
{id:"m3c4a",c:"m3c4",t:"s",p:"Since the Omnibus, failing to meet the obligations of Art. 25(2) and (4) (cooperation between providers, written agreements with third parties supplying components) falls under…",
 o:["The Art. 99(4) ceiling: €15m or 3% of worldwide turnover","The Art. 99(3) ceiling: €35m or 7%","The Art. 99(5) ceiling: €7.5m or 1%","No penalty"],a:0,
 e:"The Omnibus added a point to Art. 99(4) covering the obligations of Art. 25(2) and (4)."},
{id:"m3c4b",c:"m3c4",t:"m",p:"Which clauses should you prioritise in the contract with the provider of a high-risk system you deploy?",
 o:["Delivery of the documentation and instructions for use","Compliance support and the necessary technical access","Notification of changes to the system","Transfer to the deployer of all the provider’s legal obligations","Disabling logging to cut costs"],a:[0,1,2],
 e:"A contract does not change the roles defined by the Regulation: it organises information and cooperation. Logging is a requirement (Art. 12 and 26(6))."},
/* ---------- M4 ---------- */
{id:"m4c1a",c:"m4c1",t:"m",p:"Which of these practices are prohibited by Art. 5?",
 o:["Social scoring leading to unjustified or disproportionate detrimental treatment","Assessing the risk that a person will commit an offence based solely on profiling","Biometric categorisation inferring sexual orientation","A product recommendation engine on a retail website","A CV-screening tool"],a:[0,1,2],
 e:"The first three are listed in Art. 5. CV screening is high risk (Annex III), not prohibited; product recommendation is usually minimal risk."},
{id:"m4c1b",c:"m4c1",t:"s",p:"A gaming app aimed at children uses techniques designed to exploit their young age to push them into purchases, causing them significant harm. This is…",
 o:["A prohibited practice (exploitation of vulnerabilities)","A high-risk system","A mere transparency obligation","Minimal risk"],a:0,
 e:"Art. 5 prohibits exploiting vulnerabilities due to age, disability or a social or economic situation where this materially distorts behaviour and causes significant harm."},
{id:"m4c2a",c:"m4c2",t:"s",p:"A university wants to analyse students’ emotions by webcam during online classes to measure their attention. This is…",
 o:["Allowed with the students’ consent","Prohibited: emotion recognition in an education institution, except for medical or safety reasons","High risk under Annex III, allowed under conditions","Subject only to the Art. 50 disclosure"],a:1,
 e:"The prohibition only allows exceptions for medical or safety reasons. The text provides no consent-based exception."},
{id:"m4c2b",c:"m4c2",t:"s",p:"The vendor of your call-centre software offers an “analytics” option that assesses agents’ mood from their voice. What should you do?",
 o:["Enable it after informing staff (Art. 50)","Refuse or disable the feature: it is a prohibited practice in the workplace","Enable it after a fundamental rights impact assessment (FRIA)","Enable it if the recordings are anonymised"],a:1,
 e:"Recognising employees’ emotions has been prohibited since 2 February 2025, except for medical or safety reasons. Always check the “analytics” options of purchased tools."},
{id:"m4c3a",c:"m4c3",t:"s",p:"A large company with €2bn worldwide annual turnover deploys a prohibited practice. What is the theoretical maximum fine?",
 o:["€35m","€60m","€140m","€20m"],a:2,
 e:"Art. 99(3): €35m or 7% of worldwide turnover, whichever is higher. 7% of €2bn = €140m, which is more than €35m."},
{id:"m4c3b",c:"m4c3",t:"s",p:"For a large company, how does the “€35m or 7% of worldwide turnover” ceiling apply?",
 o:["The higher of the two amounts applies","The lower of the two applies","The average of the two applies","It is always €35m"],a:0,
 e:"The higher amount applies, except for SMEs and start-ups, for which the lower one applies."},
{id:"m4c4a",c:"m4c4",t:"s",p:"From what date is an AI system designed to generate non-consensual intimate images of real people (“nudification”) prohibited?",
 o:["2 February 2025","27 July 2026","2 August 2026","2 December 2026"],a:3,
 e:"This is one of the two Omnibus additions to Art. 5, together with child sexual abuse material, applicable from 2 December 2026."},
{id:"m4c4b",c:"m4c4",t:"m",p:"Which statements about the prohibitions are correct?",
 o:["Building a facial recognition database through untargeted scraping of images from the internet is prohibited","Real-time remote biometric identification in public spaces for law enforcement is prohibited, subject to strict exceptions","The prohibitions only target providers, not deployers","A prohibited practice becomes lawful if an impact assessment is carried out"],a:[0,1],
 e:"The prohibitions apply to all operators, including deployers. No impact assessment can lift a prohibition."},
/* ---------- M5 ---------- */
{id:"m5c1a",c:"m5c1",t:"m",p:"Which of these systems fall under Annex III?",
 o:["Credit scoring of individuals","Monitoring exams in an education institution","Triage of emergency calls","An email spam filter","A film recommendation engine"],a:[0,1,2],
 e:"Credit and emergency-call triage fall under essential services (point 5), exam monitoring under education (point 3). The last two are not listed in Annex III."},
{id:"m5c1b",c:"m5c1",t:"s",p:"AI diagnostic software that is a component of a medical device subject to third-party conformity assessment is high risk through which route?",
 o:["Art. 6(1) and Annex I, applying from 2 August 2028","Art. 6(2) and Annex III, applying from 2 December 2027","Art. 50 only","Art. 5"],a:0,
 e:"Products and safety components covered by the Annex I harmonisation legislation and subject to a third party fall under Art. 6(1)."},
{id:"m5c2a",c:"m5c2",t:"s",p:"An AI tool (employment area) only reformats incoming CVs into a standard template, without scoring or ranking them and without profiling candidates. The provider may…",
 o:["Consider the Art. 6(3) derogation (narrow procedural task), documenting its assessment and registering the system","Ignore the AI Act, as employment is not concerned","Invoke the same derogation for a tool that ranks candidates through profiling","Request prior authorisation from the Commission"],a:0,
 e:"The derogation covers, among others, narrow procedural tasks. The provider documents its assessment before placing the system on the market; the registration obligation was kept by the Omnibus."},
{id:"m5c2b",c:"m5c2",t:"s",p:"An Annex III system builds personality profiles of candidates to prepare the recruiter’s work. Can it benefit from the Art. 6(3) derogation?",
 o:["Yes, since it is a preparatory task","No: a system that profiles natural persons is always considered high risk","Yes, if the recruiter validates the final decision","Yes, if the provider is an SME"],a:1,
 e:"Profiling of natural persons rules out the derogation, however preparatory the task."},
{id:"m5c3a",c:"m5c3",t:"m",p:"Which of these are obligations of the provider of a high-risk system?",
 o:["A risk management system throughout the lifecycle (Art. 9)","A quality management system (Art. 17)","The conformity assessment, the EU declaration of conformity and the CE marking","Carrying out the FRIA instead of the deployer","Obtaining the consent of each person concerned"],a:[0,1,2],
 e:"The FRIA (Art. 27) is for certain deployers. Consent is not an AI Act requirement (the legal basis is a GDPR matter)."},
{id:"m5c3b",c:"m5c3",t:"s",p:"Which requirement aims to ensure that a person can understand the system’s limits, disregard its output, intervene or stop it?",
 o:["Human oversight (Art. 14)","Record-keeping (Art. 12)","Data governance (Art. 10)","Accuracy and robustness (Art. 15)"],a:0,
 e:"Art. 14 requires a design that allows effective human oversight, including against automation bias."},

{id:"m9c4b",c:"m9c4",t:"m",p:"Which statements about Art. 4a are correct?",

const modOfConcept = cid => cid.replace(/c\d+$/,"");
const perConcept = () => S.profile==="cadre" ? 2 : 1;
function examConcepts(){ const p=path(); return CONCEPTS.filter(c=>p.includes(modOfConcept(c.id)) && c.lvl<=lvlMax()); }
const examQ = id => EXAM.find(q=>q.id===id);
function examSize(){ return examConcepts().reduce((a,c)=>a+Math.min(perConcept(), EXAM.filter(q=>q.c===c.id).length),0); }
const examMinutes = n => Math.round(n*EXAM_MIN_PER_Q);
const examReady = () => path().length>0 && path().every(passed);
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const answerSet = q => Array.isArray(q.a) ? q.a : [q.a];
const sameSet = (x,y) => x.length===y.length && x.every(v=>y.includes(v));
function attempts(){ return ((S.exam&&S.exam.attempts)||[]).filter(a=>a.profile===S.profile); }
function bestAttempt(){ const l=attempts(); if(!l.length) return null; return l.reduce((b,a)=> (a.pct>b.pct || (a.pct===b.pct && a.ts>b.ts)) ? a : b); }
const fmtDate = ts => new Date(ts).toLocaleDateString(S.lang==="fr"?"fr-FR":"en-GB",{day:"numeric",month:"long",year:"numeric"});
const fmtClock = ms => { const s=Math.max(0,Math.ceil(ms/1000)); return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`; };

function startExam(){
  const ids=[];
  examConcepts().forEach(c=>{ const v=shuffle(EXAM.filter(q=>q.c===c.id)); ids.push(...v.slice(0,perConcept()).map(q=>q.id)); });
  const order=shuffle(ids), ord={};
  order.forEach(id=>{ ord[id]=shuffle(examQ(id).o.map((_,i)=>i)); });
  const now=Date.now();
  S.run={ids:order, ord, ans:{}, flags:[], i:0, start:now, end:now+examMinutes(order.length)*60000, profile:S.profile};
  save(); go({name:"exam"});
}
function finishExam(auto){
  const r=S.run; if(!r) return;
  if(exTimer){ clearInterval(exTimer); exTimer=null; }
  let score=0; const byC={}, byM={};
  r.ids.forEach(id=>{
    const q=examQ(id); if(!q) return;
    const ok=sameSet(r.ans[id]||[], answerSet(q)); if(ok) score++;
    const m=modOfConcept(q.c);
    (byC[q.c]=byC[q.c]||[0,0]); byC[q.c][1]++; if(ok) byC[q.c][0]++;
    (byM[m]=byM[m]||[0,0]); byM[m][1]++; if(ok) byM[m][0]++;
  });
  const n=r.ids.length, pct=Math.round(score/n*100), ok=score/n>=EXAM_PASS;
  const att={ts:Date.now(), start:r.start, pct, score, n, passed:ok, dist:ok && score/n>=EXAM_DIST, profile:r.profile, byC, byM, ver:CONTENT_VER, auto:!!auto};
  S.exam=S.exam||{attempts:[]}; S.exam.attempts=[...(S.exam.attempts||[]), att];
  S.last={ids:r.ids, ord:r.ord, ans:r.ans, ts:att.ts};
  S.run=null; save();
  view={name:"examResult", auto:!!auto};
}

  if(!q){ finishExam(false); return render(); }

  app.innerHTML=`<div class="stack-lg">
   <div class="ex-head">
     <div class="stack" style="gap:2px"><p class="eyebrow">${X.eyebrow} · ${X.q(i+1,n)}</p><span class="hint" id="ex-ans">${X.answered(answered,n)}</span></div>
     <div class="row"><span class="hint">${X.timeLeft}</span><span class="timer" id="ex-timer" role="timer" aria-live="off">${fmtClock(r.end-Date.now())}</span></div>

     <div class="opts">${r.ord[id].map(j=>`<label class="opt"><input type="${multi?"checkbox":"radio"}" name="ex" id="ex${j}" value="${j}" ${sel.includes(j)?"checked":""}> <span>${q.o[j]}</span></label>`).join("")}</div>
     <div class="row" style="justify-content:space-between">
       <div class="row"><button class="btn quiet" id="prev" ${i===0?"disabled":""}>${X.prev}</button>${i<n-1?`<button class="btn" id="next">${X.next}</button>`:`<button class="btn" id="sub2">${X.submit}</button>`}</div>
       <button class="btn quiet" id="flag" aria-pressed="${flagged}">${flagged?X.unflag:X.flag}</button>
     </div>
    </div>
    <aside class="panel stack ex-side">
     <h3 style="font-size:1rem">${X.nav}</h3>
     <div class="ex-nav">${r.ids.map((x,k)=>`<button data-k="${k}" class="${(r.ans[x]||[]).length?"ans":""} ${k===i?"cur":""} ${r.flags.includes(x)?"flag":""}" aria-label="${X.q(k+1,n)}${(r.ans[x]||[]).length?"":" · "+X.noAns}${r.flags.includes(x)?" · "+X.flagged:""}" ${k===i?'aria-current="true"':""}>${k+1}</button>`).join("")}</div>
     <p class="hint">${X.legend}</p>
     <button class="btn ghost" id="sub">${X.submit}</button>
     <div id="ex-confirm"></div>
    </aside>
   </div>
  </div>`;
  const upd=()=>{ const v=[...app.querySelectorAll("input[name=ex]:checked")].map(x=>+x.value); if(v.length) r.ans[id]=v; else delete r.ans[id]; save();
    const a=r.ids.filter(x=>(r.ans[x]||[]).length).length; document.getElementById("ex-ans").textContent=X.answered(a,n);
    const b=app.querySelector(`.ex-nav [data-k="${i}"]`); if(b) b.classList.toggle("ans",v.length>0); };
  app.querySelectorAll("input[name=ex]").forEach(x=>x.onchange=upd);
  const to=k=>{ r.i=k; save(); renderExam(); window.scrollTo({top:0}); };
  document.getElementById("prev").onclick=()=>to(i-1);
  const nx=document.getElementById("next"); if(nx) nx.onclick=()=>to(i+1);
  document.getElementById("flag").onclick=()=>{ r.flags = flagged ? r.flags.filter(x=>x!==id) : [...r.flags,id]; save(); renderExam(); };
  app.querySelectorAll(".ex-nav [data-k]").forEach(b=>b.onclick=()=>to(+b.dataset.k));
  const ask=()=>{ const left=n-r.ids.filter(x=>(r.ans[x]||[]).length).length, box=document.getElementById("ex-confirm");
    box.innerHTML=`<div class="notice stack" style="gap:10px"><span>${X.confirm(left)}</span><div class="row"><button class="btn" id="yes">${X.confirmYes}</button><button class="btn quiet" id="no">${X.cancel}</button></div></div>`;
    document.getElementById("yes").onclick=()=>{ finishExam(false); render(); window.scrollTo({top:0}); };
    document.getElementById("no").onclick=()=>{ box.innerHTML=""; };
    document.getElementById("yes").focus(); };
  document.getElementById("sub").onclick=ask;
  const s2=document.getElementById("sub2"); if(s2) s2.onclick=()=>{ ask(); document.getElementById("ex-confirm").scrollIntoView({block:"center"}); };
  if(exTimer) clearInterval(exTimer);
  exTimer=setInterval(()=>{
    const left=r.end-Date.now(), t=document.getElementById("ex-timer");
    if(!t || !S.run){ clearInterval(exTimer); exTimer=null; return; }
    t.textContent=fmtClock(left); t.classList.toggle("low", left<5*60000);
    if(left<=0){ finishExam(true); render(); window.scrollTo({top:0}); }
  },1000);
}

/* ---------- Statut des compétences ---------- */
function conceptStatus(c, att){
  const m=modOfConcept(c.id);
  if(att && att.byC[c.id]){ const [ok,n]=att.byC[c.id]; return ok===n?"ok":ok>0?"part":"ko"; }
  return passed(m) ? "quiz" : "none";
}

function fnv(s){ let h=0x811c9dc5; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return h.toString(36).toUpperCase().padStart(7,"0").slice(-7); }
function reportData(){
  const att=bestAttempt(), pass=attempts().filter(a=>a.passed), passAtt=pass.length?pass.reduce((b,a)=>a.pct>b.pct||(a.pct===b.pct&&a.ts>b.ts)?a:b):null;
  const use=passAtt||att;
  const cs=examConcepts().map(c=>({c, st:conceptStatus(c,use)}));
  const name=(S.learner||"").trim();
  const ref = use ? `AIA-${new Date(use.ts).getFullYear()}-${fnv([name,S.profile,use.ts,use.pct].join("|"))}` : "—";
  return {att:use, passAtt, cs, name, ref, n:attempts().length};
}

   <div id="rp-doc">${reportHTML(d)}</div>
  </div>`;
  const nm=document.getElementById("rp-name"); let t=null;
  nm.oninput=()=>{ S.learner=nm.value; clearTimeout(t); t=setTimeout(()=>{ save(); document.getElementById("rp-doc").innerHTML=reportHTML(reportData()); },300); };
  const p=document.getElementById("rp-print"); if(p) p.onclick=()=>{ S.learner=nm.value; save(); document.getElementById("rp-doc").innerHTML=reportHTML(reportData()); window.print(); };
  document.getElementById("rp-pdf").onclick=()=>{ S.learner=nm.value; save(); const msg=document.getElementById("rp-msg");
    try{ savePDF(reportData(), msg); }catch(e){ msg.textContent=R.pdfErr; } };
  document.getElementById("rp-md").onclick=()=>{ const md=reportMarkdown(reportData()), msg=document.getElementById("rp-msg");
    const show=()=>{ msg.innerHTML=`<textarea readonly id="rp-mdbox" style="min-height:200px;margin-top:8px">${esc(md)}</textarea>`; const b=document.getElementById("rp-mdbox"); b.focus(); b.select(); };
    try{ navigator.clipboard.writeText(md).then(()=>msg.textContent=R.copied, show); }catch(e){ show(); } };
  const ex=document.getElementById("rp-exam"); if(ex) ex.onclick=()=>go({name:"examIntro"});
}

function examPanel(){
  const X=L.ex, n=examSize(), ready=examReady(), b=bestAttempt(), done=path().filter(passed).length;

      <div class="row" style="gap:6px">${b?`<span class="chip ${b.passed?"ok":""}">${X.best(b.pct)}${b.passed?" · "+(b.dist?L.rp.cMention.dist:L.rp.cMention.pass):""}</span><span class="chip">${X.attempts(attempts().length)}</span>`:""}
      ${!ready?`<span class="chip">${X.lockedShort(done,path().length)}</span>`:""}${S.run?`<span class="chip acq">${X.inProgress}</span>`:""}</div></div>
    <div class="row">${S.run?`<button class="btn" data-x="exam">${X.resume}</button>`:`<button class="btn ${ready?"":"ghost"}" data-x="examIntro">${ready?X.open:X.see}</button>`}

}

/* ===================== EXPORT PDF DU RELEVÉ =====================
   Générateur PDF vectoriel minimal, sans bibliothèque : polices standard PDF
   (Helvetica, Times) en WinAnsiEncoding. Les largeurs de texte sont mesurées
   avec Arial / Times New Roman, dont les métriques sont compatibles.
   Fonctionne hors ligne, y compris sur iPhone où window.print() n'est pas fiable. */
const PDF_W = 595.28, PDF_H = 841.89;
const PDF_FONTS = {R:"Helvetica", B:"Helvetica-Bold", T:"Times-Roman", I:"Times-Italic"};
const PDF_CSSF = {R:'Helvetica, Arial, "Liberation Sans", sans-serif', B:'bold 100px Helvetica, Arial, "Liberation Sans", sans-serif', T:'"Times New Roman", Times, "Liberation Serif", serif', I:'italic 100px "Times New Roman", Times, "Liberation Serif", serif'};
const WINANSI = {"€":0x80,"‚":0x82,"ƒ":0x83,"„":0x84,"…":0x85,"†":0x86,"‡":0x87,"ˆ":0x88,"‰":0x89,"Š":0x8A,"‹":0x8B,"Œ":0x8C,"Ž":0x8E,"‘":0x91,"’":0x92,"“":0x93,"”":0x94,"•":0x95,"–":0x96,"—":0x97,"˜":0x98,"™":0x99,"š":0x9A,"›":0x9B,"œ":0x9C,"ž":0x9E,"Ÿ":0x9F};
const PDF_SUBST = {"\u202F":"\u00A0","\u2009":" ","\u2011":"-","≥":">=","≤":"<=","→":"->","←":"<-","✓":"v","×":"\u00D7"};
let pdfCtx=null; const pdfWCache={};
function pdfEnc(s){
  let o=""; for(const ch of String(s)){ const c=PDF_SUBST[ch]!==undefined?PDF_SUBST[ch]:ch;
    for(const k of c){ const code=k.codePointAt(0);
      if(WINANSI[k]) o+=String.fromCharCode(WINANSI[k]);
      else if(code<0x80 || (code>=0xA0 && code<=0xFF)) o+=k;
      else o+="?"; } }
  return o;
}
const pdfEsc = s => pdfEnc(s).replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)").replace(/[\r\n]/g," ");
function pdfWidth(s, f, size, tc){
  s=String(s);
  if(!pdfCtx){ try{ pdfCtx=document.createElement("canvas").getContext("2d"); }catch(e){ pdfCtx=null; } }
  const key=f+"|"+s; let w=pdfWCache[key];
  if(w===undefined){
    if(pdfCtx){ const css=PDF_CSSF[f]; pdfCtx.font = css.includes("100px") ? css : "100px "+css; w=pdfCtx.measureText(s).width/100; }
    else w=s.length*0.5;
    pdfWCache[key]=w;
  }
  return w*size + (tc||0)*[...s].length;
}
function pdfWrap(s, f, size, maxW){
  const words=String(s).split(/\s+/).filter(Boolean), lines=[]; let cur="";
  words.forEach(w=>{ const t=cur?cur+" "+w:w; if(pdfWidth(t,f,size)<=maxW || !cur) cur=t; else { lines.push(cur); cur=w; } });
  if(cur) lines.push(cur); return lines.length?lines:[""];
}
const hex2rgb = h => { h=h.replace("#",""); return [0,2,4].map(i=>(parseInt(h.slice(i,i+2),16)/255).toFixed(3)).join(" "); };

class PdfDoc{
  constructor(){ this.pages=[]; this.newPage(); }
  newPage(){ this.cur={ops:[],links:[]}; this.pages.push(this.cur); return this; }
  op(s){ this.cur.ops.push(s); }
  text(x,y,s,o={}){
    const f=o.f||"R", size=o.size||10, tc=o.tc||0; let w=pdfWidth(s,f,size,tc);
    if(o.align==="center") x-=w/2; else if(o.align==="right") x-=w;
    this.op(`BT /${f} ${size} Tf ${hex2rgb(o.color||"#1d1d1f")} rg ${tc?tc+" Tc ":""}${x.toFixed(2)} ${y.toFixed(2)} Td (${pdfEsc(s)}) Tj${tc?" 0 Tc":""} ET`);
    return w;
  }
  para(x,y,s,maxW,o={}){
    const lh=o.lh||(o.size||10)*1.35, lines=pdfWrap(s,o.f||"R",o.size||10,maxW);
    lines.forEach((l,i)=>this.text(o.align==="center"?x+maxW/2:x, y-i*lh, l, o));
    return lines.length*lh;
  }
  line(x1,y1,x2,y2,color,w){ this.op(`${hex2rgb(color)} RG ${w||0.6} w ${x1.toFixed(2)} ${y1.toFixed(2)} m ${x2.toFixed(2)} ${y2.toFixed(2)} l S`); }
  rrect(x,y,w,h,r,o={}){
    const k=0.5523*r, p=[`${(x+r).toFixed(2)} ${y.toFixed(2)} m`,`${(x+w-r).toFixed(2)} ${y.toFixed(2)} l`,`${(x+w-r+k).toFixed(2)} ${y.toFixed(2)} ${(x+w).toFixed(2)} ${(y+r-k).toFixed(2)} ${(x+w).toFixed(2)} ${(y+r).toFixed(2)} c`,
      `${(x+w).toFixed(2)} ${(y+h-r).toFixed(2)} l`,`${(x+w).toFixed(2)} ${(y+h-r+k).toFixed(2)} ${(x+w-r+k).toFixed(2)} ${(y+h).toFixed(2)} ${(x+w-r).toFixed(2)} ${(y+h).toFixed(2)} c`,
      `${(x+r).toFixed(2)} ${(y+h).toFixed(2)} l`,`${(x+r-k).toFixed(2)} ${(y+h).toFixed(2)} ${x.toFixed(2)} ${(y+h-r+k).toFixed(2)} ${x.toFixed(2)} ${(y+h-r).toFixed(2)} c`,
      `${x.toFixed(2)} ${(y+r).toFixed(2)} l`,`${x.toFixed(2)} ${(y+r-k).toFixed(2)} ${(x+r-k).toFixed(2)} ${y.toFixed(2)} ${(x+r).toFixed(2)} ${y.toFixed(2)} c h`].join(" ");
    const paint = o.fill&&o.stroke?"B":o.fill?"f":"S";
    this.op(`${o.fill?hex2rgb(o.fill)+" rg ":""}${o.stroke?hex2rgb(o.stroke)+" RG "+(o.w||0.6)+" w ":""}${p} ${paint}`);
  }
  circle(cx,cy,r,color,w){ this.rrect(cx-r,cy-r,2*r,2*r,r,{stroke:color,w}); }
  arcText(cx,cy,r,s,o={}){
    const f=o.f||"B", size=o.size||7, tc=o.tc||0; let a=o.start!==undefined?o.start:Math.PI;
    for(const ch of s){ const cw=pdfWidth(ch,f,size)+tc, mid=a-(cw/2)/r, phi=mid-Math.PI/2;
      const c=Math.cos(phi), sn=Math.sin(phi), px=cx+r*Math.cos(mid)-c*cw/2+tc/2*c, py=cy+r*Math.sin(mid)-sn*cw/2+tc/2*sn;
      this.op(`BT /${f} ${size} Tf ${hex2rgb(o.color||"#8a6d2b")} rg ${c.toFixed(4)} ${sn.toFixed(4)} ${(-sn).toFixed(4)} ${c.toFixed(4)} ${px.toFixed(2)} ${py.toFixed(2)} Tm (${pdfEsc(ch)}) Tj ET`);
      a-=cw/r; }
  }
  link(x,y,w,h,url){ this.cur.links.push({x,y,w,h,url}); }
  output(meta){
    const objs=[]; const add=s=>{ objs.push(s); return objs.length; };
    const fontIds={}; Object.entries(PDF_FONTS).forEach(([k,n])=>{ fontIds[k]=add(`<< /Type /Font /Subtype /Type1 /BaseFont /${n} /Encoding /WinAnsiEncoding >>`); });
    const fontRes=Object.entries(fontIds).map(([k,id])=>`/${k} ${id} 0 R`).join(" ");
    const pagesId=objs.length+1+this.pages.length*0; // réservé plus bas
    const pageIds=[], kids=[];
    const pagesPlaceholder=add("PAGES");
    this.pages.forEach(pg=>{
      const stream=pg.ops.join("\n");
      const cId=add(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
      const annots=pg.links.map(l=>add(`<< /Type /Annot /Subtype /Link /Rect [${l.x.toFixed(2)} ${l.y.toFixed(2)} ${(l.x+l.w).toFixed(2)} ${(l.y+l.h).toFixed(2)}] /Border [0 0 0] /A << /S /URI /URI (${pdfEsc(l.url)}) >> >>`));
      const pId=add(`<< /Type /Page /Parent ${pagesPlaceholder} 0 R /MediaBox [0 0 ${PDF_W} ${PDF_H}] /Resources << /Font << ${fontRes} >> >> /Contents ${cId} 0 R${annots.length?` /Annots [${annots.map(a=>a+" 0 R").join(" ")}]`:""} >>`);
      kids.push(`${pId} 0 R`); pageIds.push(pId);
    });
    objs[pagesPlaceholder-1]=`<< /Type /Pages /Kids [${kids.join(" ")}] /Count ${kids.length} >>`;
    const u16=s=>{ let h="FEFF"; for(const ch of String(s)){ const c=ch.codePointAt(0); if(c>0xFFFF){ const v=c-0x10000; h+=(0xD800+(v>>10)).toString(16).padStart(4,"0")+(0xDC00+(v&0x3FF)).toString(16).padStart(4,"0"); } else h+=c.toString(16).padStart(4,"0"); } return `<${h.toUpperCase()}>`; };
    const d=new Date(), pad=n=>String(n).padStart(2,"0");
    const info=add(`<< /Title ${u16(meta.title)} /Author ${u16(meta.author)} /Creator ${u16(meta.creator)} /Producer ${u16(meta.creator)} /CreationDate (D:${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}) >>`);
    const cat=add(`<< /Type /Catalog /Pages ${pagesPlaceholder} 0 R /Lang ${u16(meta.lang)} >>`);
    let out="%PDF-1.4\n%\u00E2\u00E3\u00CF\u00D3\n"; const off=[];
    objs.forEach((o,i)=>{ off.push(out.length); out+=`${i+1} 0 obj\n${o}\nendobj\n`; });
    const xref=out.length;
    out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+off.map(n=>String(n).padStart(10,"0")+" 00000 n \n").join("");
    out+=`trailer\n<< /Size ${objs.length+1} /Root ${cat} 0 R /Info ${info} 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
    const bytes=new Uint8Array(out.length); for(let i=0;i<out.length;i++) bytes[i]=out.charCodeAt(i)&0xFF;
    return bytes;
  }
}

/* ---------- Mise en page de l'attestation et du relevé ---------- */
function reportPDF(d){
  const R=L.rp, X=L.ex, prof=PROFILES[S.profile].label, a=d.att, acq=d.cs.filter(x=>x.st==="ok").length;
  const GOLD="#8a6d2b", GOLD_L="#c8b27a", GOLD_XL="#e9dfc4", INK="#1d1d1f", MUT="#6e6e73", LINE="#d2d2d7", BLUE="#0066cc";
  const ST={ok:["#e9f6ec","#1d6b31"],part:["#fff3d6","#7a5200"],ko:["#fdecee","#b0001a"],quiz:["#e8f1fc","#0058b0"],none:["#f0f0f3","#6e6e73"]};
  const doc=new PdfDoc(); const M=48, CW=PDF_W-2*M;
  const pill=(x,y,label,kind)=>{ const [bg,fg]=ST[kind], w=pdfWidth(label,"B",7.5)+12; doc.rrect(x,y-3.2,w,12,6,{fill:bg}); doc.text(x+6,y,label,{f:"B",size:7.5,color:fg}); return w; };

  /* Page 1 : attestation (si examen réussi) */
  if(d.passAtt){
    const p=d.passAtt, cx=PDF_W/2;
    doc.rrect(30,30,PDF_W-60,PDF_H-60,12,{stroke:GOLD_L,w:1});
    doc.rrect(36,36,PDF_W-72,PDF_H-72,9,{stroke:GOLD_XL,w:0.8});
    let y=PDF_H-150;
    doc.text(cx,y,R.cKicker.toUpperCase(),{f:"B",size:8.5,color:GOLD,align:"center",tc:1.6});
    y-=52; doc.text(cx,y,R.cTitle,{f:"T",size:36,align:"center"});
    y-=40; doc.text(cx,y,R.cIntro,{size:11,color:MUT,align:"center"});
    y-=40; doc.text(cx,y,d.name||R.namePh,{f:"I",size:30,align:"center",color:d.name?INK:"#a1a1a6"});
    y-=14; doc.line(cx-190,y,cx+190,y,LINE,0.8);
    y-=30; y-=doc.para(cx-215,y,R.cBody(prof),430,{size:11.5,align:"center",lh:16});
    y-=14; const mt=(p.dist?R.cMention.dist:R.cMention.pass).toUpperCase(), mw=pdfWidth(mt,"B",8.5,1)+28;
    doc.rrect(cx-mw/2,y-8,mw,24,12,{stroke:GOLD_L,w:0.9}); doc.text(cx,y,mt,{f:"B",size:8.5,color:GOLD,align:"center",tc:1});
    y-=58; const cols=[[`${p.pct} %`,R.cScore],[fmtDate(p.ts),R.cDate],[d.ref,R.cRef]];
    cols.forEach(([v,l],i)=>{ const x=cx+(i-1)*150; doc.text(x,y,v,{f:"B",size:13,align:"center"}); doc.text(x,y-16,l.toUpperCase(),{size:7.5,color:MUT,align:"center",tc:0.8}); });
    y-=48; doc.text(cx,y,R.cConcepts(acq,d.cs.length),{size:10,color:MUT,align:"center"});
    /* signature et sceau */
    const sy=210; doc.text(70,sy,R.cSign,{f:"B",size:11}); doc.text(70,sy-15,R.cSignSub,{size:9.5,color:MUT});
    const li="linkedin.com/in/jeanpierrelaicheong", lw=doc.text(70,sy-31,li,{size:9.5,color:BLUE}); doc.link(70,sy-34,lw,13,"https://www.linkedin.com/in/jeanpierrelaicheong");
    const scx=PDF_W-110, scy=sy-12; doc.circle(scx,scy,40,GOLD_L,1.1); doc.circle(scx,scy,24,GOLD_L,0.8);
    doc.arcText(scx,scy,30.5,`${L.brand.toUpperCase()} · 2024/1689 · 2026/1744 · `,{size:6.2,tc:0.9,start:Math.PI*0.97});
    doc.text(scx,scy-1,"AI",{f:"T",size:15,color:GOLD,align:"center"}); doc.text(scx,scy-11,"ACT",{f:"B",size:6,color:GOLD,align:"center",tc:1});
    doc.para(M+30,120,R.cDisc,CW-60,{size:7.5,color:MUT,align:"center",lh:10.5});
    doc.newPage();
  }

  /* Pages suivantes : relevé */
  const tFirst=doc.pages.length-1; let y=PDF_H-M;
  const ensure=(h,redraw)=>{ if(y-h<M+30){ doc.newPage(); y=PDF_H-M; if(redraw) redraw(); } };
  doc.text(M,y-8,L.brand.toUpperCase(),{f:"B",size:8,color:GOLD,tc:1.2});
  doc.text(M,y-30,R.tTitle,{f:"B",size:20});
  doc.text(PDF_W-M,y-8,`${R.cRef} ${d.ref}`,{size:8,color:MUT,align:"right"});
  doc.text(PDF_W-M,y-20,`${R.tIssued} ${fmtDate(Date.now())}`,{size:8,color:MUT,align:"right"});
  y-=44; doc.line(M,y,PDF_W-M,y,LINE,0.8); y-=20;
  const ids=[[R.tHolder,d.name||"—"],[R.tProfile,prof],[R.tExam,a?R.tExamV(a.pct,a.score,a.n,fmtDate(a.ts),X.attempts(d.n),a.passed?(a.dist?R.cMention.dist:R.cMention.pass):X.failed):R.tExamNone],[R.tLaw,R.tLawV]];
  for(let r=0;r<2;r++){ let h=0; for(let c=0;c<2;c++){ const [l,v]=ids[r*2+c], x=M+c*(CW/2+6);
      doc.text(x,y,l.toUpperCase(),{size:7,color:MUT,tc:0.6}); h=Math.max(h,doc.para(x,y-13,v,CW/2-14,{size:10,lh:13})); }
    y-=h+20; }
  const sect=t=>{ ensure(40); doc.text(M,y,t.toUpperCase(),{f:"B",size:8.5,tc:0.4}); y-=12; };
  /* tableau des modules */
  const mc=[M, M+250, M+330, M+430], thead=(cols,labels)=>{ doc.rrect(M,y-6,CW,18,0,{fill:"#f5f5f7"}); labels.forEach((t,i)=>doc.text(cols[i]+5,y,t.toUpperCase(),{f:"B",size:7,color:MUT,tc:0.4})); y-=20; };
  sect(R.tMods); thead(mc,[R.tMod,R.tQuiz,R.tExamCol,R.tStatus]);
  path().forEach(m=>{ const mo=modById(m), s=S.mods[m]||{}, ok=passed(m), ex=a&&a.byM[m], lines=pdfWrap(mo.title,"R",9.5,240);
    const h=lines.length*12+8; ensure(h,()=>thead(mc,[R.tMod,R.tQuiz,R.tExamCol,R.tStatus]));
    lines.forEach((l,i)=>doc.text(mc[0]+5,y-i*12,l,{size:9.5}));
    doc.text(mc[1]+5,y,s.best!=null?s.best+" %":"—",{size:9.5});
    if(ex){ const p=ex[0]/ex[1]; doc.rrect(mc[2]+5,y-0.5,50,4,2,{fill:"#e8e8ed"}); if(p>0) doc.rrect(mc[2]+5,y-0.5,Math.max(4,50*p),4,2,{fill:"#0071e3"}); doc.text(mc[2]+61,y,`${ex[0]}/${ex[1]}`,{size:9.5}); } else doc.text(mc[2]+5,y,"—",{size:9.5});
    pill(mc[3]+5,y, ok?R.modSt.ok:S.acquired.includes(m)?R.modSt.acq:R.modSt.todo, ok?"ok":S.acquired.includes(m)?"quiz":"none");
    y-=h-4; doc.line(M,y+8,PDF_W-M,y+8,"#ececf0",0.5); });
  y-=14;
  /* tableau des compétences */
  const cc=[M, M+410], chead=()=>thead(cc,[R.tCompetence,R.tStatus]);
  sect(`${R.tConcepts} · ${R.cConcepts(acq,d.cs.length)}`); chead();
  let lastMod=null;
  d.cs.forEach(x=>{ const m=modOfConcept(x.c.id);
    if(m!==lastMod){ ensure(40,chead); doc.rrect(M,y-6,CW,17,0,{fill:"#fafafc"}); doc.text(M+5,y,modById(m).title,{f:"B",size:9}); y-=19; lastMod=m; }
    const lines=pdfWrap(x.c.l,"R",9,395), h=lines.length*11.5+7; ensure(h,chead);
    lines.forEach((l,i)=>doc.text(cc[0]+5,y-i*11.5,l,{size:9})); pill(cc[1]+5,y,X.st[x.st],x.st);
    y-=h-3; doc.line(M,y+7,PDF_W-M,y+7,"#ececf0",0.5); });
  y-=6; ensure(40); y-=doc.para(M,y,R.tLegend,CW,{size:7.5,color:MUT,lh:10})+10;
  /* axes de progression */
  const work=d.cs.filter(x=>["part","ko","none"].includes(x.st));
  sect(R.tToWork);
  if(work.length) work.forEach(x=>{ const t=`• ${x.c.l} (${modById(modOfConcept(x.c.id)).title})`, lines=pdfWrap(t,"R",9.5,CW-10); ensure(lines.length*12+4); lines.forEach((l,i)=>doc.text(M+(i?8:0),y-i*12,l,{size:9.5})); y-=lines.length*12+3; });
  else { doc.text(M,y,R.tNoWork,{size:9.5}); y-=14; }
  const delivs=S.profile==="resp"?path().filter(m=>S.delivs[m]).map(m=>modById(m).title):[];
  if(delivs.length){ y-=8; sect(R.delivs); y-=doc.para(M,y,delivs.join(" · "),CW,{size:9.5,lh:12}); }
  y-=12; const meth=`${R.tMethod(a?a.n:examSize(),EXAM_PASS*100)} ${R.tVer}${S.lang==="fr"?" : ":": "}${CONTENT_VER}.`;
  ensure(pdfWrap(meth,"R",7.5,CW).length*10+pdfWrap(R.cDisc,"R",7.5,CW).length*10+16);
  y-=doc.para(M,y,meth,CW,{size:7.5,color:MUT,lh:10})+6; doc.para(M,y,R.cDisc,CW,{size:7.5,color:MUT,lh:10});
  /* pieds de page du relevé */
  const tPages=doc.pages.slice(tFirst), tot=tPages.length;
  tPages.forEach((pg,i)=>{ doc.cur=pg; doc.line(M,M,PDF_W-M,M,"#ececf0",0.5);
    doc.text(M,M-14,`${R.tTitle} · ${d.name||L.brand}`,{size:7.5,color:MUT}); doc.text(PDF_W-M,M-14,`${i+1} / ${tot}`,{size:7.5,color:MUT,align:"right"}); });
  return doc.output({title:`${d.passAtt?R.cTitle+" · ":""}${R.tTitle} · ${d.name||L.brand}`, author:d.name||"", creator:`${L.brand} (Jean-Pierre LAI-CHEONG)`, lang:L.htmlLang});
}
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
function savePDF(d, msgEl){
  const R=L.rp, bytes=reportPDF(d);
  const name=`${R.file}-${(d.name||"ai-act").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\w]+/g,"-").replace(/^-|-$/g,"")}.pdf`;
  const blob=new Blob([bytes],{type:"application/pdf"});
  const download=()=>{ const url=URL.createObjectURL(blob), aEl=document.createElement("a"); aEl.href=url; aEl.download=name; aEl.rel="noopener";
    document.body.appendChild(aEl); aEl.click(); setTimeout(()=>{ URL.revokeObjectURL(url); aEl.remove(); },60000); if(msgEl) msgEl.textContent=R.pdfDone; };
  if(isIOS() && navigator.canShare){
    try{ const file=new File([blob],name,{type:"application/pdf"});
      if(navigator.canShare({files:[file]})){ navigator.share({files:[file], title:R.tTitle}).then(()=>{ if(msgEl) msgEl.textContent=""; }).catch(e=>{ if(e&&e.name!=="AbortError") download(); }); return; } }catch(e){}
  }
  download();
}

/* ===================== ÉTAT ===================== */
const KEY = "aiact-parcours-v1";
const fresh = () => ({profile:null, placed:false, acquired:[], mods:{}, review:[], delivs:{}, drafts:{}, lang:null, exam:{attempts:[]}, run:null, last:null, learner:""});
let S = fresh();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); } catch(e) {}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} renderTabs(); }

let L, MODULES, PLACEMENT, PROFILES, ART, RGPD, ART_URL, RGPD_URL, DELIV, BANNED, ANNEX3, TRANS, TNAME, DOC_FOOT;
const T = {name:"", ai:"yes", excl:"no", banned:[], annexI:"no", annexIII:"emploi", d63:"no", profiling:"yes", trans:[], role:"deployer"};
function applyLang(lang){
  const prevName=TNAME;
  S.lang = (lang==="en") ? "en" : "fr";
  L = I18N[S.lang];
  ({MODULES, PLACEMENT, PROFILES, ART, RGPD, ART_URL, RGPD_URL, DELIV, BANNED, ANNEX3, TRANS, TNAME, DOC_FOOT, CONCEPTS, EXAM} = CONTENT[S.lang]);
  if(!T.name || T.name===prevName) T.name=TNAME;
  document.documentElement.lang = L.htmlLang;
  document.title = L.brand;
  document.getElementById("brand-name").textContent = L.brand;
  document.getElementById("brand-sub").textContent = L.brandSub;
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.lang===S.lang)));
  renderFoot();
}
function detectLang(){ try{ return (navigator.language||"fr").toLowerCase().startsWith("fr") ? "fr" : "en"; }catch(e){ return "fr"; } }

const modById = id => MODULES.find(m=>m.id===id);
const allQ = () => MODULES.flatMap(m=>m.quiz.map(q=>({...q, mod:m.id})));
const path = () => S.profile ? PROFILES[S.profile].paths : [];
const lvlMax = () => S.profile==="resp" ? 2 : 1;
const quizFor = m => m.quiz.filter(q=>q.lvl<=lvlMax());
const passed = id => !!(S.mods[id] && S.mods[id].passed);
function unlocked(id){ const p=path(); const i=p.indexOf(id); if(i<=0) return true; return p.slice(0,i).every(x=>passed(x)||S.acquired.includes(x)) || S.acquired.includes(id); }
function currentId(){ return path().find(id=>!passed(id)) || null; }
const esc = x => String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function renderFoot(){
  const f=L.foot;
  document.getElementById("foot").innerHTML=`
  <div class="foot-top">
    <span>${f.by} <b>Jean-Pierre LAI-CHEONG</b></span>
    <span class="contact">
      <a href="https://www.linkedin.com/in/jeanpierrelaicheong" target="_blank" rel="noopener">${f.li}</a>
      ${SHOW_EMAIL?`<span class="mail"><code id="mail-addr"></code><button class="copy" id="mail-copy" type="button">${f.copy}</button></span>`:""}
    </span>
  </div>
  <p class="disclaimer">${f.disc}</p>
  <p>${f.upd}</p>`;
  const mc=document.getElementById("mail-copy"); if(mc) mc.onclick=()=>{
    const b=document.getElementById("mail-copy"), done=t=>{b.textContent=t; setTimeout(()=>b.textContent=L.foot.copy,1800);};
    const sel=()=>{const r=document.createRange(); r.selectNodeContents(document.getElementById("mail-addr")); const w=getSelection(); w.removeAllRanges(); w.addRange(r); done(L.foot.selected);};
    try{ navigator.clipboard.writeText("").then(()=>done(L.foot.copied),sel); }catch(e){ sel(); }
  };
}

/* ===================== NAV ===================== */
let view = {name:"home"};
const app = document.getElementById("app");
function go(v){ if(typeof hideTip==="function") hideTip(true); if(exTimer){ clearInterval(exTimer); exTimer=null; } view=v; render(); window.scrollTo({top:0}); }
function renderTabs(){
  const t=document.getElementById("tabs");
  if(!S.profile||!S.placed){ t.innerHTML=""; return; }
  t.innerHTML=["dash","review","tool","report","settings"].map(k=>`<button data-go="${k}" aria-current="${view.name===k||(k==="dash"&&["module","quiz","deliv","examIntro","exam","examResult"].includes(view.name))}">${L.tabs[k]}${k==="review"&&S.review.length?`<span class="count">${S.review.length}</span>`:""}</button>`).join("");
  t.querySelectorAll("button").forEach(b=>b.onclick=()=>go({name:b.dataset.go}));
}
function render(){
  if(!S.profile) return renderWelcome();
  if(!S.placed) return renderPlacement();
  if(S.run && Date.now()>=S.run.end && view.name!=="exam") finishExam(true);
  ({dash:renderDash, home:renderDash, module:renderModule, quiz:renderQuiz, review:renderReview, tool:renderTool, settings:renderSettings, deliv:renderDeliv,
    examIntro:renderExamIntro, exam:renderExam, examResult:renderExamResult, report:renderReport}[view.name]||renderDash)();
  renderTabs();
}

/* ===================== POSITIONNEMENT ===================== */
let place = {i:0, ans:[]};
function renderPlacement(){
  const qs = PLACEMENT.filter(q=>path().includes(q.m)), P=L.pl;
  if(place.i>=qs.length){
    const acq = qs.filter((q,i)=>place.ans[i]===q.a).map(q=>q.m);
    const score = acq.length;
    app.innerHTML=`<div class="stack-lg" style="max-width:70ch">
      <p class="eyebrow">${P.eyebrow} · ${P.result}</p>
      <h1>${P.good(score,qs.length)}</h1>
      <p class="lede">${score<=qs.length*0.3?P.low:score>=qs.length*0.8?P.high:P.mid}</p>
      <div class="path">${qs.map((q,i)=>{const m=modById(q.m);const ok=place.ans[i]===q.a;return `<div class="step"><span class="num">${path().indexOf(q.m)+1}</span><div><h3>${m.title}</h3><p>${ok?P.right:P.work}</p></div><span class="chip ${ok?"acq":""}">${ok?P.acq:P.todo}</span></div>`}).join("")}</div>
      <div class="notice">${P.note}</div>
      <div class="row"><button class="btn" id="startp">${P.see}</button></div></div>`;
    document.getElementById("startp").onclick=()=>{S.acquired=acq; S.placed=true; save(); go({name:"dash"});};
    return;
  }
  const q=qs[place.i];
  app.innerHTML=`<div class="q">
    <p class="eyebrow">${P.eyebrow} · ${P.q(place.i+1,qs.length)}</p>
    <div class="progress-dots">${qs.map((_,i)=>`<i class="${i<place.i?"done":""}"></i>`).join("")}</div>
    <p class="prompt">${q.p}</p>
    <div class="opts">${q.o.map((o,j)=>`<label class="opt"><input type="radio" name="pl" id="pl${j}" value="${j}"> <span>${o}</span></label>`).join("")}
    <label class="opt"><input type="radio" name="pl" id="pl-x" value="-1"> <span>${P.dk}</span></label></div>
    <div class="row"><button class="btn" id="next" disabled>${P.next}</button><button class="btn quiet" id="skipall">${P.skip}</button></div></div>`;
  const nb=document.getElementById("next");
  app.querySelectorAll("input[name=pl]").forEach(r=>r.onchange=()=>nb.disabled=false);
  nb.onclick=()=>{ place.ans[place.i]=+app.querySelector("input[name=pl]:checked").value; place.i++; renderPlacement(); };
  document.getElementById("skipall").onclick=()=>{S.acquired=[]; S.placed=true; save(); go({name:"dash"});};
}

/* ===================== TABLEAU DE BORD ===================== */
function renderDash(){
  const p=path(), done=p.filter(passed).length, cur=currentId(), D=L.d;
  const pct=Math.round(done/p.length*100);
  const level = (bestAttempt()&&attempts().some(a=>a.passed)) ? D.lvExam : D.lv[pct>=100?3:pct>=50?2:pct>0?1:0];
  const delivTotal = S.profile==="resp"? p.length:0, delivDone=p.filter(id=>S.delivs[id]).length;
  app.innerHTML=`<div class="stack-lg">
   <div class="stack"><p class="eyebrow">${PROFILES[S.profile].label}</p><h1>${D.h1}</h1></div>
   <div class="kpis">
     <div class="kpi"><b>${done}/${p.length}</b><span>${D.valid}</span><div class="bar" style="margin-top:8px"><i style="width:${pct}%"></i></div></div>
     <div class="kpi"><b>${level}</b><span>${D.level}</span></div>
     <div class="kpi"><b>${S.review.length}</b><span>${D.toReview(S.review.length)}</span></div>
     ${S.profile==="resp"?`<div class="kpi"><b>${delivDone}/${delivTotal}</b><span>${D.delivs}</span></div>`:""}
   </div>
   ${cur?`<div class="panel row" style="justify-content:space-between"><div><p class="eyebrow">${D.next}</p><h3>${modById(cur).title}</h3></div><button class="btn" data-open="${cur}">${S.mods[cur]?.read?D.resume:D.start}</button></div>`:`<div class="stack" style="gap:12px"><p class="lede" style="max-width:none"><b style="color:var(--ink)">${D.done}.</b> ${D.doneSub}</p>${examPanel()}</div>`}
   <div class="path">${p.map((id,i)=>{const m=modById(id),ok=passed(id),un=unlocked(id),acq=S.acquired.includes(id),best=S.mods[id]?.best;
     const cls=ok?"passed":id===cur?"current":!un?"locked":"";
     return `<div class="step ${cls}"><span class="num">${ok?"✓":i+1}</span>
       <div><h3>${m.title}</h3><p>${m.goal}</p>
       <div class="row" style="gap:6px;margin-top:4px"><span class="chip">${m.dur}</span>${ok?`<span class="chip ok">${D.passed(best)}</span>`:""}${acq&&!ok?`<span class="chip acq">${D.acq}</span>`:""}${best!=null&&!ok?`<span class="chip">${D.best(best)}</span>`:""}${S.profile==="resp"&&S.delivs[id]?`<span class="chip ok">${D.dvDone}</span>`:""}</div></div>

/* ===================== QUIZ ===================== */
let Q=null;
const qById = id => allQ().find(q=>q.id===id);
function startQuiz(mid){ Q={mid, ids:quizFor(modById(mid)).map(q=>q.id), i:0, score:0, answered:false, review:false}; go({name:"quiz"}); }
function startReview(){ const ids=S.review.filter(id=>qById(id)); Q={mid:null, ids, i:0, score:0, answered:false, review:true}; go({name:"quiz"}); }
function renderQuiz(){
  if(!Q) return go({name:"dash"});
  const QQ=L.q, n=Q.ids.length;
  if(Q.i>=n) return renderQuizEnd();
  const q=qById(Q.ids[Q.i]);
  app.innerHTML=`<div class="q">
   <p class="eyebrow">${Q.review?QQ.revision:modById(Q.mid).title} · ${QQ.q(Q.i+1,n)}</p>
   <div class="progress-dots">${Q.ids.map((_,i)=>`<i class="${i<Q.i?"done":""}"></i>`).join("")}</div>
   <p class="prompt">${q.p}</p>
   <div class="opts" id="opts">${q.o.map((o,j)=>`<label class="opt" data-j="${j}"><input type="radio" name="qa" id="qa${j}" value="${j}"> <span>${o}</span></label>`).join("")}</div>
   <div id="fb"></div>
   <div class="row"><button class="btn" id="val" disabled>${QQ.validate}</button></div></div>`;
  const val=document.getElementById("val");
  app.querySelectorAll("input[name=qa]").forEach(r=>r.onchange=()=>{ if(!Q.answered) val.disabled=false; });
  val.onclick=()=>{
    if(Q.answered){ Q.i++; Q.answered=false; return renderQuiz(); }
    const j=+app.querySelector("input[name=qa]:checked").value, ok=j===q.a;
    Q.answered=true; if(ok) Q.score++;
    S.review = ok ? S.review.filter(x=>x!==q.id) : (S.review.includes(q.id)?S.review:[...S.review,q.id]); save();
    app.querySelectorAll("label.opt").forEach(l=>{const k=+l.dataset.j; if(k===q.a) l.classList.add("right"); else if(k===j) l.classList.add("wrong"); l.querySelector("input").disabled=true;});
    document.getElementById("fb").innerHTML=`<div class="feedback ${ok?"ok":"ko"}"><b>${ok?QQ.ok:QQ.ko}</b> ${q.e}${!ok?QQ.added:""}</div>`;
    val.textContent = Q.i+1<n?QQ.next:QQ.result;
  };
}
function renderQuizEnd(){
  const QQ=L.q, n=Q.ids.length, pct=n?Math.round(Q.score/n*100):0;
  if(Q.review){
    app.innerHTML=`<div class="stack" style="max-width:70ch"><p class="eyebrow">${QQ.revDone}</p><h1>${Q.score} / ${n}</h1><p class="lede">${S.review.length?QQ.left(S.review.length):QQ.empty}</p><div class="row"><button class="btn" id="b1">${QQ.myPath}</button></div></div>`;
    document.getElementById("b1").onclick=()=>go({name:"dash"}); return;
  }
  const m=modById(Q.mid), ok=pct>=PASS*100, st=S.mods[m.id]||{};
  if(!Q.recorded){ st.best=Math.max(st.best??0,pct); if(ok) st.passed=true; S.mods[m.id]=st; Q.recorded=true; save(); }
  const nxt=path()[path().indexOf(m.id)+1];
  app.innerHTML=`<div class="stack" style="max-width:70ch"><p class="eyebrow">${m.title}</p><h1>${pct} % ${ok?QQ.passed:QQ.failed}</h1>
   <p class="lede">${ok?(nxt?QQ.unlocked(modById(nxt).title):QQ.last):QQ.need(PASS*100)}</p>
   <div class="row">${ok&&nxt?`<button class="btn" id="b1">${QQ.nextMod}</button>`:`<button class="btn" id="b2">${ok?QQ.myPath:QQ.reread}</button>`}<button class="btn quiet" id="b3">${QQ.redo}</button></div></div>`;

}

const tplList = mid => DELIV[mid] || [];
const draft = tid => (S.drafts[tid] = S.drafts[tid] || {});
function fieldKeys(t){ const k=[]; t.sections.forEach(sec=>{ if(sec.type==="text") k.push(sec.id); else sec.rows.forEach((r,ri)=>{ for(let c=sec.fixed;c<sec.cols.length;c++) k.push(`${sec.id}:${ri}:${c}`); }); }); return k; }
function tplProgress(t){ const d=S.drafts[t.id]||{}, k=fieldKeys(t); return Math.round(k.filter(x=>(d[x]||"").trim()).length/k.length*100); }
function delivProgress(mid){ const l=tplList(mid); if(!l.length) return 0; return Math.round(l.reduce((a,t)=>a+tplProgress(t),0)/l.length); }

function toMarkdown(t){
  const d=S.drafts[t.id]||{}, cell=x=>(x||"").trim().replace(/\|/g,"\\|").replace(/\n/g,"<br>")||" ";
  let md=`# ${t.title}\n\n`;
  t.sections.forEach(sec=>{
    md+=`## ${sec.label}\n\n`;
    if(sec.type==="text") md+=`${(d[sec.id]||"").trim()||"_"+L.dv.todo+"_"}\n\n`;
    else{
      md+=`| ${sec.cols.join(" | ")} |\n| ${sec.cols.map(()=>"---").join(" | ")} |\n`;
      sec.rows.forEach((r,ri)=>{ md+="| "+sec.cols.map((_,c)=>c<sec.fixed?cell(r[c]):cell(d[`${sec.id}:${ri}:${c}`])).join(" | ")+" |\n"; });
      md+="\n";
    }
  });
  return md+"---\n\n_"+DOC_FOOT+"_\n";
}
function previewHTML(t){
  const d=S.drafts[t.id]||{}, para=x=>esc((x||"").trim()).replace(/\n/g,"<br>");

/* ===================== OUTIL DE QUALIFICATION ===================== */
function qualify(t){
  const X=L.Q, out={v:"",cls:"",obl:[],dates:[],notes:[]};
  if(t.ai==="no"){out.v=X.out;out.cls="v-out";out.notes.push(X.outN);return out;}
  if(t.excl==="yes"){out.v=X.excl;out.cls="v-out";out.notes.push(X.exclN);return out;}
  if(t.banned.length){out.v=X.ban;out.cls="v-int";out.obl.push(X.banO);out.dates.push(X.banD);out.notes.push(X.banN);return out;}
  let hr=false;
  if(t.annexI==="yes"){hr=true;out.v=X.a1;out.dates.push(X.a1D);}
  else if(t.annexIII!=="none"){
    if(t.profiling==="yes"){hr=true;out.notes.push(X.prof);}
    else if(t.d63==="yes"){out.notes.push(X.d63);}
    else hr=true;
    if(hr){out.v=X.a3(ANNEX3[t.annexIII]);out.dates.push(X.a3D);}
  }
  if(hr){out.cls="v-hr";
    if(t.role==="provider"||t.role==="switch") out.obl.push(...X.prov);
    if(t.role==="deployer"||t.role==="switch") out.obl.push(...X.depl);
  }
  const tr=t.trans;
  if(tr.length){ if(!hr){out.v=X.tr;out.cls="v-tr";}
    ["chat","gen","emo","deep","pub"].forEach(k=>{ if(tr.includes(k)) out.obl.push(X.trO[k]); });
    out.dates.push(X.trD);
  }
  if(!out.v){out.v=X.min;out.cls="v-min";out.notes.push(X.minN);}
  out.obl.push(X.lit);
  if(t.role==="switch") out.notes.push(X.sw);
  out.notes.push(X.gdpr);
  return out;
}

  document.getElementById("res").innerHTML=`<div class="verdict ${r.cls}">${r.v}</div>
   <div class="panel stack"><h3>${K.obl}</h3><ul style="margin:0;padding-left:1.2em">${r.obl.map(o=>`<li>${o}</li>`).join("")}</ul>
   ${r.dates.length?`<h3>${K.dates}</h3><ul style="margin:0;padding-left:1.2em">${r.dates.map(o=>`<li>${o}</li>`).join("")}</ul>`:""}
   <h3>${K.watch}</h3><ul style="margin:0;padding-left:1.2em">${r.notes.map(o=>`<li>${o}</li>`).join("")}</ul></div>
   <div class="stack"><textarea id="t-out" readonly aria-label="${K.synth}">${esc(txt)}</textarea><div class="row"><button class="btn ghost" id="cp">${K.copy}</button><span class="hint" id="cpm"></span></div></div>`;
  document.getElementById("cp").onclick=()=>copy(txt,"cpm","t-out");
}
function copy(txt,msgId,taId){
  const m=document.getElementById(msgId);
  const fallback=()=>{const ta=document.getElementById(taId); if(ta){ta.focus();ta.select();} m.textContent=L.copy.sel;};
  try{ navigator.clipboard.writeText(txt).then(()=>m.textContent=L.copy.ok,fallback);}catch(e){fallback();}
}

/* ===================== PROFIL ===================== */
function renderSettings(){
  const X=L.s, data=JSON.stringify(S);
  app.innerHTML=`<div class="stack-lg" style="max-width:70ch"><div class="stack"><p class="eyebrow">${X.eyebrow}</p><h1>${PROFILES[S.profile].label}</h1>
   <p class="lede">${X.lede}</p></div>
   <div class="panel stack"><h3>${X.change}</h3><p>${X.changeSub}</p>
    <div class="row">${Object.entries(PROFILES).map(([k,p])=>`<button class="btn ${S.profile===k?"":"ghost"}" data-p="${k}">${p.label}</button>`).join("")}</div></div>
   <div class="panel stack"><h3>${X.exp}</h3><textarea id="exp" readonly aria-label="${X.code}">${esc(data)}</textarea><div class="row"><button class="btn ghost" id="cpx">${X.copy}</button><span class="hint" id="cpxm"></span></div></div>
   <div class="panel stack"><h3>${X.imp}</h3><textarea id="imp" placeholder="${X.impPh}"></textarea><div class="row"><button class="btn ghost" id="doimp">${X.imp}</button><span class="hint" id="impm"></span></div></div>
   <div class="panel stack"><h3>${X.reset}</h3><p>${X.resetSub}</p>
    <div class="row"><button class="btn quiet" id="rst">${X.resetBtn}</button><span id="rstc"></span></div></div></div>`;
  app.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{S.profile=b.dataset.p; save(); renderSettings();});
  document.getElementById("cpx").onclick=()=>copy(data,"cpxm","exp");
  document.getElementById("doimp").onclick=()=>{const m=document.getElementById("impm");try{const o=JSON.parse(document.getElementById("imp").value);if(!o.profile)throw 0;S=Object.assign(fresh(),o);applyLang(S.lang||"fr");save();m.textContent=L.s.impOk;}catch(e){m.textContent=X.impKo;}};
  document.getElementById("rst").onclick=()=>{document.getElementById("rstc").innerHTML=`<button class="btn" id="rsty" style="background:var(--bad);border-color:var(--bad)">${X.confirm}</button>`;document.getElementById("rsty").onclick=()=>{const lg=S.lang;S=fresh();S.lang=lg;place={i:0,ans:[]};save();go({name:"home"});};};
}

/* ===================== INFO-BULLES ===================== */
function parseRef(label, isRgpd){
  const dict = isRgpd ? RGPD : ART;
  if(/^Chap\.\s*V\b/i.test(label)) return [{key:"chapV", e:ART.chapV}];
  const body = label.replace(/^((RGPD|GDPR)\s+)?art\.\s*/i,"");
  const range = body.match(/^(\d+)\s*(?:à|to|-)\s*(\d+)$/);
  if(range){
    const a=+range[1], b=+range[2];
    if(!isRgpd && b-a>8) return [{key:"chap3", e:ART.chap3}];
    const out=[]; for(let n=a;n<=b;n++) if(dict[n]) out.push({key:String(n), e:dict[n]}); return out;
  }
  const out=[]; const re=/(?<!\()\b(\d+[a-z]?)((?:\(\d+[a-z]?\)(?:\s*(?:et|and)\s*\(\d+[a-z]?\))*)?)/g; let m;
  while((m=re.exec(body))){
    const e=dict[m[1]]; if(!e) continue;
    const pars=[...(m[2]||"").matchAll(/\((\d+[a-z]?)\)/g)].map(x=>x[1]);
    out.push({key:m[1], e, pars});
  }
  return out;
}
const tip=document.createElement("div"); tip.id="tip"; tip.setAttribute("role","tooltip"); tip.hidden=true; document.body.appendChild(tip);
let tipFor=null, hideT=null;
function tipHTML(label,isRgpd){
  const refs=parseRef(label,isRgpd), X=L.tip;
  if(!refs.length) return null;
  const blocks=refs.map(({key,e,pars})=>{
    const ref = key.startsWith("chap") ? "" : `${isRgpd?X.gdpr:""}${X.art} ${key}`;
    const parHtml=(pars||[]).filter(p=>e.p&&e.p[p]).map(p=>`<div class="t-par"><b>${X.par} ${p}</b>${e.p[p]}</div>`).join("");
    const url = isRgpd ? RGPD_URL : (e.url || ART_URL(key));
    return `${ref?`<span class="t-ref">${ref}</span>`:""}<span class="t-title">${e.t}</span>
      ${parHtml || `<p>${e.s}</p>`}${e.l&&!parHtml?`<ul>${e.l.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}
      ${e.v?`<span><span class="verify">${X.verify}</span></span>`:""}
      <a href="${url}" target="_blank" rel="noopener">${X.read}</a>`;
  }).join(`<hr style="border:0;border-top:1px solid var(--line);margin:4px 0;width:100%">`);
  return `${blocks}<div class="t-foot"><span>${X.foot}</span><span>${isRgpd?X.srcG:X.src}</span></div>`;
}
function showTip(el){
  clearTimeout(hideT);
  if(tipFor===el && !tip.hidden) return;
  const html=tipHTML(el.textContent.trim(), el.classList.contains("rgpd")); if(!html) return;
  if(tipFor) tipFor.setAttribute("aria-expanded","false");
  tipFor=el; el.setAttribute("aria-expanded","true");
  tip.innerHTML=html; tip.hidden=false; placeTip(el);
}
function placeTip(el){
  const r=el.getBoundingClientRect(), w=tip.offsetWidth, h=tip.offsetHeight, vw=document.documentElement.clientWidth, vh=window.innerHeight;
  let left=Math.min(Math.max(16, r.left + r.width/2 - w/2), vw - w - 16);
  let top = (r.bottom + 8 + h <= vh - 8 || r.top < h + 16) ? r.bottom + 8 : r.top - h - 8;
  tip.style.left=left+"px"; tip.style.top=Math.max(8,top)+"px";
}
function hideTip(now){
  clearTimeout(hideT);
  const go=()=>{ tip.hidden=true; if(document.activeElement===tipFor) tipFor.blur(); if(tipFor) tipFor.setAttribute("aria-expanded","false"); tipFor=null; };
  now ? go() : (hideT=setTimeout(go,150));
}
function enhanceArts(root){
  root.querySelectorAll(".art:not([data-tip])").forEach(el=>{
    if(!parseRef(el.textContent.trim(), el.classList.contains("rgpd")).length) return;
    el.dataset.tip="1"; el.tabIndex=0; el.setAttribute("role","button"); el.setAttribute("aria-expanded","false");
    el.setAttribute("aria-label", el.textContent.trim()+" : "+L.tip.aria);
  });
}
new MutationObserver(()=>enhanceArts(app)).observe(app,{childList:true,subtree:true});
let lastPointer="mouse";
const onTip=t=>t && t.closest && t.closest(".art[data-tip], #tip");
document.addEventListener("pointerdown",e=>{ lastPointer=e.pointerType||"mouse"; },true);
document.addEventListener("pointerover",e=>{
  if(e.pointerType!=="mouse") return;
  const el=e.target.closest(".art[data-tip]");
  if(el) showTip(el); else if(e.target.closest("#tip")) clearTimeout(hideT);
});
document.addEventListener("pointerout",e=>{
  if(e.pointerType!=="mouse") return;
  if(onTip(e.target) && !onTip(e.relatedTarget)) hideTip();
});
document.documentElement.addEventListener("mouseleave",()=>hideTip(true));
document.addEventListener("click",e=>{
  const el=e.target.closest(".art[data-tip]");
  if(el){ e.preventDefault(); (lastPointer!=="mouse" && tipFor===el && !tip.hidden) ? hideTip(true) : showTip(el); return; }
  if(!e.target.closest("#tip")) hideTip(true);
});
document.addEventListener("focusin",e=>{ const el=e.target.closest(".art[data-tip]"); if(el && e.target.matches(":focus-visible")) showTip(el); else if(!e.target.closest("#tip")) hideTip(true); });
document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && !tip.hidden){ const f=tipFor; hideTip(true); if(f) f.focus({preventScroll:true}); }
  if((e.key==="Enter"||e.key===" ") && e.target.matches(".art[data-tip]")){ e.preventDefault(); showTip(e.target); }
});
window.addEventListener("scroll",()=>{ if(!tip.hidden && tipFor) placeTip(tipFor); },{passive:true});
window.addEventListener("resize",()=>hideTip(true));

/* ===================== DÉMARRAGE ===================== */
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{
  if(b.dataset.lang===S.lang) return;
  applyLang(b.dataset.lang); save();
  if(view.name==="quiz" && Q && Q.answered){ Q.i++; Q.answered=false; }
  const y=window.scrollY; hideTip(true); render(); window.scrollTo({top:y});
});
applyLang(S.lang || detectLang());
render();
enhanceArts(app);

</script>
